<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg: #020817;
      --bg-2: #0b1220;
      --panel: rgba(15, 23, 42, 0.95);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --button: #334155;
      --button-hover: #475569;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --success: #22c55e;
      --success-hover: #4ade80;
    }

    body {
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 55%);
      color: var(--text);
      margin: 0;
      font-family: Arial, sans-serif;
    }

    nav {
      background: #020b16;
      border-bottom: 1px solid rgba(96, 165, 250, 0.2);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: var(--panel);
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.12);
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 20px;
    }

    .back-btn, .reset-btn, .start-btn {
      background: var(--button);
      color: #fff;
      padding: 10px 20px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .back-btn:hover, .reset-btn:hover, .start-btn:hover {
      background: var(--button-hover);
    }

    .reset-btn {
      background: var(--danger);
    }

    .reset-btn:hover {
      background: var(--danger-hover);
    }

    .start-btn {
      background: var(--success);
      font-size: 18px;
      padding: 12px 30px;
    }

    .start-btn:hover {
      background: var(--success-hover);
    }

    .game-info {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 18px 0;
      font-size: 18px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .score-display, .high-score-display {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 10px 18px;
      color: var(--text);
    }

    .high-score-display {
      border-color: rgba(250, 204, 21, 0.7);
      color: #facc15;
    }

    .game-not-started {
      padding: 40px 20px;
      font-size: 18px;
      color: var(--text);
    }

    .controls-info {
      color: var(--muted);
      margin: 10px 0 20px;
    }

    canvas {
      border: 2px solid #fff;
      display: block;
      margin: 20px auto;
      background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
      touch-action: none;
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 600px) {
      .game-info {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="#contact">Contact</a></li>
      <li class="visitor-counter">
        <img src="https://visitor-badge.laobi.icu/badge?page_id=arjunmtamoria-jpg.github.io" alt="Visitor Count">
      </li>
    </ul>
  </nav>

  <div class="container">
    <div class="button-group">
      <a class="back-btn" href="games.html">← Back to Games</a>
      <button class="reset-btn" onclick="resetFlappyGame()">🔄 Reset Game</button>
    </div>

    <h1>🐦 Flappy Bird</h1>

    <div id="flappy-not-started" class="game-not-started">
      <p>Click the button below to start playing!</p>
      <button class="start-btn" onclick="startFlappyGameplay()">▶ Start Game</button>
    </div>

    <div id="flappy-gameplay" style="display: none;">
      <p class="controls-info">Click or Press Space to fly. On mobile, tap to fly!</p>
      <div class="game-info">
        <div class="score-display">Score: <span id="flappyScore">0</span></div>
        <div class="high-score-display">High Score: <span id="flappyHighScore">0</span></div>
      </div>
      <canvas id="flappyCanvas" width="400" height="600"></canvas>
    </div>
  </div>

  <script>
    const flappyCanvas = document.getElementById('flappyCanvas');
    const flappyCtx = flappyCanvas.getContext('2d');
    let highScores = { flappy: parseInt(localStorage.getItem('flappyHighScore')) || 0 };
    document.getElementById('flappyHighScore').textContent = highScores.flappy;

    let flappyGame = { bird: {x: 50, y: 300, width: 30, height: 30, velocity: 0}, pipes: [], score: 0, running: false, gravity: 0.35, flapPower: -10 };

    function saveHighScore(game, score) {
      localStorage.setItem(game + 'HighScore', score);
    }

    function startFlappyGameplay() {
      document.getElementById('flappy-not-started').style.display = 'none';
      document.getElementById('flappy-gameplay').style.display = 'block';
      flappyGame = { bird: {x: 50, y: 300, width: 30, height: 30, velocity: 0}, pipes: [], score: 0, running: true, gravity: 0.35, flapPower: -10 };
      document.addEventListener('keydown', flappyKeyHandler);
      document.addEventListener('click', flappyFlap);
      flappyCanvas.addEventListener('click', flappyFlap);
      flappyCanvas.addEventListener('touchstart', flappyFlap);
      flappyGameLoop();
    }

    function resetFlappyGame() {
      if (flappyGame.running) flappyGame.running = false;
      startFlappyGameplay();
    }

    function flappyFlap() {
      if (flappyGame.running) flappyGame.bird.velocity = flappyGame.flapPower;
    }

    function flappyKeyHandler(e) {
      if (e.key === ' ') {
        e.preventDefault();
        flappyFlap();
      }
    }

    function flappyGameLoop() {
      if (!flappyGame.running) return;
      flappyGame.bird.velocity += flappyGame.gravity;
      flappyGame.bird.y += flappyGame.bird.velocity;

      if (flappyGame.bird.y + flappyGame.bird.height > flappyCanvas.height || flappyGame.bird.y < 0) {
        flappyGame.running = false;
        alert('Game Over! Score: ' + flappyGame.score);
        return;
      }

      if (flappyGame.pipes.length === 0 || flappyGame.pipes[flappyGame.pipes.length - 1].x < 150) {
        flappyGame.pipes.push({x: flappyCanvas.width, gap: Math.random() * 180 + 120, scored: false});
      }

      for (let i = 0; i < flappyGame.pipes.length; i++) {
        flappyGame.pipes[i].x -= 3;
        if (flappyGame.pipes[i].x + 50 < flappyGame.bird.x && !flappyGame.pipes[i].scored) {
          flappyGame.score += 1;
          if (flappyGame.score > highScores.flappy) {
            highScores.flappy = flappyGame.score;
            saveHighScore('flappy', flappyGame.score);
            document.getElementById('flappyHighScore').textContent = flappyGame.score;
          }
          flappyGame.pipes[i].scored = true;
        }

        if (flappyGame.pipes[i].x < flappyGame.bird.x + flappyGame.bird.width && flappyGame.pipes[i].x + 50 > flappyGame.bird.x) {
          if (flappyGame.bird.y < flappyGame.pipes[i].gap || flappyGame.bird.y + flappyGame.bird.height > flappyGame.pipes[i].gap + 170) {
            flappyGame.running = false;
            alert('Game Over! Score: ' + flappyGame.score);
            return;
          }
        }

        if (flappyGame.pipes[i].x < -50) flappyGame.pipes.splice(i, 1);
      }

      flappyCtx.fillStyle = '#87CEEB';
      flappyCtx.fillRect(0, 0, flappyCanvas.width, flappyCanvas.height);
      flappyCtx.fillStyle = '#FFD700';
      flappyCtx.beginPath();
      flappyCtx.arc(flappyGame.bird.x + 15, flappyGame.bird.y + 15, 15, 0, Math.PI * 2);
      flappyCtx.fill();

      flappyCtx.fillStyle = '#228B22';
      flappyGame.pipes.forEach(p => {
        flappyCtx.fillRect(p.x, 0, 50, p.gap);
        flappyCtx.fillRect(p.x, p.gap + 170, 50, flappyCanvas.height - p.gap - 170);
      });

      document.getElementById('flappyScore').textContent = flappyGame.score;
      setTimeout(flappyGameLoop, 30);
    }
  </script>
</body>
</html>
