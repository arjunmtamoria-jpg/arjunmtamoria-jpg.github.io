<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Breakout</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08111f;color:#eef6ff;font:16px Arial,sans-serif;display:flex;justify-content:center;padding:18px}.game{text-align:center;width:min(100%,520px)}h1{margin:8px}p{color:#bdcbe0;line-height:1.5}.score{margin:12px}canvas{display:block;width:min(94vw,480px);height:auto;margin:auto;background:#07101d;border:2px solid #536b8a;border-radius:8px;touch-action:none}.buttons{display:flex;gap:12px;justify-content:center;margin:12px auto}.buttons button,#restart{min-width:100px;min-height:48px;padding:10px 18px;border:0;border-radius:8px;background:#1f5181;color:white;font-size:18px;font-weight:bold;touch-action:none}.buttons button:active{background:#3683ba}a{color:#7dd3fc}</style></head>
<body><main class="game"><h1>🧱 Breakout</h1><p>Keyboard: ← → or A/D. On mobile, use the buttons or drag on the board.</p><div class="score">Score: <b id="score">0</b> · Lives: <b id="lives">3</b></div><canvas id="board" width="480" height="600" aria-label="Breakout game"></canvas><div class="buttons"><button data-dir="-1" aria-label="Move paddle left">◀ LEFT</button><button data-dir="1" aria-label="Move paddle right">RIGHT ▶</button></div><p id="status" aria-live="polite"></p><button id="restart">Restart</button><p><a href="games.html">Back to games</a></p></main><script>
const c=document.getElementById('board'),ctx=c.getContext('2d'),W=c.width,H=c.height;let paddle,ball,bricks,score,lives,over,won,keys=new Set(),last=0,raf;
function reset(){if(raf)cancelAnimationFrame(raf);paddle={x:210,w:60};ball={x:240,y:520,vx:3,vy:-4,r:8};bricks=Array.from({length:5},(_,r)=>Array.from({length:8},(_,col)=>({x:20+col*56,y:55+r*28,w:48,h:18,on:true,color:['#ff5b6e','#ffad4d','#ffe05b','#6ade87','#53c7ff'][r]})));score=0;lives=3;over=won=false;document.getElementById('status').textContent='';last=0;draw();raf=requestAnimationFrame(frame)}
function draw(){ctx.fillStyle='#07101d';ctx.fillRect(0,0,W,H);for(const row of bricks)for(const b of row)if(b.on){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='rgba(255,255,255,.22)';ctx.fillRect(b.x,b.y,b.w,3)}ctx.fillStyle='#f5f7ff';ctx.fillRect(paddle.x,H-34,paddle.w,12);ctx.fillStyle='#ffe66d';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;if(over||won){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);ctx.fillStyle=won?'#ffe66d':'white';ctx.font='bold 32px Arial';ctx.textAlign='center';ctx.fillText(won?'YOU WIN!':'GAME OVER',W/2,H/2);ctx.textAlign='left'}}
function tick(dt){if(over||won)return;const direction=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x+direction*330*dt));ball.x+=ball.vx*60*dt;ball.y+=ball.vy*60*dt;if(ball.x<ball.r||ball.x>W-ball.r)ball.vx*=-1;if(ball.y<ball.r)ball.vy=Math.abs(ball.vy);if(ball.vy>0&&ball.y+ball.r>=H-34&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w){ball.vy=-Math.abs(ball.vy);ball.vx+=((ball.x-(paddle.x+paddle.w/2))/(paddle.w/2))*1.5}for(const row of bricks)for(const b of row)if(b.on&&ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){b.on=false;ball.vy*=-1;score+=10;break}if(ball.y>H){lives--;if(!lives){over=true;document.getElementById('status').textContent='Game over — press Enter or Restart'}else ball={x:240,y:520,vx:3,vy:-4,r:8}}if(bricks.flat().every(b=>!b.on)){won=true;document.getElementById('status').textContent='You cleared every brick!'}}function frame(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.04);last=t;tick(dt);draw();if(!over&&!won)raf=requestAnimationFrame(frame)}
document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if((over||won)&&e.key==='Enter')reset()});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-dir]').forEach(b=>{let id=null;const down=e=>{e.preventDefault();id=e.pointerId;b.setPointerCapture?.(id);keys.add(b.dataset.dir==='-1'?'a':'d')},up=e=>{e.preventDefault();keys.delete(b.dataset.dir==='-1'?'a':'d');id=null};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch'){const r=c.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)/r.width*W-paddle.w/2))}});c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect();paddle.x=Math.max(0,Math.min(W-paddle.w,(e.clientX-r.left)/r.width*W-paddle.w/2))});document.getElementById('restart').addEventListener('click',reset);reset();
</script></body></html>
