<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#24130e">
<title>I-Ready Pizza Shop</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff4df;background:#19110d;--gold:#ffcf68;--panel:#2b1d16;--muted:#ddc3a6}*{box-sizing:border-box}html,body{height:100%;height:100dvh;margin:0;overflow:hidden}body{display:flex;flex-direction:column;background:#19110d}button{font:inherit}.top{flex:none;background:linear-gradient(100deg,#352016,#21140f);border-bottom:2px solid #6f4528;padding:6px 12px;box-shadow:0 3px 12px #0006;z-index:2}.topline{height:36px;display:flex;align-items:center;justify-content:space-between;gap:8px}.brand{font-weight:900;font-size:clamp(1rem,2.4vw,1.35rem);white-space:nowrap}.top-actions{display:flex;gap:6px}.top-actions button,.dialog button{border:1px solid #916039;border-radius:8px;padding:6px 9px;background:#503421;color:#fff0d6;font-weight:750;cursor:pointer}.top-actions button:hover,.dialog button:hover{background:#70482a}.resources{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 0 1px}.resources::-webkit-scrollbar{display:none}.resource{flex:none;display:flex;align-items:center;gap:5px;padding:4px 8px;background:#160f0c;border:1px solid #6d4a2d;border-radius:8px;font-size:.82rem;font-weight:800;white-space:nowrap}.resource.money{color:#ffe284}.game{position:relative;flex:1;min-height:0;background:#b8c9a7}.game canvas{display:block;width:100%;height:100%;touch-action:none}.hint{position:absolute;left:10px;bottom:9px;padding:6px 9px;background:#21170edb;border:1px solid #ffffff44;border-radius:8px;color:#fff1ce;font-size:clamp(.68rem,1.4vw,.86rem);pointer-events:none}.shop-state{position:absolute;right:10px;top:10px;padding:6px 10px;border-radius:8px;background:#21170edd;border:1px solid #ffffff55;font-weight:800;font-size:.82rem}.shop-state.closed{color:#ffc7a6}.toast{position:absolute;top:50px;left:50%;transform:translateX(-50%);background:#24160feF;border:1px solid #ffcf68;border-radius:10px;padding:8px 13px;font-size:.9rem;font-weight:750;max-width:90%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s}.toast.show{opacity:1}.bottom{flex:none;min-height:34px;background:#24160f;color:#e3c9a8;border-top:1px solid #60402b;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.76rem}.bottom strong{color:#ffdc91}.dialog-backdrop{position:fixed;inset:0;z-index:9;background:#080503b8;display:none;align-items:center;justify-content:center;padding:14px}.dialog-backdrop.open{display:flex}.dialog{width:min(560px,100%);max-height:min(80dvh,600px);overflow:auto;background:linear-gradient(145deg,#39251a,#21150f);border:2px solid #a16d3e;border-radius:16px;padding:16px;box-shadow:0 20px 60px #000b}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog h2{margin:0;color:#ffe1a0;font-size:1.25rem}.dialog-close{font-size:1.1rem!important}.dialog p{color:var(--muted);margin:7px 0 12px;font-size:.9rem}.dialog-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.dialog-card{background:#1b120e;border:1px solid #67472e;border-radius:10px;padding:10px}.dialog-card strong{display:block}.dialog-card small{display:block;color:var(--muted);margin:4px 0 8px}.dialog-card button{width:100%}.dialog-card button:disabled{opacity:.45;cursor:not-allowed}.dialog-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.hidden-file{display:none}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:600px){.top{padding:5px 7px}.topline{height:32px}.top-actions button{padding:5px 7px;font-size:.72rem}.resource{padding:3px 6px;font-size:.74rem}.bottom{font-size:.68rem}.hint{max-width:76%}}
</style>
</head>
<body>
<header class="top">
  <div class="topline"><div class="brand">🍕 I-Ready Pizza Shop</div><div class="top-actions"><button id="openShopBtn" title="Open or close shop">Close shop</button><button id="exportBtn">Export</button><button id="importBtn">Import</button><button id="resetBtn" title="Reset progress safely">Reset…</button><input id="importFile" class="hidden-file" type="file" accept="application/json,.json"></div></div>
  <div class="resources" id="resources" aria-label="Money and ingredients"></div>
</header>
<main class="game" aria-label="Pizza shop game map">
  <canvas id="map" width="960" height="600" aria-label="Walk around the pizza shop neighborhood. Move with WASD or arrow keys and press E near a shop, customer, or oven. Rabbits love olives."></canvas>
  <div class="shop-state" id="shopState">🏪 SHOP OPEN</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="hint">WASD / arrows: walk · E: interact · Tap a customer to select · Rabbit customers love olives!</div>
</main>
<footer class="bottom"><span id="scoreLine">⭐ Score 0 · Customers 0</span><span id="taskLine"><strong>Tip:</strong> Walk to the market or upgrade shop.</span></footer>
<div class="dialog-backdrop" id="dialogBackdrop" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><section class="dialog"><div class="dialog-head"><h2 id="dialogTitle">Shop</h2><button class="dialog-close" id="dialogClose" aria-label="Close">✕</button></div><p id="dialogIntro"></p><div class="dialog-list" id="dialogList"></div><div class="dialog-footer" id="dialogFooter"></div></section></div>
<script>
(()=>{'use strict';
const KEY='iready-pizza-shop-save-v1';
const ING=[['dough','Dough','🥯'],['sauce','Sauce','🍅'],['cheese','Cheese','🧀'],['pepperoni','Pepperoni','🍖'],['mushroom','Mushrooms','🍄'],['olive','Olives','🫒'],['pineapple','Pineapple','🍍']].map(([id,name,icon])=>({id,name,icon}));
const VENDORS=[{id:'market',name:'Corner Grocer',icon:'🧺',mult:1},{id:'farm',name:'Farm Cart',icon:'🌻',mult:1.25},{id:'bulk',name:'Bulk Stand',icon:'📦',mult:.78}];
const UP={oven:{name:'Faster oven',icon:'🔥',info:'Pizzas cook faster.',base:45,max:5},decor:{name:'Cozy shop',icon:'🪴',info:'Customers leave bigger tips.',base:55,max:5},sign:{name:'Bright sign',icon:'✨',info:'Attract more customers.',base:65,max:5}};
const fresh=()=>({version:1,money:80,score:0,served:0,day:1,open:true,inventory:{dough:5,sauce:5,cheese:6,pepperoni:3,mushroom:3,olive:2,pineapple:2},upgrades:{oven:0,decor:0,sign:0},customers:[],selected:null,prepared:null,oven:0,nextId:1,player:{x:475,y:450}});
let s=fresh(),last=performance.now(),arrival=0,toastTimer;
const $=id=>document.getElementById(id),cash=n=>'$'+Math.floor(n);
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){toast('Autosave unavailable — export your save as a backup.')}}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return;const x=JSON.parse(raw);if(!x||x.version!==1)throw Error();const n=fresh();n.money=Math.max(0,+x.money||0);n.score=Math.max(0,+x.score||0);n.served=Math.max(0,+x.served||0);n.day=Math.max(1,+x.day||1);n.open=x.open!==false;ING.forEach(i=>n.inventory[i.id]=Math.max(0,Math.min(999,Math.floor(+x.inventory?.[i.id]||0))));Object.keys(UP).forEach(k=>n.upgrades[k]=Math.max(0,Math.min(UP[k].max,+x.upgrades?.[k]||0)));n.customers=n.open&&Array.isArray(x.customers)?x.customers.slice(0,4).map(c=>({...c,x:Math.max(180,Math.min(660,+c.x||360)),y:Math.max(140,Math.min(360,+c.y||240)),recipe:Array.isArray(c.recipe)?c.recipe.filter(id=>ING.some(i=>i.id===id)):['dough','sauce','cheese'],patience:Math.max(30,+c.patience||180),selected:false})):[];n.selected=null;n.prepared=null;n.oven=0;n.nextId=Math.max(1,+x.nextId||1);if(x.player&&Number.isFinite(+x.player.x)&&Number.isFinite(+x.player.y)){n.player.x=Math.max(80,Math.min(880,+x.player.x));n.player.y=Math.max(120,Math.min(535,+x.player.y))}s=n}catch(e){s=fresh()}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}
function resources(){ $('resources').innerHTML=`<span class="resource money">💰 ${cash(s.money)}</span><span class="resource">⭐ ${s.score}</span>`+ING.map(i=>`<span class="resource" title="${i.name}">${i.icon} ${s.inventory[i.id]}</span>`).join('');$('scoreLine').textContent=`⭐ Score ${s.score} · Customers ${s.served} · Shift ${s.day}`;$('shopState').textContent=s.open?'🏪 SHOP OPEN':'🌙 SHOP CLOSED';$('shopState').classList.toggle('closed',!s.open);$('openShopBtn').textContent=s.open?'Close shop':'Open shop';$('taskLine').innerHTML=s.prepared?`<strong>Pizza baking:</strong> ${Math.ceil(s.oven)}s remaining · return to the customer when ready.`:s.selected?`<strong>Order:</strong> ${recipeLabel(s.selected.recipe)} · go to the oven to cook.`:'<strong>Tip:</strong> Walk to a street vendor or the upgrade shop.'}
function recipeLabel(recipe){return recipe.filter(id=>!['dough','sauce','cheese'].includes(id)).map(id=>ING.find(i=>i.id===id)?.name||id).join(' + ')||'cheese'}
function spawnCustomer(){if(!s.open||s.customers.length>=4)return;const rabbit=Math.random()<.38;let toppings;if(rabbit){toppings=['olive',...(Math.random()<.35?['mushroom']:[])];}else{const sets=[['pepperoni'],['mushroom'],['pineapple'],['pepperoni','olive'],['mushroom','olive']];toppings=sets[Math.random()*sets.length|0]}const c={id:s.nextId++,kind:rabbit?'rabbit':'person',x:835,y:420,targetX:530+Math.random()*65,targetY:220+Math.random()*90,recipe:['dough','sauce','cheese',...toppings],patience:210,tip:4+Math.random()*5|0,arrived:false};s.customers.push(c);save()}
const canvas=$('map'),ctx=canvas.getContext('2d');const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function polygon(points,color,stroke='#ffffff35'){ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function label(t,x,y,size=12,color='#fff'){ctx.font=`bold ${size}px system-ui`;ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='#25180f99';ctx.strokeText(t,x,y);ctx.fillStyle=color;ctx.fillText(t,x,y)}
function drawPerson(x,y,color,kind='person',scale=1,player=false){ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(x,y+13*scale,10*scale,4*scale,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=color;ctx.fillRect(x-7*scale,y-3*scale,14*scale,17*scale);ctx.fillStyle='#f0bd91';ctx.beginPath();ctx.arc(x,y-10*scale,7*scale,0,Math.PI*2);ctx.fill();if(kind==='rabbit'){ctx.fillStyle='#f0bd91';ctx.beginPath();ctx.ellipse(x-4*scale,y-22*scale,3*scale,9*scale,-.18,0,Math.PI*2);ctx.ellipse(x+4*scale,y-22*scale,3*scale,9*scale,.18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ed9b9b';ctx.beginPath();ctx.ellipse(x-4*scale,y-22*scale,1.2*scale,6*scale,-.18,0,Math.PI*2);ctx.ellipse(x+4*scale,y-22*scale,1.2*scale,6*scale,.18,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle='#51341f';ctx.fillRect(x-7*scale,y-16*scale,14*scale,4*scale)}if(player){ctx.fillStyle='#56bd54';ctx.fillRect(x-9*scale,y-19*scale,18*scale,5*scale);label('YOU',x,y+27*scale,9*scale,'#fff2b0')}}
function tree(x,y){ctx.fillStyle='#775536';ctx.fillRect(x-4,y-22,8,27);ctx.fillStyle='#70be4f';ctx.fillRect(x-18,y-45,36,28);ctx.fillStyle='#91d65b';ctx.fillRect(x-13,y-52,26,19)}
function stall(x,color,text,icon){polygon([[x,474],[x+40,451],[x+115,472],[x+73,497]],'#735037');polygon([[x+7,449],[x+49,426],[x+111,445],[x+68,468]],color);polygon([[x+7,449],[x+7,464],[x+68,486],[x+68,468]],'#8b5434');polygon([[x+68,468],[x+111,445],[x+111,461],[x+68,486]],'#65402c');label(icon,x+59,458,19);label(text,x+60,514,10,'#fff0cf')}
function draw(){const w=960,h=600;ctx.clearRect(0,0,w,h);ctx.fillStyle='#cbd8be';ctx.fillRect(0,0,w,h);
 // block pavements, city street
 for(let y=0;y<600;y+=54)for(let x=0;x<960;x+=58){ctx.fillStyle=(x/58+y/54|0)%2?'#d8dfce':'#cbd7c4';ctx.fillRect(x,y,56,52);ctx.strokeStyle='#bdcbb8';ctx.strokeRect(x,y,56,52)}
 polygon([[0,386],[380,335],[960,448],[960,600],[360,486],[0,536]],'#697777','#e7e4d8');polygon([[0,399],[380,349],[960,462],[960,479],[360,468],[0,420]],'#c4c6b7','#ffffff55');
 for(let i=0;i<7;i++)polygon([[i*143+35,454-i*10],[i*143+78,448-i*10],[i*143+101,454-i*10],[i*143+58,460-i*10]],i%2?'#f7e9bf':'#e9dfbc','#fff8');
 // neighboring buildings and trees
 polygon([[32,124],[138,83],[255,120],[148,161]],'#a76c56');polygon([[32,124],[148,161],[148,260],[32,224]],'#d6b69e');polygon([[148,161],[255,120],[255,218],[148,260]],'#95604c');label('HOME',142,275,10,'#fff');tree(272,136);tree(715,115);tree(900,310);
 // pizza shop open cutaway: roofline and walls, visible interior
 ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(476,302,257,93,0,0,Math.PI*2);ctx.fill();
 polygon([[205,172],[445,82],[725,170],[485,259]],'#a64937','#693326');polygon([[205,172],[485,259],[485,414],[205,326]],'#e9e5d9','#948c7b');polygon([[485,259],[725,170],[725,325],[485,414]],'#b84f3b','#79372b');
 polygon([[225,174],[445,100],[704,176],[484,249]],'#d8c29d','#72513a');
 // tiled interior floor
 for(let r=0;r<5;r++)for(let c=0;c<7;c++){const x=244+c*31+r*35,y=174-c*11+r*11;polygon([[x,y],[x+34,y-12],[x+67,y],[x+33,y+12]],(r+c)%2?'#eadcc2':'#d6c3a4','#b09b7d')}
 // kitchen counter + ovens + dining tables
 polygon([[272,168],[365,133],[402,145],[310,180]],'#a55c38');polygon([[310,180],[402,145],[402,166],[310,201]],'#693c29');polygon([[327,155],[354,145],[354,170],[327,180]],'#34393a');polygon([[360,143],[386,134],[386,158],[360,168]],'#353a3b');label('OVEN',358,193,9,'#fff0c7');
 polygon([[540,178],[610,157],[645,168],[575,190]],'#ad633e');polygon([[575,190],[645,168],[645,184],[575,207]],'#6b3d2a');label('COUNTER',591,215,9,'#fff0c7');
 [[438,153],[491,178],[424,210]].forEach(([x,y])=>{ctx.fillStyle='#70442c';ctx.fillRect(x-14,y-7,28,16);ctx.fillStyle='#dfbd82';ctx.fillRect(x-17,y-11,34,6);ctx.fillStyle='#e7ae4a';ctx.beginPath();ctx.arc(x,y-9,4,0,Math.PI*2);ctx.fill()});
 label('PIZZA SHOP',465,116,14,'#ffe298');
 // front windows and entrance
 polygon([[225,269],[270,286],[270,329],[225,312]],'#7fc7d1','#5d5648');polygon([[292,293],[327,306],[327,352],[292,339]],'#58382b','#39251b');polygon([[653,292],[696,276],[696,321],[653,337]],'#84ced3','#655448');
 // physical in-shop customers and kitchen player
 s.customers.forEach(c=>{if(c.x<730&&c.y<410)drawPerson(c.x,c.y,c.kind==='rabbit'?'#d890bc':'#4c87b3',c.kind,.9);if(c.x<730&&c.y<410){label(c.kind==='rabbit'?'🫒':'🍕',c.x,c.y-34,12,c.kind==='rabbit'?'#fff':'#fff');if(s.selected===c.id)label('♥',c.x,c.y-47,12,'#ffec8a')}});
 // player
 drawPerson(s.player.x,s.player.y,'#4e9b55','person',1.15,true);
 // Upgrade building on right side
 polygon([[745,231],[827,197],[921,228],[839,263]],'#e4b54e');polygon([[745,231],[839,263],[839,359],[745,326]],'#d6ba91');polygon([[839,263],[921,228],[921,323],[839,359]],'#a96642');polygon([[764,234],[827,211],[901,236],[839,259]],'#c98648');polygon([[769,276],[799,287],[799,324],[769,313]],'#83cbd2');polygon([[851,282],[883,270],[883,324],[851,337]],'#493128');label('UPGRADE SHOP',837,377,11,'#fff0cb');
 // street vendors below storefront
 stall(198,'#bd5744','GROCER','🥫');stall(367,'#e0a33d','FARM CART','🥬');stall(536,'#55976b','BULK STAND','📦');
 tree(157,378);tree(725,434);
 // closed/open sign above shop
 ctx.fillStyle=s.open?'#386d40':'#684139';ctx.fillRect(405,65,112,25);label(s.open?'OPEN':'CLOSED',461,83,12,'#fff');
 // customer bubbles/orders visually above heads; no customer-name menu
 s.customers.forEach(c=>{if(c.x<730&&c.y<410){ctx.fillStyle='#fff7e6';ctx.beginPath();ctx.roundRect(c.x-33,c.y-67,66,23,8);ctx.fill();ctx.fillStyle='#493122';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.fillText(c.recipe.includes('olive')?'🫒 🍕':'🍕',c.x,c.y-51)}});
}
function moveToPointer(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*600/r.height}}
function isNear(x,y,tx,ty,dist=75){return Math.hypot(x-tx,y-ty)<dist}
function interact(){if(dialogOpen())return;const p=s.player;
 const vendor=VENDORS.map((v,i)=>({v,x:255+i*169,y:470})).find(a=>isNear(p.x,p.y,a.x,a.y,92));if(vendor){openVendor(vendor.v);return}
 if(isNear(p.x,p.y,835,316,110)){openUpgrade();return}
 if(s.selected){const c=s.customers.find(x=>x.id===s.selected);if(c&&isNear(p.x,p.y,c.x,c.y,85)){if(s.prepared&&s.oven<=0){serve();return}if(s.prepared){toast('Pizza is still baking — wait by the customer.');return}toast('Order selected. Walk to the oven and press E to cook.');return}}
 if(isNear(p.x,p.y,359,165,90)){if(!s.open){toast('The shop is closed. Open it to prepare orders.');return}if(!s.selected){toast('Tap or walk up to a customer to take their order.');return}cook();return}
 if(!s.open){toast('The shop is closed. Open it to welcome customers.');return}toast('Walk to a customer, the oven, a street vendor, or the upgrade shop.');}
function dialogOpen(){return $('dialogBackdrop').classList.contains('open')}
function openDialog(title,intro,html){$('dialogTitle').textContent=title;$('dialogIntro').textContent=intro;$('dialogList').innerHTML=html;$('dialogFooter').innerHTML='';$('dialogBackdrop').classList.add('open')}
function closeDialog(){$('dialogBackdrop').classList.remove('open');draw()}
function openVendor(v){if(!s.open){toast('Vendors are closed while your shop is closed.');return}openDialog(`${v.icon} ${v.name}`,'Buy ingredient bundles. These street stalls are right below your shop.',ING.map(i=>{const unit=Math.max(1,Math.round((['cheese','pepperoni'].includes(i.id)?7:5)*v.mult)),price=unit*3;return `<div class="dialog-card"><strong>${i.icon} ${i.name} · in stock: ${s.inventory[i.id]}</strong><small>Bundle of 3 · ${cash(price)}</small><button data-buy="${i.id}" ${s.money<price?'disabled':''}>Buy bundle</button></div>`}).join(''));$('dialogList').querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const i=ING.find(x=>x.id===b.dataset.buy),unit=Math.max(1,Math.round((['cheese','pepperoni'].includes(i.id)?7:5)*v.mult)),price=unit*3;if(s.money<price)return toast('Not enough money for that bundle.');s.money-=price;s.inventory[i.id]+=3;save();resources();openVendor(v);toast(`${i.name} restocked.`)})}
function openUpgrade(){openDialog('🪴 Upgrade Shop','Spend your earnings on permanent shop improvements.',Object.entries(UP).map(([id,u])=>{const level=s.upgrades[id],cost=u.base*(level+1);return `<div class="dialog-card"><strong>${u.icon} ${u.name} · level ${level}/${u.max}</strong><small>${u.info} ${level>=u.max?'Fully upgraded':'Next upgrade: '+cash(cost)}</small><button data-upgrade="${id}" ${level>=u.max||s.money<cost?'disabled':''}>${level>=u.max?'Fully upgraded':'Buy upgrade'}</button></div>`}).join(''));$('dialogList').querySelectorAll('[data-upgrade]').forEach(b=>b.onclick=()=>{const id=b.dataset.upgrade,u=UP[id],cost=u.base*(s.upgrades[id]+1);if(s.money<cost||s.upgrades[id]>=u.max)return toast('Not enough money for that upgrade.');s.money-=cost;s.upgrades[id]++;save();resources();openUpgrade();draw();toast(`${u.name} upgraded!`)})}
function cook(){const c=s.customers.find(x=>x.id===s.selected);if(!c||!s.open)return;const missing=c.recipe.find(id=>s.inventory[id]<=0);if(missing){toast(`Out of ${ING.find(i=>i.id===missing).name}. Visit a street vendor.`);return}c.recipe.forEach(id=>s.inventory[id]--);s.prepared={customerId:c.id};s.oven=Math.max(2,7-s.upgrades.oven);toast('Pizza in the oven! Wait a few seconds, then return to your customer.');save();resources();draw()}
function serve(){const c=s.customers.find(x=>x.id===s.selected);if(!c||!s.prepared||s.oven>0)return;const reward=18+c.tip+s.upgrades.decor*2;s.money+=reward;s.score+=c.kind==='rabbit'?125:100;s.served++;s.customers=s.customers.filter(x=>x.id!==c.id);s.selected=null;s.prepared=null;s.oven=0;toast(`${c.kind==='rabbit'?'Rabbit customer':'Customer'} loved the pizza! +${cash(reward)}`);save();resources();draw()}
function setOpen(value){s.open=value;if(!value){s.customers=[];s.selected=null;s.prepared=null;s.oven=0;arrival=0;toast('Shop closed. No customers will arrive.') }else{arrival=0;toast('Shop open! Customers can come in now.')}save();resources();draw()}
function exportSave(){const blob=new Blob([JSON.stringify({app:'iready-pizza-shop',version:1,save:s},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pizza-shop-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Save exported.')}
async function importSave(file){try{const d=JSON.parse(await file.text()),x=d.save||d;if(x.version!==1)throw Error('Not a pizza shop save.');if(!confirm('Replace this shop progress with the imported save?'))return;localStorage.setItem(KEY,JSON.stringify(x));load();resources();draw();toast('Progress imported.')}catch(e){toast(e.message||'Could not import that file.')}}
function resetSave(){if(prompt('To reset all shop progress, type RESET. This cannot be undone.')!=='RESET')return;if(!confirm('Last check: permanently erase money, ingredients, upgrades, and progress?'))return;localStorage.removeItem(KEY);s=fresh();resources();draw();toast('Shop progress reset.')}
canvas.addEventListener('pointerdown',e=>{const p=moveToPointer(e);for(const c of s.customers){if(Math.hypot(p.x-c.x,p.y-c.y)<45){s.selected=c.id;resources();draw();toast(c.kind==='rabbit'?'Rabbit order: olives are a must!':'Customer order selected.');save();return}}if(Math.hypot(p.x-s.player.x,p.y-s.player.y)>15){s.player.target=p;s.player.moving=true}});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(k==='e')interact();if(k==='escape')closeDialog();if(k===' '&&s.selected&&!s.prepared)interact()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const keys={};
$('dialogClose').onclick=closeDialog;$('dialogBackdrop').addEventListener('click',e=>{if(e.target===$('dialogBackdrop'))closeDialog()});$('openShopBtn').onclick=()=>setOpen(!s.open);$('exportBtn').onclick=exportSave;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importSave(e.target.files[0]);e.target.value=''};$('resetBtn').onclick=resetSave;
function update(dt){let dx=0,dy=0;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy++;if(dx||dy){const len=Math.hypot(dx,dy);s.player.x=clamp(s.player.x+dx/len*190*dt,35,925);s.player.y=clamp(s.player.y+dy/len*190*dt,80,560);s.player.moving=true}else if(s.player.moving&&s.player.target){const t=s.player.target,ox=t.x-s.player.x,oy=t.y-s.player.y,d=Math.hypot(ox,oy);if(d<7){s.player.moving=false;s.player.target=null}else{s.player.x+=ox/d*Math.min(d,190*dt);s.player.y+=oy/d*Math.min(d,190*dt)}}else s.player.moving=false;
 if(s.open){arrival+=dt;const gap=Math.max(7,15-s.upgrades.sign*1.5);if(arrival>=gap&&s.customers.length<4){arrival=0;spawnCustomer()}s.customers.forEach(c=>{if(!c.arrived){const dx=c.targetX-c.x,dy=c.targetY-c.y,d=Math.hypot(dx,dy);if(d<4){c.arrived=true;c.x=c.targetX;c.y=c.targetY}else{c.x+=dx/d*75*dt;c.y+=dy/d*75*dt}}else if(c.id!==s.selected)c.patience-=dt});const left=s.customers.filter(c=>c.patience<=0);if(left.length){s.customers=s.customers.filter(c=>c.patience>0);s.score=Math.max(0,s.score-left.length*10);if(left.some(c=>c.id===s.selected)){s.selected=null;s.prepared=null;s.oven=0}toast('A customer left after waiting.');save()}if(s.oven>0){s.oven=Math.max(0,s.oven-dt*(1+s.upgrades.oven*.16));if(s.oven===0){toast('Ding! Pizza ready. Return to your customer and press E.');save()}}} }
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(frame)}
load();resources();if(s.open&&!s.customers.length){arrival=12} $('dialogBackdrop').classList.remove('open');draw();requestAnimationFrame(frame);window.addEventListener('resize',draw);
})();
</script>
