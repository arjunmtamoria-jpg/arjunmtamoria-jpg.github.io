<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pac-Man</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070b1c;color:#f5f7ff;font:16px Arial,sans-serif;display:flex;justify-content:center;padding:18px}.game{text-align:center;width:min(100%,480px)}h1{margin:6px}.score{margin:10px}.board{width:min(95vw,456px);height:auto;display:block;margin:auto;background:#030613;border:2px solid #263981;border-radius:8px}.hint{color:#bac8e3;line-height:1.5}.pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,48px);gap:5px;justify-content:center;margin:12px}button{border:0;border-radius:8px;background:#203d76;color:white;font-size:20px;font-weight:bold;touch-action:manipulation}.pad button:active{background:#386bc0}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}a{color:#7dd3fc}</style>
</head>
<body><main class="game"><h1>🟡 Pac-Man</h1><div class="score">Dots left: <b id="dots">0</b> · Score: <b id="score">0</b></div><canvas id="maze" class="board" width="456" height="360" aria-label="Pac-Man maze"></canvas><p class="hint">Use arrow keys or the buttons. Eat every dot and avoid the ghosts.</p><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><p id="status" aria-live="polite"></p><button id="restart" style="padding:10px 18px">Restart</button><p><a href="games.html">Back to games</a></p></main>
<script>
const map=['###################','#........#........#','#.##.###.#.###.##..#','#.................#','#.##.#.#####.#.##..#','#....#...#...#.....#','####.###.#.###.#####','#......#...#.......#','###.##.#.#.#.##.####','#......#...#.......#','####.###.#.###.#####','#....#...#...#.....#','#.##.#.#####.#.##..#','#.................#','#........#........#','###################'];
const canvas=document.getElementById('maze'),ctx=canvas.getContext('2d'),tile=24,W=19,H=15;
let pellets,player,ghosts,score,ended,dir,wanted,loop;
function reset(){pellets=map.map(r=>r.split('').map(c=>c==='.'?1:0));player={x:1,y:1};ghosts=[{x:17,y:1,color:'#ff5d83'},{x:17,y:13,color:'#60e6ff'}];score=0;ended=false;dir='right';wanted='right';document.getElementById('status').textContent='';count();draw();}
function wall(x,y){return x<0||x>=W||y<0||y>=H||map[y][x]==='#';}
function step(entity,d){const vectors={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]},[dx,dy]=vectors[d];if(!wall(entity.x+dx,entity.y+dy)){entity.x+=dx;entity.y+=dy;return true}return false;}
function count(){let n=pellets.flat().reduce((a,b)=>a+b,0);document.getElementById('dots').textContent=n;document.getElementById('score').textContent=score;if(!n&&!ended){ended=true;document.getElementById('status').textContent='You cleared the maze! You win!';}}
function draw(){ctx.fillStyle='#030613';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(map[y][x]==='#'){ctx.fillStyle='#1937a5';ctx.fillRect(x*tile,y*tile,tile,tile);ctx.strokeStyle='#3159dd';ctx.strokeRect(x*tile+3,y*tile+3,tile-6,tile-6);}else if(pellets[y][x]){ctx.fillStyle='#ffe9ae';ctx.beginPath();ctx.arc(x*tile+tile/2,y*tile+tile/2,3,0,Math.PI*2);ctx.fill();}}ctx.fillStyle='#ffd62f';ctx.beginPath();ctx.arc(player.x*tile+12,player.y*tile+12,10,.2,Math.PI*1.8);ctx.lineTo(player.x*tile+12,player.y*tile+12);ctx.fill();for(const g of ghosts){ctx.fillStyle=g.color;ctx.beginPath();ctx.arc(g.x*tile+12,g.y*tile+12,10,Math.PI,0);ctx.lineTo(g.x*tile+22,g.y*tile+23);ctx.lineTo(g.x*tile+17,g.y*tile+19);ctx.lineTo(g.x*tile+12,g.y*tile+23);ctx.lineTo(g.x*tile+7,g.y*tile+19);ctx.lineTo(g.x*tile+2,g.y*tile+23);ctx.closePath();ctx.fill();ctx.fillStyle='white';ctx.fillRect(g.x*tile+7,g.y*tile+9,4,5);ctx.fillRect(g.x*tile+14,g.y*tile+9,4,5);}if(ended){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.font='bold 21px Arial';ctx.textAlign='center';ctx.fillText(document.getElementById('status').textContent.includes('win')?'YOU WIN!':'GAME OVER',canvas.width/2,canvas.height/2);ctx.textAlign='start';}}
function tick(){if(ended)return;if(step(player,wanted))dir=wanted;else step(player,dir);if(pellets[player.y][player.x]){pellets[player.y][player.x]=0;score+=10;count();}for(const g of ghosts){const options=['up','down','left','right'].filter(d=>{const [dx,dy]={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d];return !wall(g.x+dx,g.y+dy)});if(options.length){options.sort(()=>Math.random()-.5);step(g,options[0]);}if(g.x===player.x&&g.y===player.y){ended=true;document.getElementById('status').textContent='Caught by a ghost — game over!';}}count();draw();}
document.addEventListener('keydown',e=>{const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key];if(d){e.preventDefault();wanted=d;}if(ended&&e.key==='Enter')reset();});document.querySelector('.pad').addEventListener('click',e=>{if(e.target.dataset.dir)wanted=e.target.dataset.dir;});document.getElementById('restart').addEventListener('click',reset);reset();loop=setInterval(tick,145);
</script></body></html>
