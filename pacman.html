<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Pac-Man</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#070b1c;color:#f5f7ff;font:16px Arial,sans-serif;display:flex;justify-content:center;padding:18px}.game{text-align:center;width:min(100%,480px)}h1{margin:6px}.score{margin:10px}.board{width:min(95vw,456px);height:auto;display:block;margin:auto;background:#030613;border:2px solid #263981;border-radius:8px;touch-action:none}.hint{color:#bac8e3;line-height:1.5}.pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,48px);gap:5px;justify-content:center;margin:12px}.pad button{border:0;border-radius:8px;background:#203d76;color:white;font-size:20px;font-weight:bold;touch-action:manipulation}.pad button:active{background:#386bc0}.pad .up{grid-column:2}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}a{color:#7dd3fc}</style></head>
<body><main class="game"><h1>🟡 Pac-Man</h1><div class="score">Dots left: <b id="dots">0</b> · Score: <b id="score">0</b></div><canvas id="maze" class="board" width="456" height="360" aria-label="Pac-Man maze"></canvas><p class="hint">Arrow keys or WASD, or tap the direction pad. Eat every dot and avoid ghosts.</p><div class="pad"><button class="up" data-dir="up" aria-label="Up">▲</button><button class="left" data-dir="left" aria-label="Left">◀</button><button class="down" data-dir="down" aria-label="Down">▼</button><button class="right" data-dir="right" aria-label="Right">▶</button></div><p id="status" aria-live="polite"></p><button id="restart" style="padding:10px 18px">Restart</button><p><a href="games.html">Back to games</a></p></main>
<script>
const map=['###################','#........#........#','#.##.###.#.###.##..#','#.................#','#.##.#.#####.#.##..#','#....#...#...#.....#','####.###.#.###.#####','#......#...#.......#','###.##.#.#.#.##.####','#......#...#.......#','####.###.#.###.#####','#....#...#...#.....#','#.##.#.#####.#.##..#','#.................#','#........#........#','###################'];
const canvas=document.getElementById('maze'),ctx=canvas.getContext('2d'),tile=24,W=19,H=15,dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};let pellets,player,ghosts,score,ended,wanted,lastTime=0,raf;
function reset(){if(raf)cancelAnimationFrame(raf);pellets=map.map(r=>r.split('').map(c=>c==='.'?1:0));player={x:1.5*tile,y:1.5*tile,dir:'right'};ghosts=[{x:17.5*tile,y:1.5*tile,dir:'left',color:'#ff5d83',think:0},{x:17.5*tile,y:13.5*tile,dir:'up',color:'#60e6ff',think:0}];score=0;ended=false;wanted='right';lastTime=0;document.getElementById('status').textContent='';updateHud();draw();raf=requestAnimationFrame(frame);}
function wallCell(x,y){return x<0||x>=W||y<0||y>=H||map[y][x]==='#'}function wallAt(px,py){return wallCell(Math.floor(px/tile),Math.floor(py/tile))}function updateHud(){const remaining=pellets.flat().reduce((a,b)=>a+b,0);document.getElementById('dots').textContent=remaining;document.getElementById('score').textContent=score;if(!remaining&&!ended){ended=true;document.getElementById('status').textContent='You cleared the maze! You win!'}}function atCenter(v){return Math.abs((v%tile)-tile/2)<2}
function move(e,distance,isPlayer){if(isPlayer&&atCenter(e.x)&&atCenter(e.y)&&!wallCell(Math.floor(e.x/tile)+dirs[wanted][0],Math.floor(e.y/tile)+dirs[wanted][1]))e.dir=wanted;if(!e.dir)return;const[dx,dy]=dirs[e.dir],nx=e.x+dx*distance,ny=e.y+dy*distance;if(wallAt(nx+dx*tile*.42,ny+dy*tile*.42)){e.x=Math.round((e.x-tile/2)/tile)*tile+tile/2;e.y=Math.round((e.y-tile/2)/tile)*tile+tile/2;if(isPlayer)e.dir=null;return}e.x=nx;e.y=ny}
function chooseGhost(g){if(!atCenter(g.x)||!atCenter(g.y))return;const gx=Math.floor(g.x/tile),gy=Math.floor(g.y/tile),options=Object.keys(dirs).filter(d=>!wallCell(gx+dirs[d][0],gy+dirs[d][1]));if(!options.length)return;const reverse={up:'down',down:'up',left:'right',right:'left'}[g.dir],choices=options.filter(d=>d!==reverse);const list=choices.length?choices:options;list.sort((a,b)=>{const[ax,ay]=dirs[a],[bx,by]=dirs[b];return Math.hypot(gx+ax-Math.floor(player.x/tile),gy+ay-Math.floor(player.y/tile))-Math.hypot(gx+bx-Math.floor(player.x/tile),gy+by-Math.floor(player.y/tile))});g.dir=Math.random()<.78?list[0]:list[Math.floor(Math.random()*list.length)]}
function update(dt){if(ended)return;move(player,115*dt,true);const px=Math.floor(player.x/tile),py=Math.floor(player.y/tile);if(pellets[py]&&pellets[py][px]){pellets[py][px]=0;score+=10;updateHud()}for(const g of ghosts){g.think-=dt;if(g.think<=0){chooseGhost(g);g.think=.12}move(g,82*dt,false);if(Math.hypot(player.x-g.x,player.y-g.y)<tile*.63){ended=true;document.getElementById('status').textContent='Caught by a ghost — game over!'}}}
function draw(){ctx.fillStyle='#030613';ctx.fillRect(0,0,canvas.width,canvas.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++){if(map[y][x]==='#'){ctx.fillStyle='#1937a5';ctx.fillRect(x*tile,y*tile,tile,tile);ctx.strokeStyle='#3159dd';ctx.strokeRect(x*tile+3,y*tile+3,tile-6,tile-6)}else if(pellets[y][x]){ctx.fillStyle='#ffe9ae';ctx.beginPath();ctx.arc(x*tile+12,y*tile+12,3,0,Math.PI*2);ctx.fill()}}const v=dirs[player.dir||wanted],angle=Math.atan2(v[1],v[0]);ctx.fillStyle='#ffd62f';ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.arc(player.x,player.y,10,angle+.35,angle+Math.PI*2-.35);ctx.closePath();ctx.fill();for(const g of ghosts){ctx.fillStyle=g.color;ctx.beginPath();ctx.arc(g.x,g.y,10,Math.PI,0);ctx.lineTo(g.x+10,g.y+11);ctx.lineTo(g.x+5,g.y+7);ctx.lineTo(g.x,g.y+11);ctx.lineTo(g.x-5,g.y+7);ctx.lineTo(g.x-10,g.y+11);ctx.closePath();ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(g.x-4,g.y-1,2.8,0,Math.PI*2);ctx.arc(g.x+4,g.y-1,2.8,0,Math.PI*2);ctx.fill()}if(ended){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='white';ctx.font='bold 21px Arial';ctx.textAlign='center';ctx.fillText(document.getElementById('status').textContent.includes('win')?'YOU WIN!':'GAME OVER',canvas.width/2,canvas.height/2);ctx.textAlign='start'}}function frame(now){if(!lastTime)lastTime=now;const dt=Math.min((now-lastTime)/1000,.04);lastTime=now;update(dt);draw();if(!ended)raf=requestAnimationFrame(frame)}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase(),d={arrowup:'up',arrowdown:'down',arrowleft:'left',arrowright:'right',w:'up',s:'down',a:'left',d:'right'}[k];if(d){e.preventDefault();wanted=d}if(ended&&e.key==='Enter')reset()});document.querySelector('.pad').addEventListener('pointerdown',e=>{const d=e.target.closest('button')?.dataset.dir;if(d){e.preventDefault();wanted=d}});document.getElementById('restart').addEventListener('click',reset);reset();
</script></body></html>
