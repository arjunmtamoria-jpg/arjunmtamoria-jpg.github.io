<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic True Levels</title>
  <style>
    :root {
      --panel: rgba(15, 23, 42, 0.88);
      --panel-border: rgba(255,255,255,.2);
      --text: #edf6ff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(#071824, #0b1b2a 45%, #111827);
    }
    body { display: flex; justify-content: center; padding: 18px 12px 36px; }
    .wrap {
      width: min(1000px, 96vw);
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      box-shadow: 0 20px 42px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 12px; text-align: center; font-size: clamp(26px, 4vw, 40px); }
    .hud { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 12px; font-weight: 700; }
    .hud span { padding: 8px 14px; min-width: 120px; text-align: center; background: rgba(15,23,42,.9); border: 2px solid rgba(148,163,184,.42); border-radius: 9px; }
    canvas { display: block; width: 100%; height: auto; border: 2px solid rgba(255,255,255,.85); border-radius: 7px; background: #7fd7ff; }
    .controls { margin-top: 12px; text-align: center; color: #dfe7ef; font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>SONIC TRUE LEVELS</h1>
    <div class="hud">
      <span>Rings: <b id="rings">0</b></span>
      <span>Stage: <b id="stage">Green Hill</b></span>
      <span>Lives: <b id="lives">3</b></span>
    </div>
    <canvas id="game" width="960" height="420" aria-label="Sonic platform game"></canvas>
    <div class="controls">Move: ← / → or A / D · Jump: Space / ↑ / W · Spin: Shift / S<br>Press 1 for Green Hill or 2 for Marble Zone. There is no wooden platform in Green Hill.</div>
  </main>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const ringsLabel = document.getElementById('rings');
  const stageLabel = document.getElementById('stage');
  const keys = new Set();
  const WORLD_WIDTH = 2600;
  const GROUND_Y = 342;

  const stages = [
    {
      name: 'Green Hill', skyTop: '#08a8f4', skyBottom: '#b8efff',
      grass: '#27c840', grassLight: '#70e546', grassDark: '#138a32',
      dirt: '#9b542b', dirtDark: '#542b1c', dirtLight: '#c87a3b',
      hillFar: '#d58a27', hillNear: '#55bd39', palm: true, cave: false,
      bees: [{x: 510, y: 205}, {x: 1120, y: 190}, {x: 1870, y: 210}], bats: []
    },
    {
      name: 'Marble Zone', skyTop: '#4d79b5', skyBottom: '#b6c4df',
      grass: '#9992a9', grassLight: '#b5abc2', grassDark: '#716b81',
      dirt: '#765b89', dirtDark: '#40354e', dirtLight: '#a184b1',
      hillFar: '#675a78', hillNear: '#827a98', palm: false, cave: true,
      bees: [{x: 560, y: 210}, {x: 1450, y: 190}], bats: [{x: 680, y: 180}, {x: 1550, y: 150}, {x: 2210, y: 180}]
    }
  ];

  const game = {
    stage: 0, camera: 0, time: 0, rings: 0, lives: 3,
    player: { x: 90, y: GROUND_Y - 42, vx: 0, vy: 0, w: 30, h: 42, grounded: true, spin: false },
    ringObjects: Array.from({length: 24}, (_, i) => ({x: 170 + i * 96, y: 270 - (i % 3) * 24, collected: false}))
  };

  function updateHud() {
    ringsLabel.textContent = game.rings;
    stageLabel.textContent = stages[game.stage].name;
  }

  function drawCloud(x, y, scale = 1) {
    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI * 2); ctx.arc(23, -8, 26, 0, Math.PI * 2); ctx.arc(52, 1, 19, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawPalm(x, baseY, scale = 1) {
    ctx.save(); ctx.translate(x, baseY); ctx.scale(scale, scale);
    // Straight, long brown rectangular trunk.
    ctx.fillStyle = '#87451f'; ctx.fillRect(-8, -102, 16, 102);
    ctx.fillStyle = '#aa6330'; ctx.fillRect(-5, -101, 5, 98);
    const crownY = -98;
    // Five broad classic fan leaves. Each frond is a parallelogram with a pointed triangle tip.
    const fronds = [
      {a: -2.72, len: 88}, {a: -2.12, len: 94}, {a: -1.57, len: 84},
      {a: -1.02, len: 94}, {a: -0.42, len: 88}
    ];
    for (let i = 0; i < fronds.length; i++) {
      const {a, len} = fronds[i];
      const ux = Math.cos(a), uy = Math.sin(a), px = -uy, py = ux;
      const sx = 0, sy = crownY;
      const shoulder = len * .69, width = 12;
      const bx = sx + ux * shoulder, by = sy + uy * shoulder;
      const tx = sx + ux * len, ty = sy + uy * len;
      ctx.fillStyle = i % 2 ? '#0da943' : '#18bd43';
      ctx.beginPath();
      ctx.moveTo(sx + px * 5, sy + py * 5);
      ctx.lineTo(bx + px * width, by + py * width);
      ctx.lineTo(bx - px * width, by - py * width);
      ctx.lineTo(sx - px * 5, sy - py * 5);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(bx + px * width, by + py * width);
      ctx.lineTo(tx, ty);
      ctx.lineTo(bx - px * width, by - py * width);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = '#8b4b22'; ctx.fillRect(-5, crownY - 5, 10, 10);
    ctx.restore();
  }

  function drawBackdrop(level) {
    const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sky.addColorStop(0, level.skyTop); sky.addColorStop(1, level.skyBottom);
    ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < 7; i++) {
      const x = ((i * 190 - game.camera * .12) % 1320 + 1320) % 1320 - 120;
      drawCloud(x, 58 + (i % 3) * 34, .72 + (i % 2) * .16);
    }

    // Distant, jagged GHZ-style mountain ridge adds depth behind the rolling hills.
    ctx.fillStyle = level.hillFar;
    ctx.beginPath(); ctx.moveTo(0, 275);
    for (let x = -30; x <= canvas.width + 30; x += 38) {
      const worldX = x + game.camera * .18;
      const peak = 205 + Math.sin(worldX * .018) * 20 + Math.sin(worldX * .043) * 11;
      ctx.lineTo(x, peak); ctx.lineTo(x + 19, peak + 28);
    }
    ctx.lineTo(canvas.width, 342); ctx.lineTo(0, 342); ctx.closePath(); ctx.fill();

    // More rounded hills at several scales, scrolling at different parallax speeds.
    for (let layer = 0; layer < 2; layer++) {
      ctx.fillStyle = layer === 0 ? level.hillNear : level.hillFar;
      const spacing = layer === 0 ? 230 : 310;
      const speed = layer === 0 ? .30 : .16;
      const base = layer === 0 ? 335 : 305;
      for (let i = -2; i < 8; i++) {
        const x = i * spacing - ((game.camera * speed) % spacing);
        const w = layer === 0 ? 250 : 330;
        const h = (layer === 0 ? 75 : 95) + ((i + 2) % 3) * 14;
        ctx.beginPath(); ctx.moveTo(x, base);
        ctx.quadraticCurveTo(x + w * .5, base - h * 2, x + w, base);
        ctx.lineTo(x + w, 355); ctx.lineTo(x, 355); ctx.closePath(); ctx.fill();
      }
    }

    if (level.palm) {
      for (let i = -1; i < 7; i++) {
        const x = i * 260 - (game.camera % 260) + 145;
        drawPalm(x, GROUND_Y, .78 + ((i + 1) % 3) * .12);
      }
    }
  }

  function drawTerrain(level) {
    const y = GROUND_Y;
    ctx.fillStyle = level.dirt; ctx.fillRect(0, y, canvas.width, canvas.height - y);
    const tile = 24, offset = game.camera % tile;
    for (let x = -tile; x < canvas.width + tile; x += tile) {
      const col = Math.floor((x + offset) / tile);
      ctx.fillStyle = ((col % 2 + 2) % 2 === 0) ? level.dirt : level.dirtDark;
      ctx.fillRect(x - offset, y, tile, 28);
      ctx.fillStyle = level.dirtLight;
      ctx.fillRect(x - offset + 3, y + 3, 5, 5);
    }
    ctx.fillStyle = level.grass; ctx.fillRect(0, y - 15, canvas.width, 15);
    ctx.fillStyle = level.grassLight; ctx.fillRect(0, y - 15, canvas.width, 5);
    ctx.fillStyle = level.grassDark;
    for (let x = 0; x < canvas.width + 14; x += 14) ctx.fillRect(x, y - 7, 8, 4);

    if (level.cave) {
      // Openings are recessed below the main path, with visible lava and stone ledges.
      const holes = [{x: 370, w: 120}, {x: 980, w: 150}, {x: 1580, w: 130}, {x: 2200, w: 150}];
      for (const hole of holes) {
        const hx = hole.x - game.camera;
        ctx.fillStyle = '#201c2b'; ctx.fillRect(hx, y, hole.w, 78);
        ctx.fillStyle = '#655875'; ctx.fillRect(hx - 8, y, hole.w + 16, 9);
        ctx.fillStyle = '#f05b24'; ctx.fillRect(hx + 5, y + 56, hole.w - 10, 22);
        ctx.fillStyle = '#ffc24a';
        for (let bx = hx + 10; bx < hx + hole.w - 8; bx += 28) ctx.fillRect(bx, y + 57 + Math.sin(game.time * .08 + bx) * 2, 14, 4);
      }
    }
  }

  function drawRing(ring) {
    if (ring.collected) return;
    const x = ring.x - game.camera;
    if (x < -20 || x > canvas.width + 20) return;
    ctx.lineWidth = 4; ctx.strokeStyle = '#ffcb28';
    ctx.beginPath(); ctx.ellipse(x, ring.y, 8, 11, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff3a7';
    ctx.beginPath(); ctx.ellipse(x, ring.y, 4, 7, 0, 0, Math.PI * 2); ctx.stroke();
  }

  function drawSonic() {
    const p = game.player;
    const x = p.x - game.camera;
    const y = p.y;
    ctx.save(); ctx.translate(x + p.w / 2, y + p.h / 2);
    if (p.spin) ctx.rotate(game.time * .38);
    const facing = p.vx < -.2 ? -1 : 1;
    ctx.scale(facing, 1);

    // Quills silhouette, head, body, gloves and unmistakable red shoes.
    ctx.fillStyle = '#0750bd';
    ctx.beginPath();
    ctx.moveTo(-5, -16); ctx.lineTo(-27, -27); ctx.lineTo(-18, -9);
    ctx.lineTo(-31, -8); ctx.lineTo(-18, 1); ctx.lineTo(-25, 12);
    ctx.lineTo(-8, 9); ctx.lineTo(9, 6); ctx.lineTo(12, -9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1684ff'; ctx.beginPath(); ctx.ellipse(2, -10, 13, 14, -.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f4c49a'; ctx.beginPath(); ctx.ellipse(8, -6, 8, 7, .15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(7, -13, 4, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#101827'; ctx.fillRect(8, -14, 2, 4);
    ctx.fillStyle = '#e53b35'; ctx.fillRect(-7, 13, 15, 7); ctx.fillRect(6, 13, 13, 7);
    ctx.fillStyle = '#fff'; ctx.fillRect(-6, 13, 13, 2); ctx.fillRect(7, 13, 11, 2);
    ctx.fillStyle = '#f4c49a'; ctx.beginPath(); ctx.arc(-7, 3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawBee(x, y) {
    const px = x - game.camera;
    const py = y + Math.sin(game.time * .08 + x) * 5;
    ctx.save(); ctx.translate(px, py);
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    ctx.beginPath(); ctx.ellipse(-12, -9, 8, 4, -.4, 0, Math.PI * 2); ctx.ellipse(12, -9, 8, 4, .4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f7c900'; ctx.beginPath(); ctx.ellipse(0, 0, 13, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#242331'; ctx.fillRect(-7, -8, 4, 16); ctx.fillRect(3, -9, 4, 17);
    ctx.fillStyle = '#111'; ctx.fillRect(6, -3, 2, 3);
    ctx.restore();
  }

  function drawBat(x, y) {
    const px = x - game.camera;
    const py = y + Math.sin(game.time * .09 + x) * 8;
    ctx.save(); ctx.translate(px, py);
    ctx.fillStyle = '#4c315d'; ctx.beginPath();
    ctx.moveTo(0, -4); ctx.lineTo(-20, -14); ctx.lineTo(-15, -1); ctx.lineTo(-22, 9);
    ctx.lineTo(-8, 6); ctx.lineTo(0, 13); ctx.lineTo(8, 6); ctx.lineTo(22, 9);
    ctx.lineTo(15, -1); ctx.lineTo(20, -14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffed91'; ctx.fillRect(-5, -3, 2, 2); ctx.fillRect(3, -3, 2, 2);
    ctx.restore();
  }

  function drawScene() {
    const level = stages[game.stage];
    drawBackdrop(level);
    drawTerrain(level);
    for (const ring of game.ringObjects) drawRing(ring);
    for (const bee of level.bees) drawBee(bee.x, bee.y);
    for (const bat of level.bats) drawBat(bat.x, bat.y);
    drawSonic();
  }

  function update() {
    game.time++;
    const p = game.player;
    const moveLeft = keys.has('arrowleft') || keys.has('a');
    const moveRight = keys.has('arrowright') || keys.has('d');
    const jump = keys.has(' ') || keys.has('arrowup') || keys.has('w');
    p.spin = keys.has('shift') || keys.has('s');
    if (moveLeft) p.vx -= .42;
    if (moveRight) p.vx += .42;
    if (!moveLeft && !moveRight) p.vx *= .82;
    p.vx = Math.max(-5, Math.min(5, p.vx));
    if (jump && p.grounded) { p.vy = -10.5; p.grounded = false; }
    p.vy += .48;
    p.x += p.vx;
    p.y += p.vy;
    if (p.y + p.h >= GROUND_Y) { p.y = GROUND_Y - p.h; p.vy = 0; p.grounded = true; }
    p.x = Math.max(0, Math.min(WORLD_WIDTH - p.w, p.x));
    game.camera = Math.max(0, Math.min(WORLD_WIDTH - canvas.width, p.x - 180));

    for (const ring of game.ringObjects) {
      if (!ring.collected && Math.abs((p.x + p.w / 2) - ring.x) < 22 && Math.abs((p.y + p.h / 2) - ring.y) < 28) {
        ring.collected = true; game.rings++; updateHud();
      }
    }
  }

  document.addEventListener('keydown', (event) => {
    const key = event.key.toLowerCase(); keys.add(key);
    if ([' ', 'arrowup', 'arrowleft', 'arrowright'].includes(key)) event.preventDefault();
    if (key === '1' && game.stage !== 0) { game.stage = 0; updateHud(); }
    if (key === '2' && game.stage !== 1) { game.stage = 1; updateHud(); }
  });
  document.addEventListener('keyup', (event) => keys.delete(event.key.toLowerCase()));
  window.addEventListener('blur', () => keys.clear());

  function loop() {
    update();
    drawScene();
    requestAnimationFrame(loop);
  }
  updateHud();
  requestAnimationFrame(loop);
</script>
</body>
</html>
