<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic True Levels</title>
  <style>
    :root {
      --sky-top: #7fd7ff;
      --sky-bottom: #ebfbff;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(255,255,255,0.22);
      --text: #f2f8ff;
      --ring: #ffd84d;
      --ring-core: #fff7cd;
      --gold: #facc15;
      --red: #d93333;
      --blue: #1d7ae8;
      --blue-soft: #9ad4ff;
      --shadow: rgba(0,0,0,0.28);
      --marble: #dfe7ef;
      --marble-dark: #8a96a9;
      --platform: #7a4d2a;
      --platform-alt: #8d5a30;
      --green: #4ac66d;
      --green-dark: #2b9e52;
      --cave: #202b38;
      --lava: #ff8a3d;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(#071824, #0b1b2a 32%, #111827);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 22px 12px 44px;
    }

    .wrap {
      width: min(980px, 94vw);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 20px 42px rgba(0,0,0,0.4);
      padding: 20px 18px 18px;
    }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 1px;
      text-shadow: 0 4px 10px rgba(45, 129, 255, 0.35);
    }

    .hud {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 14px;
      font-weight: 700;
    }

    .hud-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(148,163,184,.42);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: clamp(16px, 2vw, 20px);
      min-width: 120px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .ring-display {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .ring-tv {
      display: inline-block;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #000;
      border: 3px solid #9faec1;
      position: relative;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.08);
    }

    .ring-tv::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff9d5 0 28%, var(--ring-core) 29% 38%, var(--ring) 39% 100%);
      border: 2px solid #d7ac3d;
    }

    .game-shell {
      position: relative;
      width: min(800px, 100%);
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(var(--sky-top), var(--sky-bottom));
      border: 2px solid rgba(255,255,255,.82);
      border-radius: 6px;
      touch-action: none;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.08);
    }

    .game-hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      z-index: 2;
    }

    .game-hud .panel {
      background: rgba(15, 23, 42, 0.72);
      border: 2px solid rgba(226,232,240,.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }

    .mini-ring {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff7d6 0 30%, #ffe27d 31% 100%);
      border: 2px solid #d1a82d;
      margin-right: 6px;
      vertical-align: middle;
    }

    .mini-life {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(#fbbf24, #f97316);
      border: 2px solid #fef3c7;
      margin-right: 6px;
      vertical-align: middle;
    }

    .controls {
      margin-top: 12px;
      text-align: center;
      color: #dfe7ef;
      font-size: 15px;
    }

    .touch-bar {
      display: none;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .touch-btn {
      user-select: none;
      background: rgba(255,255,255,.12);
      border: 2px solid rgba(255,255,255,.28);
      color: #fff;
      min-width: 62px;
      height: 46px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      touch-action: manipulation;
    }

    .touch-btn:active, .touch-btn.active {
      background: rgba(255,255,255,.24);
      transform: translateY(1px);
    }

    @media (pointer: coarse) {
      .touch-bar { display: flex; }
    }
  </style>
</head>

    <div class="controls">Arrow keys / A-D to move. Space = jump. Shift or S = spin. Marble Zone adds columns, pipes, cave detail, lava, bat swarms, and aggressive bee-bot attacks.</div>

    function setKeyState(name, pressed) {
      if (name in keys) keys[name] = pressed;
      const btn = document.querySelector(`.touch-btn[data-key="${name}"]`);
      if (btn) btn.classList.toggle('active', pressed);
    }

    function resetLevelState() {
      level = levelDefs[actIndex];
      state.player.x = level.startX;
      state.player.y = level.groundY - state.player.h;
      state.player.vx = 0;
      state.player.vy = 0;
      state.player.onGround = true;
      state.player.respawnX = level.startX;
      state.player.respawnY = level.groundY - state.player.h;
      state.player.invuln = 0;
      state.player.spinTime = 0;
      state.player.lookDir = 1;
      state.cameraX = 0;
      state.rings = level.rings.map(r => ({ ...r, collected: false }));
      state.enemies = level.enemies.map((e, i) => ({ ...e, alive: true, jumpTimer: (e.jumpTimer || 0) + i * 18, shootCooldown: 60 + i * 15 }));
      state.checkpoints = level.checkpoints.map((cp, i) => ({ ...cp, reached: false, flash: 0, index: i }));
      state.projectiles = [];
      state.boss = level.boss ? { ...level.boss, active: false, hp: level.boss.hp, shield: 0, maceAngle: 0 } : null;
      state.bossDefeated = false;
      state.message = '';
      updateHUD();
    }

    function resetGame() {
      actIndex = 0;
      state.score = 0;
      state.ringCount = 0;
      state.lives = 3;
      state.over = false;
      resetLevelState();

      stageEl.textContent = level.name;

      hudRingsEl.textContent = state.ringCount;
      hudScoreEl.textContent = state.score;
      hudLivesEl.textContent = state.lives;

        x: enemy.x,
        y: enemy.y + 10,
        vx: dir * 2.7,
        vy: 0,
        r: 6,
        from: 'enemy'
      });
    }

      if (key === 'arrowleft' || key === 'a') setKeyState('left', true);
      if (key === 'arrowright' || key === 'd') setKeyState('right', true);
      if (key === ' ' || key === 'arrowup' || key === 'w') {
        event.preventDefault();
        setKeyState('jump', true);
      }
      if (key === 'shift' || key === 's') setKeyState('spin', true);
    });

    document.addEventListener('keyup', (event) => {
      const key = (event.key || '').toLowerCase();
      if (key === 'arrowleft' || key === 'a') setKeyState('left', false);
      if (key === 'arrowright' || key === 'd') setKeyState('right', false);
      if (key === ' ' || key === 'arrowup' || key === 'w') setKeyState('jump', false);
      if (key === 'shift' || key === 's') setKeyState('spin', false);
    });

    touchButtons.forEach(btn => {
      const key = btn.dataset.key;
      const down = (ev) => { ev.preventDefault(); setKeyState(key, true); };
      const up = (ev) => { ev.preventDefault(); setKeyState(key, false); };
      btn.addEventListener('pointerdown', down);
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointerleave', up);
      btn.addEventListener('pointercancel', up);
    });

    function drawSunflower(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#7a3f18';
      ctx.fillRect(-4, 0, 8, 30);
      ctx.fillStyle = '#5cc63b';
      ctx.beginPath();
      ctx.arc(0, -10, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f4d35e';
      for (let i = 0; i < 12; i++) {
        const ang = (Math.PI * 2 * i) / 12;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(ang) * 18, -18 + Math.sin(ang) * 18);
        ctx.lineTo(Math.cos(ang) * 8, -8 + Math.sin(ang) * 8);
        ctx.fill();
      }
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, -10, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPalmTree(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.strokeStyle = '#7a4e2a';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -58);
      ctx.stroke();
      ctx.strokeStyle = '#3dbd52';
      ctx.lineWidth = 5;
      for (let i = 0; i < 8; i++) {
        const a = (-0.8 + i * 0.24);
        ctx.beginPath();
        ctx.moveTo(0, -52);
        ctx.quadraticCurveTo(18 * Math.cos(a), -72, 38 * Math.cos(a), -104 + 15 * Math.sin(a));
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBridge() {
      const b = level.bridge;
      const x = b.x - state.cameraX;
      ctx.fillStyle = '#8b5a2d';
      ctx.fillRect(x, b.y, b.w, 18);
      ctx.fillStyle = '#a56f36';
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(x + 22 + i * 52, b.y + 10, 10, 36);
      }
      ctx.fillStyle = '#5f391e';
      for (let i = 0; i < 6; i++) {
        ctx.fillRect(x + 8 + i * 42, b.y + 18, 6, 90);
      }
      ctx.fillStyle = '#402515';
      ctx.fillRect(x, b.y + 18, b.w, 8);
    }

    function drawHills() {
      ctx.fillStyle = '#7fcf6a';
      for (const hill of level.hills) {
        const x = hill.x - state.cameraX;
        ctx.beginPath();
        ctx.moveTo(x, hill.y);
        ctx.quadraticCurveTo(x + hill.w * 0.5, hill.y - hill.h, x + hill.w, hill.y);
        ctx.lineTo(x + hill.w, 400);
        ctx.lineTo(x, 400);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawGround() {
      const baseY = level.groundY;
      ctx.fillStyle = level.ground;
      ctx.fillRect(0, baseY, canvas.width, canvas.height - baseY);
      for (let x = -20; x < canvas.width + 40; x += 22) {
        const shade = ((Math.floor((x + state.cameraX * 0.25) / 22)) % 2 === 0) ? '#5f3924' : '#4b2d18';
        ctx.fillStyle = shade;
        ctx.fillRect(x, baseY, 22, 26);
      }
      ctx.fillStyle = level.grass;
      ctx.fillRect(0, baseY - 14, canvas.width, 14);
      for (let x = 0; x < canvas.width + 20; x += 14) {
        ctx.fillStyle = '#2e9e49';
        ctx.fillRect(x, baseY - 10, 8, 4);
      }
    }

    function drawPlatformBase() {
      for (const p of level.platforms) {
        const x = p.x - state.cameraX;
        if (x + p.w < -20 || x > canvas.width + 20) continue;
        ctx.fillStyle = '#7a4d2a';
        ctx.fillRect(x, p.y, p.w, p.h);
        for (let px = 0; px < p.w; px += 18) {
          for (let py = 0; py < p.h; py += 18) {
            const d = ((px / 18) + (py / 18)) % 2 === 0 ? '#8a532d' : '#724521';
            ctx.fillStyle = d;
            ctx.fillRect(x + px, p.y + py, 18, 18);
          }
        }
      }
    }

    function drawPipe(pipe) {
      const x = pipe.x - state.cameraX;
      ctx.fillStyle = '#2fc476';
      ctx.fillRect(x, pipe.y, pipe.w, pipe.h);
      ctx.fillStyle = '#1b8d4d';
      ctx.fillRect(x + 8, pipe.y, pipe.w - 16, 8);
      ctx.fillStyle = '#7dffb5';
      ctx.fillRect(x + 10, pipe.y + 12, pipe.w - 20, 4);
    }

    function drawMarbleColumns() {
      if (!level.columns) return;
      for (const col of level.columns) {
        const x = col.x - state.cameraX;
        const h = col.h;
        const y = 280;
        ctx.fillStyle = '#dfe7ef';
        ctx.fillRect(x - 11, y, 22, h);
        ctx.fillStyle = '#8a94a6';
        ctx.fillRect(x - 8, y + 6, 16, h - 12);
        ctx.fillStyle = '#cfd8e3';
        ctx.fillRect(x - 12, y + 16, 24, 8);
        ctx.fillStyle = '#dfe7ef';
        ctx.fillRect(x - 18, y - 10, 36, 18);
        ctx.fillStyle = '#9aa7b5';
        ctx.fillRect(x - 12, y - 4, 24, 4);
        ctx.strokeStyle = '#7d8ea3';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          const yy = y + 18 + i * 16;
          ctx.beginPath();
          ctx.moveTo(x - 8, yy);
          ctx.lineTo(x + 8, yy);
          ctx.stroke();
        }
      }
    }

    function drawUnderground() {
      if (!level.underground) return;
      ctx.fillStyle = '#202831';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#2b3743';
      for (let i = 0; i < 24; i++) {
        const x = (i * 45) - (state.cameraX * 0.15) % 100;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 18, 0);
        ctx.lineTo(x + 30, 32);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#ff8d3f';
      ctx.fillRect(0, level.lavaY, canvas.width, canvas.height - level.lavaY);
      ctx.fillStyle = '#ffcc66';
      for (let i = 0; i < 22; i++) {
        const x = i * 50 - (state.cameraX * 0.8) % 50;
        ctx.fillRect(x, level.lavaY + 8, 18, 12);
      }
      ctx.fillStyle = '#261c1d';
      ctx.fillRect(0, level.groundY, canvas.width, 14);
    }

    function drawRing(ring) {
      if (ring.collected) return;
      const x = ring.x - state.cameraX;
      const y = ring.y;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd84d';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff5bd';
      ctx.fill();
    }

    function drawBeeBot(enemy) {
      if (!enemy.alive) return;
      const x = enemy.x - state.cameraX;
      const y = enemy.y;
      const bob = Math.sin(state.anim / 8) * 2;
      const bodyY = y + bob;

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.ellipse(x, bodyY, 17, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#b4bcc8';
      ctx.fillRect(x - 10, bodyY - 14, 20, 10);

      ctx.fillStyle = '#000';
      ctx.fillRect(x - 14, bodyY - 2, 6, 6);
      ctx.fillRect(x + 8, bodyY - 2, 6, 6);
      ctx.fillStyle = '#9ad6ff';
      ctx.fillRect(x - 12, bodyY - 1, 3, 3);
      ctx.fillRect(x + 9, bodyY - 1, 3, 3);

      ctx.fillStyle = '#facc15';
      ctx.fillRect(x - 15, bodyY + 10, 5, 5);
      ctx.fillRect(x + 10, bodyY + 10, 5, 5);
      ctx.fillStyle = '#2d3748';
      ctx.fillRect(x - 10, bodyY + 8, 20, 3);
      ctx.fillRect(x - 10, bodyY + 13, 20, 3);
      ctx.fillRect(x - 9, bodyY + 18, 4, 4);
      ctx.fillRect(x + 5, bodyY + 18, 4, 4);

      ctx.fillStyle = '#dfeaf8';
      ctx.beginPath();
      ctx.ellipse(x - 14, bodyY - 3, 8, 6, -0.6, 0, Math.PI * 2);

    function drawBat(enemy) {
      if (!enemy.alive) return;
      const x = enemy.x - state.cameraX;
      const y = enemy.y + Math.sin(state.anim * 0.15) * 5;
      ctx.fillStyle = '#dfeaf8';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 18, y + 10);
      ctx.lineTo(x - 12, y + 18);
      ctx.lineTo(x, y + 14);
      ctx.lineTo(x + 12, y + 18);
      ctx.lineTo(x + 18, y + 10);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#111827';
      ctx.fillRect(x - 5, y + 4, 3, 3);
      ctx.fillRect(x + 2, y + 4, 3, 3);
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - 18, y + 10);
      ctx.lineTo(x - 30, y + 18);
      ctx.moveTo(x + 18, y + 10);
      ctx.lineTo(x + 30, y + 18);
      ctx.stroke();
    }

    function drawPiranha(p) {
      if (!p.alive) return;
      const x = p.x - state.cameraX;
      const y = p.y;
      const bob = Math.sin(state.anim * 0.12 + p.jumpTimer) * 2;
      const bodyY = y + bob;

      ctx.fillStyle = '#38b647';
      ctx.beginPath();
      ctx.ellipse(x, bodyY, 18, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2d8c3d';
      ctx.beginPath();
      ctx.moveTo(x + 14, bodyY - 2);
      ctx.lineTo(x + 24, bodyY + 3);
      ctx.lineTo(x + 18, bodyY + 9);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f4f7fb';
      ctx.fillRect(x - 6, bodyY - 4, 5, 5);
      ctx.fillStyle = '#111827';
      ctx.fillRect(x - 5, bodyY - 3, 2, 2);

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(x - 6, bodyY + 4, 8, 3);
      ctx.fillStyle = '#fca5a5';
      ctx.fillRect(x - 15, bodyY - 1, 5, 5);
      ctx.fillRect(x - 15, bodyY + 7, 5, 3);
      ctx.fillStyle = '#1d4d1a';
      ctx.fillRect(x - 3, bodyY + 10, 6, 3);
      ctx.fillRect(x + 8, bodyY + 5, 4, 3);
    }

    function drawProjectile(p) {
      ctx.fillStyle = '#90cdf4';
      ctx.beginPath();
      ctx.arc(p.x - state.cameraX, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawStarPost(cp) {
      const x = cp.x - state.cameraX;
      const y = 280;
      const active = cp.reached;
      const flash = active && cp.flash > 0;

      ctx.fillStyle = '#facc15';
      ctx.fillRect(x - 10, y, 20, 14);
      ctx.fillStyle = '#b6bcc8';
      ctx.fillRect(x - 2, y - 36, 4, 36);
      ctx.fillStyle = '#d93333';
      ctx.beginPath();
      ctx.arc(x, y - 42, 18, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1b73ff';
      ctx.beginPath();
      ctx.arc(x, y - 42, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.moveTo(x, y - 58);
      ctx.lineTo(x + 6, y - 46);
      ctx.lineTo(x + 16, y - 46);
      ctx.lineTo(x + 8, y - 39);
      ctx.lineTo(x + 12, y - 28);
      ctx.lineTo(x, y - 34);
      ctx.lineTo(x - 12, y - 28);
      ctx.lineTo(x - 8, y - 39);
      ctx.lineTo(x - 16, y - 46);
      ctx.lineTo(x - 6, y - 46);
      ctx.closePath();
      ctx.fill();

      if (active && flash) {
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y - 42, 26 + Math.sin(state.anim * 0.3) * 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawBoss() {
      const boss = state.boss;
      if (!boss || boss.hp <= 0) return;
      const x = boss.x - state.cameraX;
      const y = boss.y;
      const chainX = x - 16;
      const chainY = y;
      const maceX = chainX + Math.cos(boss.maceAngle) * boss.chainLen;
      const maceY = chainY + Math.sin(boss.maceAngle) * boss.chainLen;

      ctx.strokeStyle = '#7a7f8b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(chainX, chainY);
      ctx.lineTo(maceX, maceY);
      ctx.stroke();

      ctx.fillStyle = '#d9dfe7';
      ctx.beginPath();
      ctx.arc(maceX, maceY, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#aab3c0';
      ctx.fillRect(maceX - 18, maceY - 5, 36, 10);

      ctx.fillStyle = '#1a1f2a';
      ctx.fillRect(x - 18, y + 6, 36, 20);
      ctx.fillStyle = '#d2d9e2';
      ctx.fillRect(x - 26, y - 14, 52, 18);
      ctx.fillStyle = '#c41f1f';
      ctx.fillRect(x - 16, y - 16, 32, 10);
      ctx.fillStyle = '#2d4bff';
      ctx.fillRect(x - 22, y + 26, 16, 10);
      ctx.fillRect(x + 6, y + 26, 16, 10);
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 10, y - 13, 8, 8);
      ctx.fillRect(x + 2, y - 13, 8, 8);

      for (const p of boss.hidePlatforms) {
        const px = p.x - state.cameraX;
        ctx.fillStyle = '#49c86a';
        ctx.fillRect(px, p.y, p.w, p.h);
        ctx.fillStyle = '#2d9b51';
        ctx.fillRect(px, p.y + 4, p.w, 3);
      }

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 14px Arial';
      ctx.fillText('EGGMAN', x - 30, y - 28);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x - 38, y - 44, 76, 8);
      ctx.fillStyle = '#34d399';
      ctx.fillRect(x - 38, y - 44, (76 * Math.max(0, boss.hp)) / 4, 8);
    }

    function drawPlayer() {
      const p = state.player;
      const x = p.x - state.cameraX;
      const y = p.y;
      const blink = p.invuln > 0 && Math.floor(p.invuln / 8) % 2 === 0;
      const moving = Math.abs(p.vx) > 0.2;
      const bob = moving ? Math.sin(state.anim / 5) * 2.5 : 0;
      const spinPose = p.spinTime > 0;
      const face = p.lookDir;

      if (blink) return;

      ctx.save();
      ctx.translate(x + (face === 1 ? 0 : 0), y + bob);
      ctx.scale(face, 1);

      ctx.fillStyle = '#0d3b8c';
      ctx.fillRect(-12, 16, 24, 18);
      ctx.fillStyle = '#1e77ff';
      ctx.fillRect(-8, 18, 16, 12);

      ctx.fillStyle = '#f7d65a';
      ctx.beginPath();
      ctx.ellipse(0, -12, 12, 10, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1d2740';
      ctx.fillRect(-13, -4, 26, 18);
      ctx.fillStyle = '#d9f0ff';
      ctx.fillRect(-14, -10, 28, 12);

      ctx.fillStyle = '#f7d65a';
      ctx.fillRect(-7, -20, 14, 10);
      ctx.fillStyle = '#000';
      ctx.fillRect(-10, -14, 6, 6);
      ctx.fillRect(4, -14, 6, 6);
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(-6, -23, 4, 3);
      ctx.fillRect(2, -23, 4, 3);
      ctx.fillStyle = '#f7d65a';
      ctx.fillRect(-6, 30, 5, 12);
      ctx.fillRect(1, 30, 5, 12);

      ctx.fillStyle = '#1d5efc';
      ctx.fillRect(-12, 34, 9, 9);
      ctx.fillRect(3, 34, 9, 9);

      if (spinPose) {
        ctx.strokeStyle = '#fef3c7';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(0, 10, 20, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawBackground() {
      const skyTop = level.skyTop || '#7fd7ff';
      const skyBottom = level.skyBottom || '#ebfbff';
      const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
      g.addColorStop(0, skyTop);
      g.addColorStop(1, skyBottom);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (level.palms) {
        for (const palm of level.palms) {
          drawPalmTree(palm.x - state.cameraX, palm.y, palm.scale);
        }
      }

      if (level.flowers) {
        for (const flower of level.flowers) {
          drawSunflower(flower.x - state.cameraX, flower.y, 0.8);
        }
      }

      if (level.bridge) drawBridge();

      if (level.pipes) {
        for (const pipe of level.pipes) {
          drawPipe(pipe);
        }
      }

      if (!level.underground) {
        drawHills();
      }
    }

    function updateEnemies() {
      for (const enemy of state.enemies) {
        if (!enemy.alive) continue;

        if (enemy.type === 'bee' || enemy.type === 'bat') {
          enemy.x += enemy.dir * (enemy.type === 'bee' ? 1.2 : 1.7);
          if (enemy.x < 150 || enemy.x > level.width - 120) enemy.dir *= -1;
          enemy.y = enemy.baseY + Math.sin(state.anim * 0.18 + enemy.x * 0.04) * (enemy.type === 'bee' ? 22 : 28);
        }

        if (enemy.type === 'bat' && Math.random() < 0.012) {
          spawnProjectile(enemy, enemy.dir || 1);
        }

        if (enemy.type === 'bee' && Math.random() < 0.018) {
          spawnProjectile(enemy, enemy.dir || 1);
        }
      }
    }

    function updateBoss() {
      if (!state.boss) return;
      const boss = state.boss;
      boss.maceAngle += boss.angleSpeed;
      if (boss.hp <= 0) {
        state.bossDefeated = true;
        return;
      }
      if (state.player.x > boss.x - 120 && state.player.x < boss.x + 120) {
        boss.active = true;
      }
      if (boss.active) {
        boss.x += Math.sin(state.anim * 0.08) * 0.9;
        if (Math.random() < 0.022) spawnProjectile({ x: boss.x, y: boss.y + 12 }, Math.sign(state.player.x - boss.x) || 1);
      }
    }

    function collectRings() {
      for (const ring of state.rings) {
        if (ring.collected) continue;
        const px = state.player.x + state.player.w * 0.5;
        const py = state.player.y + state.player.h * 0.5;
        const dx = px - ring.x;
        const dy = py - ring.y;
        if (dx * dx + dy * dy < 900) {
          ring.collected = true;
          state.ringCount += 1;
          state.score += 10;
          updateHUD();
        }
      }
    }

    function checkCheckpoints() {
      for (const cp of state.checkpoints) {
        const d = Math.abs(state.player.x - cp.x);
        if (!cp.reached && d < 38) {
          cp.reached = true;
          cp.flash = 30;
          state.player.respawnX = cp.x;
          state.player.respawnY = level.groundY - state.player.h;
        }
        if (cp.flash > 0) cp.flash -= 1;
      }
    }

    function hurtPlayer() {
      if (state.player.invuln > 0) return;
      state.lives -= 1;
      state.player.invuln = 90;
      state.player.x = state.player.respawnX;
      state.player.y = state.player.respawnY;
      state.player.vx = 0;
      state.player.vy = 0;
      if (state.lives <= 0) {
        state.over = true;
        state.message = 'GAME OVER';
      }
      updateHUD();
    }

    function checkEnemyHits() {
      const p = state.player;
      for (const enemy of state.enemies) {
        if (!enemy.alive) continue;
        const hit = p.x < enemy.x + enemy.w && p.x + p.w > enemy.x && p.y < enemy.y + enemy.h && p.y + p.h > enemy.y;
        if (hit) {
          if (p.spinTime > 0) {
            enemy.alive = false;
            state.score += 25;
          } else {
            hurtPlayer();
          }
        }
      }
    }

    function checkProjectileHits() {
      const p = state.player;
      for (const proj of state.projectiles) {
        const hit = proj.x > p.x && proj.x < p.x + p.w && proj.y > p.y && proj.y < p.y + p.h;
        if (hit) {
          hurtPlayer();
          proj.x = -9999;
        }
      }
    }

    function updateProjectiles() {
      state.projectiles = state.projectiles.filter((proj) => {
        proj.x += proj.vx;
        proj.y += proj.vy;
        return proj.x > -20 && proj.x < level.width + 20 && proj.y > -20 && proj.y < canvas.height + 20;
      });
    }

    function nextLevelIfReady() {
      if (state.player.x > level.goalX) {
        if (actIndex < levelDefs.length - 1) {
          actIndex += 1;
          resetLevelState();
        } else {
          state.message = 'YOU WIN!';
        }
      }
    }

    function updatePlayer() {
      const p = state.player;
      const moveLeft = keys.left;
      const moveRight = keys.right;
      const jump = keys.jump;
      const spin = keys.spin;

      if (moveLeft) {
        p.vx -= 0.7;
        p.dir = -1;
      }
      if (moveRight) {
        p.vx += 0.7;
        p.dir = 1;
      }
      if (!moveLeft && !moveRight) {
        p.vx *= 0.8;
      }
      p.vx = Math.max(-3.8, Math.min(3.8, p.vx));
      p.lookDir = p.dir;

      if (spin && p.spinTime <= 0) p.spinTime = 18;
      if (p.spinTime > 0) {
        p.spinTime -= 1;
      }

      if (jump && p.onGround) {
        p.vy = -7.8;
        p.onGround = false;
      }

      p.vy += 0.42;
      p.y += p.vy;
      p.x += p.vx;

      const groundTop = level.groundY - p.h;
      if (p.y >= groundTop) {
        p.y = groundTop;
        p.vy = 0;
        p.onGround = true;
      }

      if (p.x < 0) p.x = 0;
      if (p.x + p.w > level.width) p.x = level.width - p.w;

      state.cameraX = Math.max(0, Math.min(level.width - 800, p.x - 300));
      p.invuln = Math.max(0, p.invuln - 1);
    }

    function drawMessage() {
      if (!state.message) return;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
      ctx.fillRect(200, 150, 400, 100);
      ctx.strokeStyle = '#f8fafc';
      ctx.strokeRect(200, 150, 400, 100);
      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 30px Arial';
      ctx.fillText(state.message, 300, 210);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      if (level.underground) {
        drawUnderground();
      }

      for (const ring of state.rings) drawRing(ring);

      if (level.columns) drawMarbleColumns();
      drawPlatformBase();

      for (const cp of state.checkpoints) drawStarPost(cp);

      for (const enemy of state.enemies) {
        if (enemy.type === 'bee') drawBeeBot(enemy);
        if (enemy.type === 'bat') drawBat(enemy);
        if (enemy.type === 'piranha') drawPiranha(enemy);
      }

      for (const proj of state.projectiles) drawProjectile(proj);
      drawBoss();
      drawPlayer();
      drawMessage();
    }

    function tick() {
      state.anim += 1;

      if (!state.over) {
        updatePlayer();
        updateEnemies();
        updateProjectiles();
        updateBoss();
        collectRings();
        checkCheckpoints();
        checkEnemyHits();
        checkProjectileHits();
        nextLevelIfReady();
      }

      render();
      requestAnimationFrame(tick);
    }

    resetGame();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
