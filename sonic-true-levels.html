<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic True Levels</title>
  <style>
    :root {
      --sky-top: #7ed8ff;
      --sky-bottom: #e8f9ff;
      --grass: #4cc56f;
      --grass-dark: #2d9e4d;
      --dirt: #4b2e16;
      --bridge: #8a5a2b;
      --bridge-dark: #643b1d;
      --panel: rgba(15, 23, 42, 0.8);
      --panel-border: rgba(255,255,255,0.2);
      --text: #eef6ff;
      --ring: #ffd553;
      --ring-core: #fff6c2;
      --blue: #1b73ff;
      --blue-dark: #0d4fcf;
      --red: #d93333;
      --red-dark: #9b1d1d;
      --gold: #facc15;
      --shadow: rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(#06131f, #0b1d2a);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 12px 40px;
    }

    .wrap {
      width: min(980px, 94vw);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.35);
      padding: 22px 20px 18px;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 1px;
    }

    .hud {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .hud-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(148, 163, 184, 0.38);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: clamp(16px, 2vw, 20px);
      min-width: 120px;
      text-align: center;
    }

    .ring-display {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .ring-tv {
      display: inline-block;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #000;
      border: 3px solid #a5b4c5;
      position: relative;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08);
    }

    .ring-tv::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff9d5 0 30%, var(--ring-core) 31% 38%, var(--ring) 39% 100%);
      border: 2px solid #d7ac3d;
    }

    .game-shell {
      position: relative;
      width: min(800px, 100%);
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(var(--sky-top), var(--sky-bottom));
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 4px;
      touch-action: none;
    }

    .game-hud {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      z-index: 2;
    }

    .game-hud .panel {
      background: rgba(15, 23, 42, 0.72);
      border: 2px solid rgba(226, 232, 240, 0.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
    }

    .mini-ring {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff7d6 0 28%, #ffe27d 29% 100%);
      border: 2px solid #d1a82d;
      margin-right: 6px;
      vertical-align: middle;
    }

    .mini-life {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(#fbbf24, #f97316);
      border: 2px solid #fef3c7;
      margin-right: 6px;
      vertical-align: middle;
    }

    .controls {
      margin-top: 12px;
      text-align: center;
      color: #dfe7ef;
      font-size: 15px;
    }

    .touch-bar {
      display: none;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      align-items: center;
      flex-wrap: wrap;
    }

    .touch-btn {
      user-select: none;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.28);
      color: white;
      min-width: 62px;
      height: 46px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
      touch-action: manipulation;
    }

    .touch-btn:active, .touch-btn.active {
      background: rgba(255,255,255,0.24);
      transform: translateY(1px);
    }

    @media (pointer: coarse) {
      .touch-bar { display: flex; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SONIC TRUE LEVELS</h1>

    <div class="hud">
      <div class="hud-box ring-display">
        <span class="ring-tv" aria-hidden="true"></span>
        <span>Rings: <span id="score">0</span></span>
      </div>
      <div class="hud-box">Stage: <span id="stage">Green Hill</span></div>
      <div class="hud-box">Lives: <span id="lives">3</span></div>
    </div>

    <div class="game-shell">
      <div class="game-hud">
        <div class="panel"><span class="mini-ring"></span><span id="hud-rings">0</span></div>
        <div class="panel">SCORE <span id="hud-score">0</span></div>
        <div class="panel"><span class="mini-life"></span><span id="hud-lives">3</span></div>
      </div>
      <canvas id="game" width="800" height="400"></canvas>
    </div>

    <div class="controls">Arrow keys / A-D to move, Space to jump. Shift or S = spin dash. Spin-jump piranhas to destroy them.</div>

    <div class="touch-bar" aria-label="Touch controls">
      <button class="touch-btn" data-key="left">◀</button>
      <button class="touch-btn" data-key="right">▶</button>
      <button class="touch-btn" data-key="jump">JUMP</button>
      <button class="touch-btn" data-key="spin">SPIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const stageEl = document.getElementById('stage');
    const livesEl = document.getElementById('lives');
    const hudRingsEl = document.getElementById('hud-rings');
    const hudScoreEl = document.getElementById('hud-score');
    const hudLivesEl = document.getElementById('hud-lives');

    const keys = { left: false, right: false, jump: false, spin: false };
    const touchButtons = [...document.querySelectorAll('.touch-btn')];

    const level = {
      name: 'Green Hill',
      width: 2400,
      groundY: 380,
      startX: 60,
      goalX: 2260,
      bridge: { x: 360, y: 260, w: 260, h: 120 },
      flowerPositions: [
        { x: 120, y: 360 }, { x: 210, y: 360 }, { x: 600, y: 360 },
        { x: 1020, y: 360 }, { x: 1370, y: 360 }, { x: 1880, y: 360 },
        { x: 2200, y: 360 }
      ],
      palms: [
        { x: 480, y: 312, scale: 1.15 },
        { x: 1180, y: 318, scale: 1.25 },
        { x: 1760, y: 312, scale: 1.05 },
        { x: 2080, y: 324, scale: 1.2 }
      ]
    };

    const game = {
      cameraX: 0,
      score: 0,
      ringCount: 0,
      lives: 3,
      anim: 0,
      ending: false,
      over: false,
      message: '',
      player: {
        x: level.startX,
        y: 300,
        w: 30,
        h: 42,
        vx: 0,
        vy: 0,
        onGround: false,
        dir: 1,
        invuln: 0,
        spinTime: 0,
        spinCharge: 0,
        jumpHeld: false,
        lookDir: 1
      },
      rings: [
        { x: 160, y: 330, collected: false }, { x: 360, y: 300, collected: false },
        { x: 520, y: 290, collected: false }, { x: 700, y: 260, collected: false },
        { x: 980, y: 220, collected: false }, { x: 1320, y: 190, collected: false },
        { x: 1600, y: 250, collected: false }, { x: 1820, y: 210, collected: false },
        { x: 2050, y: 250, collected: false }, { x: 2230, y: 310, collected: false }
      ],
      piranhas: [
        { x: 430, y: 350, w: 36, h: 26, baseY: 350, jumpTimer: 0, out: false, alive: true },
        { x: 500, y: 350, w: 36, h: 26, baseY: 350, jumpTimer: 20, out: false, alive: true },
        { x: 585, y: 350, w: 36, h: 26, baseY: 350, jumpTimer: 40, out: false, alive: true }
      ]
    };

    function updateHUD() {
      scoreEl.textContent = game.ringCount;
      stageEl.textContent = level.name;
      livesEl.textContent = game.lives;
      hudRingsEl.textContent = game.ringCount;
      hudScoreEl.textContent = game.score;
      hudLivesEl.textContent = game.lives;
    }

    function resetGame() {
      game.player.x = level.startX;
      game.player.y = 300;
      game.player.vx = 0;
      game.player.vy = 0;
      game.player.onGround = false;
      game.player.invuln = 0;
      game.player.spinTime = 0;
      game.player.spinCharge = 0;
      game.player.jumpHeld = false;
      game.cameraX = 0;
      game.score = 0;
      game.ringCount = 0;
      game.lives = 3;
      game.rings.forEach(r => r.collected = false);
      game.piranhas.forEach((p, i) => {
        p.x = 430 + i * 70;
        p.y = p.baseY;
        p.out = false;
        p.alive = true;
        p.jumpTimer = i * 18;
      });
      updateHUD();
    }

    function setKeyState(name, pressed) {
      if (name in keys) keys[name] = pressed;
      const btn = document.querySelector(`.touch-btn[data-key="${name}"]`);
      if (btn) btn.classList.toggle('active', pressed);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') setKeyState('left', true);
      if (key === 'arrowright' || key === 'd') setKeyState('right', true);
      if (key === ' ' || key === 'arrowup' || key === 'w') {
        event.preventDefault();
        setKeyState('jump', true);
      }
      if (key === 'shift' || key === 's') setKeyState('spin', true);
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'arrowleft' || key === 'a') setKeyState('left', false);
      if (key === 'arrowright' || key === 'd') setKeyState('right', false);
      if (key === ' ' || key === 'arrowup' || key === 'w') setKeyState('jump', false);
      if (key === 'shift' || key === 's') setKeyState('spin', false);
    });

    touchButtons.forEach(btn => {
      const key = btn.dataset.key;
      const start = (ev) => {
        ev.preventDefault();
        setKeyState(key, true);
      };
      const end = (ev) => {
        ev.preventDefault();
        setKeyState(key, false);
      };
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', end);
      btn.addEventListener('pointerleave', end);
      btn.addEventListener('pointercancel', end);
    });

    function drawSunflower(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#7a3f18';
      ctx.fillRect(-4, 0, 8, 30);
      ctx.fillStyle = '#5cc63b';
      ctx.beginPath();
      ctx.arc(0, -10, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f4d35e';
      for (let i = 0; i < 12; i++) {
        const ang = (Math.PI * 2 * i) / 12;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(ang) * 18, -18 + Math.sin(ang) * 18);
        ctx.lineTo(Math.cos(ang) * 8, -8 + Math.sin(ang) * 8);
        ctx.fill();
      }
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, -10, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPalmTree(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.strokeStyle = '#7a4e2a';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -58);
      ctx.stroke();

      ctx.strokeStyle = '#3dbd52';
      ctx.lineWidth = 5;
      for (let i = 0; i < 8; i++) {
        const a = (-0.8 + i * 0.24);
        ctx.beginPath();
        ctx.moveTo(0, -52);
        ctx.quadraticCurveTo(18 * Math.cos(a), -72, 38 * Math.cos(a), -104 + 15 * Math.sin(a));
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBridge() {
      const b = level.bridge;
      const x = b.x - game.cameraX;
      ctx.fillStyle = '#8b5a2d';
      ctx.fillRect(x, b.y, b.w, 18);
      ctx.fillStyle = '#a56f36';
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(x + 22 + i * 52, b.y + 10, 10, 36);
      }
      ctx.fillStyle = '#5f391e';
      for (let i = 0; i < 6; i++) {
        ctx.fillRect(x + 8 + i * 42, b.y + 18, 6, 90);
      }
      ctx.fillStyle = '#402515';
      ctx.fillRect(x, b.y + 18, b.w, 8);
    }

    function drawGround() {
      const baseY = level.groundY;
      ctx.fillStyle = '#5d3520';
      ctx.fillRect(0, baseY, canvas.width, canvas.height - baseY);
      for (let x = -20; x < canvas.width + 40; x += 28) {
        const shade = ((Math.floor((x + game.cameraX * 0.25) / 28)) % 2 === 0) ? '#6d4327' : '#4d2d17';
        ctx.fillStyle = shade;
        ctx.fillRect(x, baseY, 28, 26);
      }
      ctx.fillStyle = '#4cc56f';
      ctx.fillRect(0, baseY - 14, canvas.width, 14);
      for (let x = 0; x < canvas.width + 20; x += 14) {
        ctx.fillStyle = '#3db75b';
        ctx.fillRect(x, baseY - 10, 8, 4);
      }
    }

    function drawRing(ring) {
      if (ring.collected) return;
      const x = ring.x - game.cameraX;
      const y = ring.y;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd553';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff6c2';
      ctx.fill();
    }

    function drawPiranha(p) {
      if (!p.alive) return;
      const x = p.x - game.cameraX;
      const y = p.y;
      const bob = Math.sin(game.anim * 0.14 + p.jumpTimer) * 2;
      const bodyY = y + bob;

      ctx.fillStyle = '#3fbf52';
      ctx.beginPath();
      ctx.ellipse(x, bodyY, 18, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2d8c3d';
      ctx.beginPath();
      ctx.moveTo(x + 14, bodyY - 2);
      ctx.lineTo(x + 24, bodyY + 3);
      ctx.lineTo(x + 18, bodyY + 9);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f4f7fb';
      ctx.fillRect(x - 6, bodyY - 4, 5, 5);
      ctx.fillStyle = '#111827';
      ctx.fillRect(x - 5, bodyY - 3, 2, 2);

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(x - 6, bodyY + 4, 8, 3);
      ctx.fillStyle = '#fca5a5';
      ctx.fillRect(x - 15, bodyY - 1, 5, 5);
      ctx.fillRect(x - 15, bodyY + 7, 5, 3);
      ctx.fillStyle = '#1d4d1a';
      ctx.fillRect(x - 3, bodyY + 10, 6, 3);
      ctx.fillRect(x + 8, bodyY + 5, 4, 3);
    }

    function drawPlayer() {
      const p = game.player;
      const x = p.x - game.cameraX;
      const y = p.y;
      const blink = p.invuln > 0 && Math.floor(p.invuln / 8) % 2 === 0;
      const moving = Math.abs(p.vx) > 0.2;
      const bob = moving ? Math.sin(game.anim / 5) * 2 : 0;
      const spinPose = p.spinTime > 0 || Math.abs(p.vx) > 7;
      const face = p.lookDir;

      ctx.save();
      ctx.translate(x + 15, y + 21 + bob);
      ctx.scale(face, 1);

      if (spinPose) {
        ctx.fillStyle = blink ? '#f8fafc' : '#1e74ff';
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(-10, -10, 20, 8);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-4, -6, 3, 3);
        ctx.fillRect(1, -6, 3, 3);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(-4, 6, 8, 4);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-12, -2, 4, 9);
        ctx.fillRect(8, -2, 4, 9);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-12, 11, 24, 3);

        ctx.fillStyle = blink ? '#f8fafc' : '#1c7fff';
        ctx.fillRect(-9, -14, 18, 18);

        ctx.fillStyle = '#dbeafe';
        ctx.fillRect(-8, -27, 16, 12);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-4, -27, 3, 3);
        ctx.fillRect(1, -27, 3, 3);

        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(-6, -34, 12, 8);

        ctx.fillStyle = '#f4d35e';
        ctx.fillRect(-12, -8, 4, 12);
        ctx.fillRect(8, -8, 4, 12);

        ctx.fillStyle = '#d93333';
        ctx.fillRect(-10, 7, 7, 5);
        ctx.fillRect(3, 7, 7, 5);

        ctx.fillStyle = '#f9d87b';
        ctx.fillRect(-5, 10, 10, 5);

        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-7, 14, 5, 10);
        ctx.fillRect(2, 14, 5, 10);
        ctx.fillRect(-11, -8, 4, 11);
        ctx.fillRect(7, -8, 4, 11);
      }
      ctx.restore();
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#8ad8ff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 8; i++) {
        const cloudX = ((i * 180) - (game.cameraX * 0.18)) % (canvas.width + 180);
        ctx.beginPath();
        ctx.arc(cloudX, 72, 24, 0, Math.PI * 2);
        ctx.arc(cloudX + 26, 66, 28, 0, Math.PI * 2);
        ctx.arc(cloudX + 58, 72, 22, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = '#8cd6ff';
      for (let i = 0; i < 7; i++) {
        const hillX = ((i * 220) - (game.cameraX * 0.48)) % (canvas.width + 260);
        ctx.beginPath();
        ctx.moveTo(hillX, 400);
        ctx.quadraticCurveTo(hillX + 80, 230, hillX + 180, 400);
        ctx.fill();
      }

      for (const flower of level.flowerPositions) {
        drawSunflower(flower.x - game.cameraX, flower.y, 0.72);
      }

      for (const palm of level.palms) {
        drawPalmTree(palm.x - game.cameraX, palm.y, palm.scale);
      }

      drawGround();
      drawBridge();

      game.rings.forEach(drawRing);
      game.piranhas.forEach(drawPiranha);
      drawPlayer();

      if (game.message) {
        ctx.fillStyle = 'rgba(15,23,42,0.35)';
        ctx.fillRect(170, 120, 460, 70);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(game.message, canvas.width / 2, 160);
      }
    }

    function onGroundCollision() {
      const p = game.player;
      const groundY = level.groundY;
      if (p.y + p.h >= groundY && p.vy >= 0) {
        p.y = groundY - p.h;
        p.vy = 0;
        p.onGround = true;
      }

      const b = level.bridge;
      const playerRight = p.x + p.w;
      const playerLeft = p.x;
      const bridgeLeft = b.x;
      const bridgeRight = b.x + b.w;
      const topOfBridge = b.y + 18;
      const bottomOfBridge = b.y + 90;
      const playerBottom = p.y + p.h;
      const playerTop = p.y;

      if (
        playerBottom >= topOfBridge &&
        playerBottom <= bottomOfBridge + 12 &&
        p.vy >= 0 &&
        playerRight > bridgeLeft &&
        playerLeft < bridgeRight &&
        playerTop < topOfBridge + 8
      ) {
        p.y = topOfBridge - p.h;
        p.vy = 0;
        p.onGround = true;
      }
    }

    function collectRings() {
      const p = game.player;
      for (const ring of game.rings) {
        if (ring.collected) continue;
        const dx = Math.abs((ring.x + 4) - (p.x + p.w / 2));
        const dy = Math.abs((ring.y + 4) - (p.y + p.h / 2));
        if (dx < 18 && dy < 18) {
          ring.collected = true;
          game.ringCount += 1;
          game.score += 25;
          updateHUD();
        }
      }
    }

    function damagePlayer() {
      const p = game.player;
      if (p.invuln > 0) return;
      if (game.ringCount > 0) {
        game.ringCount = Math.max(0, game.ringCount - 5);
        game.score = Math.max(0, game.score - 25);
        p.invuln = 60;
        updateHUD();
        return;
      }
      game.lives -= 1;
      updateHUD();
      if (game.lives <= 0) {
        game.message = 'GAME OVER';
        game.over = true;
        return;
      }
      p.x = level.startX;
      p.y = 300;
      p.vx = 0;
      p.vy = 0;
      p.invuln = 90;
      game.cameraX = 0;
    }

    function piranhaHitCheck() {
      const p = game.player;
      for (const piranha of game.piranhas) {
        if (!piranha.alive) continue;
        const overlap = (
          p.x + p.w > piranha.x &&
          p.x < piranha.x + piranha.w &&
          p.y + p.h > piranha.y &&
          p.y < piranha.y + piranha.h
        );
        if (!overlap) continue;

        const stomp = (p.y + p.h) <= (piranha.y + 10) && p.vy > 0;
        if (stomp && (p.spinTime > 0 || p.vy > 4.3)) {
          piranha.alive = false;
          p.vy = -8;
          game.score += 150;
          updateHUD();
          continue;
        }

        damagePlayer();
      }
    }

    function updatePiranhas() {
      for (const piranha of game.piranhas) {
        if (!piranha.alive) continue;
        piranha.jumpTimer += 1;
        const shouldPop = Math.abs(game.player.x - piranha.x) < 180 && game.player.x > 340 && game.player.x < 700;
        const t = (piranha.jumpTimer % 120) / 120;

        if (shouldPop) {
          const pop = Math.max(0, Math.sin(t * Math.PI * 2));
          piranha.out = pop > 0.1;
          piranha.y = piranha.baseY - pop * 24;
        } else {
          piranha.out = false;
          piranha.y = piranha.baseY;
        }
      }
    }

    function handleInput() {
      const p = game.player;
      if (keys.left) {
        p.vx = -5;
        p.lookDir = -1;
      } else if (keys.right) {
        p.vx = 5;
        p.lookDir = 1;
      } else {
        p.vx *= 0.82;
      }

      if (keys.spin && p.onGround) {
        p.spinCharge = Math.min(28, p.spinCharge + 2.4);
      }

      if (!keys.spin && p.spinCharge > 0) {
        p.spinTime = 18;
        p.vx = p.lookDir * (7 + p.spinCharge * 0.35);
        p.spinCharge = 0;
      }

      if (keys.jump && p.onGround) {
        p.vy = -12;
        p.onGround = false;
      }

      if (p.spinTime > 0) {
        p.spinTime -= 1;
        p.vx *= 1.02;
      }

      if (p.invuln > 0) p.invuln -= 1;
    }

    function updatePlayer() {
      const p = game.player;
      p.vy += 0.65;
      p.x += p.vx;
      p.y += p.vy;
      p.onGround = false;

      if (p.x < 0) p.x = 0;
      if (p.x + p.w > level.width) p.x = level.width - p.w;

      onGroundCollision();

      if (p.y + p.h > canvas.height) {
        p.y = canvas.height - p.h;
        p.vy = 0;
        p.onGround = true;
      }

      if (p.x + p.w > level.goalX && p.y + p.h > 250 && p.y < 360) {
        game.message = 'STAGE CLEAR!';
        game.ending = true;
      }

      if (game.ending) {
        if (game.player.vx > 0) game.player.vx = 0;
      }

      game.cameraX = Math.max(0, Math.min(level.width - canvas.width, p.x - canvas.width / 2 + 60));
    }

    function update() {
      if (game.over) {
        drawScene();
        return;
      }

      game.anim += 1;
      handleInput();
      updatePiranhas();
      updatePlayer();
      collectRings();
      piranhaHitCheck();
      if (game.ending) {
        game.message = 'STAGE CLEAR!';
      }
      drawScene();
      requestAnimationFrame(update);
    }

    resetGame();
    updateHUD();
    drawScene();
    requestAnimationFrame(update);
  </script>
