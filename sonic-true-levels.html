<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic True Levels</title>
  <style>
    :root {
      --sky-top: #84d8ff;
      --sky-bottom: #ebfbff;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(255,255,255,0.18);
      --text: #eff7ff;
      --ring: #ffd84d;
      --ring-core: #fff8cf;
      --gold: #facc15;
      --red: #d93434;
      --blue: #1e77ff;
      --blue-soft: #7bc7ff;
      --shadow: rgba(0,0,0,0.24);
      --marble: #dfe7ee;
      --marble-dark: #8794a6;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(#06131f, #0b1d2a);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 12px 42px;
    }

    .wrap {
      width: min(980px, 94vw);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 18px 38px rgba(0,0,0,.35);
      padding: 22px 20px 18px;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 1px;
    }

    .hud {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .hud-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(148,163,184,.38);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: clamp(16px, 2vw, 20px);
      min-width: 120px;
      text-align: center;
    }

    .ring-display {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .ring-tv {
      display: inline-block;
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: #000;
      border: 3px solid #a5b4c5;
      position: relative;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.08);
    }

    .ring-tv::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff9d5 0 28%, var(--ring-core) 29% 38%, var(--ring) 39% 100%);
      border: 2px solid #d7ac3d;
    }

    .game-shell {
      position: relative;
      width: min(800px, 100%);
      margin: 0 auto;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(var(--sky-top), var(--sky-bottom));
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 4px;
      touch-action: none;
    }

    .game-hud {
      position: absolute;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
      z-index: 2;
    }

    .game-hud .panel {
      background: rgba(15, 23, 42, 0.72);
      border: 2px solid rgba(226,232,240,.4);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f8fafc;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
    }

    .mini-ring {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff7d6 0 30%, #ffe27d 31% 100%);
      border: 2px solid #d1a82d;
      margin-right: 6px;
      vertical-align: middle;
    }

    .mini-life {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(#fbbf24, #f97316);
      border: 2px solid #fef3c7;
      margin-right: 6px;
      vertical-align: middle;
    }

    .controls {
      margin-top: 12px;
      text-align: center;
      color: #dfe7ef;
      font-size: 15px;
    }

    .touch-bar {
      display: none;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .touch-btn {
      user-select: none;
      background: rgba(255,255,255,.12);
      border: 2px solid rgba(255,255,255,.28);
      color: #fff;
      min-width: 62px;
      height: 46px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      touch-action: manipulation;
    }

    .touch-btn:active, .touch-btn.active {
      background: rgba(255,255,255,.24);
      transform: translateY(1px);
    }

    @media (pointer: coarse) {
      .touch-bar { display: flex; }
    }
  </style>

      const btn = document.querySelector(`.touch-btn[data-key="${name}"]`);

    }

      level = levelDefs[actIndex];

      state.player.y = 300;
      state.player.vx = 0;
      state.player.vy = 0;
      state.player.onGround = false;
      state.player.respawnX = level.startX;
      state.player.respawnY = 300;
      state.player.invuln = 0;
      state.player.spinTime = 0;
      state.player.spinCharge = 0;
      state.cameraX = 0;
      state.rings = level.rings.map(r => ({ ...r, collected: false }));
      state.enemies = level.enemies.map((e, i) => ({ ...e, alive: true, jumpTimer: (e.jumpTimer || 0) + i * 20 }));
      state.checkpoints = level.checkpoints.map((cp, i) => ({ ...cp, reached: false, flash: 0, index: i }));
      state.projectiles = [];
      state.boss = level.boss ? ({ ...level.boss, active: false, hp: level.boss.hp, shield: 0, maceAngle: 0 }) : null;
      state.bossDefeated = false;
      state.message = '';
      updateHUD();
    }

    function resetGame() {
      actIndex = 0;
      state.score = 0;
      state.ringCount = 0;
      state.lives = 3;
      state.over = false;
      resetLevelState();

      hudScoreEl.textContent = state.score;
      hudLivesEl.textContent = state.lives;

        y: enemy.y,
        vx: dir * 2.4,
        vy: 0,
        r: 6,
        from: 'enemy'

      if (key === ' ' || key === 'arrowup' || key === 'w') {
        event.preventDefault();
        setKeyState('jump', true);
      }
      if (key === 'shift' || key === 's') setKeyState('spin', true);
    });

      if (key === ' ' || key === 'arrowup' || key === 'w') setKeyState('jump', false);

    });

    touchButtons.forEach(btn => {
      const key = btn.dataset.key;
      const down = (ev) => { ev.preventDefault(); setKeyState(key, true); };
      const up = (ev) => { ev.preventDefault(); setKeyState(key, false); };
      btn.addEventListener('pointerdown', down);
      btn.addEventListener('pointerup', up);
      btn.addEventListener('pointerleave', up);
      btn.addEventListener('pointercancel', up);
    });

    function drawSunflower(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#7a3f18';
      ctx.fillRect(-4, 0, 8, 30);
      ctx.fillStyle = '#5cc63b';
      ctx.beginPath();
      ctx.arc(0, -10, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#f4d35e';
      for (let i = 0; i < 12; i++) {
        const ang = (Math.PI * 2 * i) / 12;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(ang) * 18, -18 + Math.sin(ang) * 18);
        ctx.lineTo(Math.cos(ang) * 8, -8 + Math.sin(ang) * 8);
        ctx.fill();
      }
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(0, -10, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPalmTree(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.strokeStyle = '#7a4e2a';
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -58);
      ctx.stroke();
      ctx.strokeStyle = '#3dbd52';
      ctx.lineWidth = 5;
      for (let i = 0; i < 8; i++) {
        const a = (-0.8 + i * 0.24);
        ctx.beginPath();
        ctx.moveTo(0, -52);
        ctx.quadraticCurveTo(18 * Math.cos(a), -72, 38 * Math.cos(a), -104 + 15 * Math.sin(a));
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawBridge() {
      const b = level.bridge;
      const x = b.x - state.cameraX;
      ctx.fillStyle = '#8b5a2d';
      ctx.fillRect(x, b.y, b.w, 18);
      ctx.fillStyle = '#a56f36';
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(x + 22 + i * 52, b.y + 10, 10, 36);
      }
      ctx.fillStyle = '#5f391e';
      for (let i = 0; i < 6; i++) {
        ctx.fillRect(x + 8 + i * 42, b.y + 18, 6, 90);
      }
      ctx.fillStyle = '#402515';
      ctx.fillRect(x, b.y + 18, b.w, 8);
    }

    function drawHills() {
      ctx.fillStyle = '#7fcf6a';
      for (const hill of level.hills) {
        const x = hill.x - state.cameraX;
        ctx.beginPath();
        ctx.moveTo(x, hill.y);
        ctx.quadraticCurveTo(x + hill.w * 0.5, hill.y - hill.h, x + hill.w, hill.y);
        ctx.lineTo(x + hill.w, 400);
        ctx.lineTo(x, 400);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawGround() {
      const baseY = level.groundY;
      ctx.fillStyle = level.ground;
      ctx.fillRect(0, baseY, canvas.width, canvas.height - baseY);
      for (let x = -20; x < canvas.width + 40; x += 22) {
        const shade = ((Math.floor((x + state.cameraX * 0.25) / 22)) % 2 === 0) ? '#5f3924' : '#4b2d18';
        ctx.fillStyle = shade;
        ctx.fillRect(x, baseY, 22, 26);
      }
      ctx.fillStyle = level.grass;
      ctx.fillRect(0, baseY - 14, canvas.width, 14);
      for (let x = 0; x < canvas.width + 20; x += 14) {
        ctx.fillStyle = '#2e9e49';
        ctx.fillRect(x, baseY - 10, 8, 4);
      }
    }

    function drawPlatformBase() {
      for (const p of level.platforms) {
        const x = p.x - state.cameraX;
        if (x + p.w < -20 || x > canvas.width + 20) continue;
        ctx.fillStyle = '#7a4d2a';
        ctx.fillRect(x, p.y, p.w, p.h);
        for (let px = 0; px < p.w; px += 18) {
          for (let py = 0; py < p.h; py += 18) {
            const d = ((px / 18) + (py / 18)) % 2 === 0 ? '#8a532d' : '#724521';
            ctx.fillStyle = d;
            ctx.fillRect(x + px, p.y + py, 18, 18);
          }
        }
      }
    }

    function drawMarbleColumns() {
      if (!level.columns) return;
      for (const col of level.columns) {
        const x = col.x - state.cameraX;
        const h = col.h;
        const y = 300;
        ctx.fillStyle = '#dfe7ef';
        ctx.fillRect(x - 11, y, 22, h);
        ctx.fillStyle = '#8a94a6';
        ctx.fillRect(x - 8, y + 6, 16, h - 12);
        ctx.fillStyle = '#cfd8e3';
        ctx.fillRect(x - 12, y + 16, 24, 8);
        ctx.fillStyle = '#dfe7ef';
        ctx.fillRect(x - 18, y - 10, 36, 18);
        ctx.fillStyle = '#9aa7b5';
        ctx.fillRect(x - 12, y - 4, 24, 4);
        ctx.strokeStyle = '#7d8ea3';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          const yy = y + 18 + i * 16;
          ctx.beginPath();
          ctx.moveTo(x - 8, yy);
          ctx.lineTo(x + 8, yy);
          ctx.stroke();
        }
      }
    }

    function drawUnderground() {
      if (!level.underground) return;
      ctx.fillStyle = '#202831';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#2b3743';
      for (let i = 0; i < 24; i++) {
        const x = (i * 45) - (state.cameraX * 0.15) % 100;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 18, 0);
        ctx.lineTo(x + 30, 32);
        ctx.closePath();
        ctx.fill();
      }
      ctx.fillStyle = '#ff8d3f';
      ctx.fillRect(0, level.lavaY, canvas.width, canvas.height - level.lavaY);
      ctx.fillStyle = '#ffcc66';
      for (let i = 0; i < 22; i++) {
        const x = i * 50 - (state.cameraX * 0.8) % 50;
        ctx.fillRect(x, level.lavaY + 8, 18, 12);
      }
      ctx.fillStyle = '#261c1d';
      ctx.fillRect(0, level.groundY, canvas.width, 14);
    }

    function drawRing(ring) {
      if (ring.collected) return;
      const x = ring.x - state.cameraX;
      const y = ring.y;
      ctx.beginPath();
      ctx.arc(x, y, 10, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd84d';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff5bd';
      ctx.fill();
    }

    function drawBeeBot(enemy) {
      if (!enemy.alive) return;
      const x = enemy.x - state.cameraX;
      const y = enemy.y;
      const bob = Math.sin(state.anim / 8) * 2;
      const bodyY = y + bob;

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.ellipse(x, bodyY, 17, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#b4bcc8';
      ctx.fillRect(x - 10, bodyY - 14, 20, 10);

      ctx.fillStyle = '#000';
      ctx.fillRect(x - 14, bodyY - 2, 6, 6);
      ctx.fillRect(x + 8, bodyY - 2, 6, 6);
      ctx.fillStyle = '#9ad6ff';
      ctx.fillRect(x - 12, bodyY - 1, 3, 3);
      ctx.fillRect(x + 9, bodyY - 1, 3, 3);

      ctx.fillStyle = '#facc15';
      ctx.fillRect(x - 15, bodyY + 10, 5, 5);
      ctx.fillRect(x + 10, bodyY + 10, 5, 5);
      ctx.fillStyle = '#2d3748';
      ctx.fillRect(x - 10, bodyY + 8, 20, 3);
      ctx.fillRect(x - 10, bodyY + 13, 20, 3);
      ctx.fillRect(x - 9, bodyY + 18, 4, 4);
      ctx.fillRect(x + 5, bodyY + 18, 4, 4);

      ctx.fillStyle = '#dfeaf8';
      ctx.beginPath();
      ctx.ellipse(x - 14, bodyY - 3, 8, 6, -0.6, 0, Math.PI * 2);
      ctx.ellipse(x + 14, bodyY - 3, 8, 6, 0.6, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawPiranha(p) {
      if (!p.alive) return;
      const x = p.x - state.cameraX;
      const y = p.y;
      const bob = Math.sin(state.anim * 0.12 + p.jumpTimer) * 2;
      const bodyY = y + bob;

      ctx.fillStyle = '#38b647';
      ctx.beginPath();
      ctx.ellipse(x, bodyY, 18, 12, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#2d8c3d';
      ctx.beginPath();
      ctx.moveTo(x + 14, bodyY - 2);
      ctx.lineTo(x + 24, bodyY + 3);
      ctx.lineTo(x + 18, bodyY + 9);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#f4f7fb';
      ctx.fillRect(x - 6, bodyY - 4, 5, 5);
      ctx.fillStyle = '#111827';
      ctx.fillRect(x - 5, bodyY - 3, 2, 2);

      ctx.fillStyle = '#f8fafc';
      ctx.fillRect(x - 6, bodyY + 4, 8, 3);
      ctx.fillStyle = '#fca5a5';
      ctx.fillRect(x - 15, bodyY - 1, 5, 5);
      ctx.fillRect(x - 15, bodyY + 7, 5, 3);
      ctx.fillStyle = '#1d4d1a';
      ctx.fillRect(x - 3, bodyY + 10, 6, 3);
      ctx.fillRect(x + 8, bodyY + 5, 4, 3);
    }

    function drawProjectile(p) {
      ctx.fillStyle = '#90cdf4';
      ctx.beginPath();
      ctx.arc(p.x - state.cameraX, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawStarPost(cp) {
      const x = cp.x - state.cameraX;
      const y = 300;
      const active = cp.reached;
      const flash = active && cp.flash > 0;

      ctx.fillStyle = '#facc15';
      ctx.fillRect(x - 10, y, 20, 14);

      ctx.fillStyle = '#b6bcc8';
      ctx.fillRect(x - 2, y - 36, 4, 36);

      ctx.fillStyle = '#d93333';
      ctx.beginPath();
      ctx.arc(x, y - 42, 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#1b73ff';
      ctx.beginPath();
      ctx.arc(x, y - 42, 9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.moveTo(x, y - 58);
      ctx.lineTo(x + 6, y - 46);
      ctx.lineTo(x + 16, y - 46);
      ctx.lineTo(x + 8, y - 39);
      ctx.lineTo(x + 12, y - 28);
      ctx.lineTo(x, y - 34);
      ctx.lineTo(x - 12, y - 28);
      ctx.lineTo(x - 8, y - 39);
      ctx.lineTo(x - 16, y - 46);
      ctx.lineTo(x - 6, y - 46);
      ctx.closePath();
      ctx.fill();

      if (active && flash) {
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y - 42, 26 + Math.sin(state.anim * 0.3) * 3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawBoss() {
      const boss = state.boss;
      if (!boss || boss.hp <= 0) return;
      const x = boss.x - state.cameraX;
      const y = boss.y;
      const chainX = x - 16;
      const chainY = y;
      const maceX = chainX + Math.cos(boss.maceAngle) * boss.chainLen;
      const maceY = chainY + Math.sin(boss.maceAngle) * boss.chainLen;

      ctx.strokeStyle = '#7a7f8b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(chainX, chainY);
      ctx.lineTo(maceX, maceY);
      ctx.stroke();

      ctx.fillStyle = '#d9dfe7';
      ctx.beginPath();
      ctx.arc(maceX, maceY, 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#aab3c0';
      ctx.fillRect(maceX - 18, maceY - 5, 36, 10);

      ctx.fillStyle = '#1a1f2a';
      ctx.fillRect(x - 18, y + 6, 36, 20);
      ctx.fillStyle = '#d2d9e2';
      ctx.fillRect(x - 26, y - 14, 52, 18);
      ctx.fillStyle = '#c41f1f';
      ctx.fillRect(x - 16, y - 16, 32, 10);
      ctx.fillStyle = '#2d4bff';
      ctx.fillRect(x - 22, y + 26, 16, 10);
      ctx.fillRect(x + 6, y + 26, 16, 10);
      ctx.fillStyle = '#000';
      ctx.fillRect(x - 10, y - 13, 8, 8);
      ctx.fillRect(x + 2, y - 13, 8, 8);

      for (const p of boss.hidePlatforms) {
        const px = p.x - state.cameraX;
        ctx.fillStyle = '#49c86a';
        ctx.fillRect(px, p.y, p.w, p.h);
        ctx.fillStyle = '#2d9b51';
        ctx.fillRect(px, p.y + 4, p.w, 3);
      }

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 14px Arial';
      ctx.fillText('EGGMAN', x - 28, y - 28);
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(x - 38, y - 44, 76, 8);
      ctx.fillStyle = '#34d399';
      ctx.fillRect(x - 38, y - 44, (76 * Math.max(0, boss.hp)) / 4, 8);
    }

    function drawPlayer() {
      const p = state.player;
      const x = p.x - state.cameraX;
      const y = p.y;
      const blink = p.invuln > 0 && Math.floor(p.invuln / 8) % 2 === 0;
      const moving = Math.abs(p.vx) > 0.2;
      const bob = moving ? Math.sin(state.anim / 5) * 2.5 : 0;
      const spinPose = p.spinTime > 0;
      const face = p.lookDir;

      ctx.save();
      ctx.translate(x + 15, y + 21 + bob);
      ctx.scale(face, 1);

      if (spinPose) {
        ctx.fillStyle = blink ? '#f8fafc' : '#1e74ff';
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(-10, -10, 20, 8);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-4, -6, 3, 3);
        ctx.fillRect(1, -6, 3, 3);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(-4, 6, 8, 4);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-12, -2, 4, 9);
        ctx.fillRect(8, -2, 4, 9);
      } else {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-12, 12, 24, 3);
        ctx.fillStyle = blink ? '#f8fafc' : '#0a66ff';
        ctx.fillRect(-8, -15, 16, 18);
        ctx.fillStyle = '#dbeafe';
        ctx.fillRect(-8, -28, 16, 12);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-4, -28, 3, 3);
        ctx.fillRect(1, -28, 3, 3);
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(-6, -34, 12, 8);
        ctx.fillStyle = '#ff4732';
        ctx.fillRect(-9, 8, 7, 5);
        ctx.fillRect(2, 8, 7, 5);
        ctx.fillStyle = '#fbbf24';
        ctx.fillRect(-5, 10, 10, 5);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(-10, 14, 5, 9);
        ctx.fillRect(5, 14, 5, 9);
        ctx.fillRect(-13, -9, 4, 11);
        ctx.fillRect(9, -9, 4, 11);
      }
      ctx.restore();
    }

    function drawScene() {
      if (level.underground) {
        drawUnderground();
      } else {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = level.skyTop;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 8; i++) {
          const cloudX = ((i * 180) - (state.cameraX * 0.2)) % (canvas.width + 200);
          ctx.beginPath();
          ctx.arc(cloudX, 72, 26, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      if (!level.underground) {
        drawHills();
      }

      for (const flower of level.flowers) {
        drawSunflower(flower.x - state.cameraX, flower.y, 0.72);
      }

      for (const palm of level.palms) {
        drawPalmTree(palm.x - state.cameraX, palm.y, palm.scale);
      }

      if (!level.underground) {
        drawGround();
        drawBridge();
      }
      drawPlatformBase();
      if (level.columns) drawMarbleColumns();

      for (const cp of state.checkpoints) drawStarPost(cp);
      for (const ring of state.rings) drawRing(ring);
      for (const enemy of state.enemies) {
        if (enemy.type === 'bee') drawBeeBot(enemy);
        else if (enemy.type === 'piranha') drawPiranha(enemy);
      }
      for (const proj of state.projectiles) drawProjectile(proj);
      drawBoss();
      drawPlayer();

      if (state.message) {
        ctx.fillStyle = 'rgba(15,23,42,0.38)';
        ctx.fillRect(165, 120, 470, 70);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(state.message, canvas.width / 2, 160);
      }
    }

    function onGroundCollision() {
      const p = state.player;
      const baseY = level.groundY;
      if (p.y + p.h >= baseY && p.vy >= 0) {
        p.y = baseY - p.h;
        p.vy = 0;
        p.onGround = true;
      }

      const bridge = level.bridge;
      const playerRight = p.x + p.w;
      const playerLeft = p.x;
      const brLeft = bridge.x;
      const brRight = bridge.x + bridge.w;
      const top = bridge.y + 18;
      const bottom = bridge.y + 90;
      const playerBottom = p.y + p.h;
      const playerTop = p.y;

      if (
        playerBottom >= top &&
        playerBottom <= bottom + 12 &&
        p.vy >= 0 &&
        playerRight > brLeft &&
        playerLeft < brRight &&
        playerTop < top + 8
      ) {
        p.y = top - p.h;
        p.vy = 0;
        p.onGround = true;
      }

      for (const plat of level.platforms) {
        const px = plat.x;
        const py = plat.y;
        const pw = plat.w;
        const ph = plat.h;
        if (
          p.x + p.w > px && p.x < px + pw &&
          p.y + p.h >= py && p.y + p.h <= py + 18 &&
          p.vy >= 0
        ) {
          p.y = py - p.h;
          p.vy = 0;
          p.onGround = true;
        }
      }
    }

    function collectRings() {
      const p = state.player;
      for (const ring of state.rings) {
        if (ring.collected) continue;
        const dx = Math.abs((ring.x + 4) - (p.x + p.w / 2));
        const dy = Math.abs((ring.y + 4) - (p.y + p.h / 2));
        if (dx < 18 && dy < 18) {
          ring.collected = true;
          state.ringCount += 1;
          state.score += 25;
          updateHUD();
        }
      }
    }

    function damagePlayer() {
      const p = state.player;
      if (p.invuln > 0) return;
      if (state.ringCount > 0) {
        state.ringCount = Math.max(0, state.ringCount - 5);
        state.score = Math.max(0, state.score - 25);
        p.invuln = 60;
        updateHUD();
        return;
      }
      state.lives -= 1;
      updateHUD();
      if (state.lives <= 0) {
        state.message = 'GAME OVER';
        state.over = true;
        return;
      }
      p.x = p.respawnX;
      p.y = p.respawnY;
      p.vx = 0;
      p.vy = 0;
      p.invuln = 90;
      state.cameraX = Math.max(0, p.x - canvas.width / 2 + 60);
    }

    function checkCheckpoints() {
      for (const cp of state.checkpoints) {
        if (cp.reached) {
          cp.flash = Math.max(0, cp.flash - 1);
          continue;
        }
        if (state.player.x + state.player.w > cp.x && state.player.x < cp.x + 28) {
          cp.reached = true;
          cp.flash = 50;
          state.player.respawnX = cp.x;
          state.player.respawnY = 300;
          state.message = 'CHECKPOINT!';
          setTimeout(() => {
            if (state.message === 'CHECKPOINT!') state.message = '';
          }, 650);
        }
      }
    }

    function updateProjectiles() {
      for (const proj of state.projectiles) {
        proj.x += proj.vx;
        proj.y += proj.vy;
      }
      state.projectiles = state.projectiles.filter((p) => {
        const within = p.x > -20 && p.x < level.width + 20 && p.y > -20 && p.y < canvas.height + 20;
        return within;
      });

      for (const proj of state.projectiles) {
        const p = state.player;
        if (Math.abs(proj.x - (p.x + p.w / 2)) < 13 && Math.abs(proj.y - (p.y + p.h / 2)) < 16) {
          damagePlayer();
        }
      }
    }

    function enemyCollision() {
      const p = state.player;
      for (const enemy of state.enemies) {
        if (!enemy.alive) continue;
        const overlap = (
          p.x + p.w > enemy.x &&
          p.x < enemy.x + enemy.w &&
          p.y + p.h > enemy.y &&
          p.y < enemy.y + enemy.h
        );
        if (!overlap) continue;

        const stomp = (p.y + p.h) <= (enemy.y + 10) && p.vy > 0;
        if (stomp && (p.spinTime > 0 || p.vy > 4.3)) {
          enemy.alive = false;
          p.vy = -8;
          state.score += 150;
          updateHUD();
        } else {
          damagePlayer();
        }
      }
    }

    function updateEnemies() {
      for (const enemy of state.enemies) {
        if (!enemy.alive) continue;

        if (enemy.type === 'bee') {
          enemy.x += enemy.dir * 1.8;
          if (enemy.x < 200 || enemy.x > level.width - 220) enemy.dir *= -1;
          enemy.y = enemy.baseY + Math.sin(state.anim / 10) * 18;
          if (Math.random() < 0.016) {
            spawnProjectile(enemy, enemy.dir);
          }
        }

        if (enemy.type === 'piranha') {
          enemy.jumpTimer += 1;
          const close = Math.abs(state.player.x - enemy.x) < 180;
          const t = (enemy.jumpTimer % 120) / 120;
          if (close) {
            const pop = Math.max(0, Math.sin(t * Math.PI * 2));
            enemy.y = enemy.baseY - pop * 24;
          } else {
            enemy.y = enemy.baseY;
          }
        }
      }
    }

    function updateBoss() {
      const boss = state.boss;
      if (!boss || boss.hp <= 0) return;
      if (state.player.x > boss.x - 140) {
        boss.active = true;
      }
      if (!boss.active) return;

      boss.maceAngle += boss.angleSpeed;
      boss.shield = Math.sin(state.anim * 0.1) * 12;

      const bossRect = { x: boss.x - 36, y: boss.y + 8, w: 72, h: 42 };
      const maceX = boss.x - 16 + Math.cos(boss.maceAngle) * boss.chainLen;
      const maceY = boss.y + Math.sin(boss.maceAngle) * boss.chainLen;

      const hitMace =
        state.player.x + state.player.w > maceX - 18 &&
        state.player.x < maceX + 18 &&
        state.player.y + state.player.h > maceY - 18 &&
        state.player.y < maceY + 18;

      if (hitMace) {
        damagePlayer();
      }

      const under =
        state.player.x + state.player.w > boss.x - 20 &&
        state.player.x < boss.x + 20 &&
        state.player.y + state.player.h >= boss.y + 18 &&
        state.player.y + state.player.h <= boss.y + 45 &&
        state.player.vy > 0;

      if (under && (state.player.spinTime > 0 || state.player.vy > 4.2)) {
        boss.hp -= 1;
        state.player.vy = -8;
        state.score += 250;
        updateHUD();
        if (boss.hp <= 0) {
          state.message = 'BOSS DOWN!';
          state.bossDefeated = true;
          state.score += 1000;
        }
      }

      for (const p of boss.hidePlatforms) {
        const playerMid = state.player.x + state.player.w / 2;
        const platformHit = playerMid > p.x && playerMid < p.x + p.w && state.player.y + state.player.h >= p.y && state.player.y + state.player.h <= p.y + 16 && state.player.vy >= 0;
        if (platformHit) {
          state.player.y = p.y - state.player.h;
          state.player.vy = 0;
          state.player.onGround = true;
        }
      }
    }

    function handleInput() {
      const p = state.player;
      if (keys.left) {
        p.vx = -8.2;
        p.lookDir = -1;
      } else if (keys.right) {
        p.vx = 8.2;
        p.lookDir = 1;
      } else {
        p.vx *= 0.82;
      }

      if (keys.spin && p.onGround) {
        p.spinCharge = Math.min(28, p.spinCharge + 2.5);
      }

      if (!keys.spin && p.spinCharge > 0) {
        p.spinTime = 18;
        p.vx = p.lookDir * (10 + p.spinCharge * 0.45);
        p.spinCharge = 0;
      }

      if (keys.jump && p.onGround) {
        p.vy = -12.8;
        p.onGround = false;
      }

      if (p.spinTime > 0) p.spinTime -= 1;
      if (p.invuln > 0) p.invuln -= 1;
    }

    function advanceLevel() {
      if (actIndex < levelDefs.length - 1) {
        actIndex += 1;
        resetLevelState();
      } else {
        state.message = 'YOU WIN!';
        state.over = true;
      }
    }

    function updatePlayer() {
      const p = state.player;
      p.vy += 0.65;
      p.x += p.vx;
      p.y += p.vy;
      p.onGround = false;

      if (p.x < 0) p.x = 0;
      if (p.x + p.w > level.width) p.x = level.width - p.w;

      onGroundCollision();

      if (p.y + p.h > canvas.height) {
        p.y = canvas.height - p.h;
        p.vy = 0;
        p.onGround = true;
      }

      if (p.x + p.w > level.goalX && !state.boss && !state.bossDefeated) {
        state.message = 'ACT CLEAR!';
        setTimeout(() => advanceLevel(), 650);
      }

      if (state.boss && state.boss.active && state.boss.hp <= 0 && !state.bossDefeated) {
        state.bossDefeated = true;
        state.message = 'BOSS DOWN!';
        setTimeout(() => advanceLevel(), 900);
      }

      state.cameraX = Math.max(0, Math.min(level.width - canvas.width, p.x - canvas.width / 2 + 60));
    }

    function update() {
      if (state.over) {
        drawScene();
        return;
      }

      state.anim += 1;
      handleInput();
      updateEnemies();
      updateBoss();
      updatePlayer();
      checkCheckpoints();
      collectRings();
      enemyCollision();
      updateProjectiles();
      drawScene();
      requestAnimationFrame(update);
    }

    resetGame();
    updateHUD();
    drawScene();
    requestAnimationFrame(update);
  </script>
</body>
