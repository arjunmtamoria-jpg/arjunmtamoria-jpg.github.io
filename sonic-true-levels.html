<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic True Levels</title>
  <style>
    :root {
      --panel: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(255,255,255,0.22);
      --text: #edf6ff;
      --shadow: rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(#071824, #0b1b2a 32%, #111827);
      color: var(--text);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 22px 12px 48px;
    }

    .wrap {
      width: min(980px, 94vw);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      box-shadow: 0 20px 42px rgba(0,0,0,0.4);
      padding: 18px 18px 16px;
    }

    h1 {
      margin: 0 0 14px;
      text-align: center;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: 1px;
      text-shadow: 0 4px 10px rgba(45, 129, 255, 0.35);
    }

    .hud {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .hud-box {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(148,163,184,.42);
      border-radius: 10px;
      padding: 8px 16px;
      min-width: 120px;
      text-align: center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05);
    }

    .ring-display {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .ring-tv {
      display: inline-block;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      position: relative;
      background: black;
      border: 3px solid #9faec1;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.08);
    }

    .ring-tv::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #fff9d5 0 28%, #fff5b7 29% 38%, #ffd84d 39% 100%);
      border: 2px solid #d7ac3d;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,.82);
      background: linear-gradient(#7fd7ff, #ebfbff);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.08);
    }

    .controls {
      margin-top: 12px;
      text-align: center;
      font-size: 15px;
      color: #dfe7ef;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>SONIC TRUE LEVELS</h1>

    <div class="hud">
      <div class="hud-box ring-display">
        <span class="ring-tv" aria-hidden="true"></span>
        <span>Rings: <span id="rings">0</span></span>
      </div>
      <div class="hud-box">Stage: <span id="stage-name">Green Hill</span></div>
      <div class="hud-box">Lives: <span id="lives">3</span></div>
    </div>

    <canvas id="game" width="960" height="420"></canvas>

    <div class="controls">
      GHZ = green grass, checkerboard dirt, palm trees, and bee-bots only.<br>
      Marble Zone = purple dirt, deeper cave pockets, lava, and bats that fly but do not shoot.
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const ringsEl = document.getElementById('rings');
    const stageNameEl = document.getElementById('stage-name');
    const livesEl = document.getElementById('lives');

    const levels = [
      {
        name: 'Green Hill',
        skyTop: '#7fd7ff',
        skyBottom: '#ebfbff',
        dirtA: '#5f3924',
        dirtB: '#432d1a',
        grass: '#46c766',
        grassDark: '#2e9e49',
        hill: '#7fcf69',
        palmTrunk: '#7a4d2a',
        palmLeaves: '#46c766',
        palms: [
          { x: 130, y: 275, scale: 1.08 },
          { x: 350, y: 285, scale: 1.18 },
          { x: 630, y: 282, scale: 1.2 },
          { x: 860, y: 290, scale: 1.32 },
          { x: 1120, y: 280, scale: 1.25 }
        ],
        bees: [
          { x: 240, y: 160 },
          { x: 470, y: 210 },
          { x: 720, y: 180 },
          { x: 980, y: 205 }
        ],
        bats: [],
        flowerXs: [120, 340, 580, 820, 1040, 1270, 1520],
        caveOpenings: [],
        lavaY: null,
        groundY: 330
      },
      {
        name: 'Marble Zone',
        skyTop: '#96c9ff',
        skyBottom: '#edfaff',
        dirtA: '#6d6689',
        dirtB: '#524e69',
        grass: '#a1a8c5',
        grassDark: '#7d82a5',
        hill: '#8c93b8',
        palmTrunk: '#6a5a7c',
        palmLeaves: '#9aa6c7',
        palms: [
          { x: 150, y: 286, scale: 1.08 },
          { x: 470, y: 300, scale: 1.2 },
          { x: 740, y: 294, scale: 1.12 },
          { x: 1040, y: 298, scale: 1.24 },
          { x: 1320, y: 296, scale: 1.18 }
        ],
        bees: [
          { x: 240, y: 170 },
          { x: 610, y: 210 },
          { x: 980, y: 180 }
        ],
        bats: [
          { x: 365, y: 120 },
          { x: 720, y: 150 },
          { x: 1110, y: 126 }
        ],
        flowerXs: [],
        caveOpenings: [
          { x: 220, w: 120 },
          { x: 560, w: 140 },
          { x: 980, w: 120 }
        ],
        lavaY: 340,
        groundY: 330
      }
    ];

    const state = {
      stage: 0,
      time: 0,
      rings: 0,
      lives: 3,
      camera: 0
    };

    function updateHud() {
      ringsEl.textContent = state.rings;
      stageNameEl.textContent = levels[state.stage].name;
      livesEl.textContent = state.lives;
    }

    function drawPalmTree(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.fillStyle = levels[state.stage].palmTrunk;
      ctx.fillRect(-9, 0, 18, 86);

      for (let i = 0; i < 5; i++) {
        const angle = -0.8 + i * 0.42;
        ctx.save();
        ctx.translate(0, -42);
        ctx.rotate(angle);
        ctx.fillStyle = levels[state.stage].palmLeaves;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(26, -12);
        ctx.lineTo(82, -4);
        ctx.lineTo(30, 12);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(82, -4);
        ctx.lineTo(110, 0);
        ctx.lineTo(82, 15);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      ctx.restore();
    }

    function drawGround(level) {
      const y = level.groundY;
      ctx.fillStyle = '#4a2d1a';
      ctx.fillRect(0, y, canvas.width, canvas.height - y);

      const tile = 18;
      const offset = (state.camera * 0.28) % tile;
      for (let x = -tile; x < canvas.width + tile; x += tile) {
        ctx.fillStyle = ((Math.floor((x + offset) / tile) % 2 === 0) ? level.dirtA : level.dirtB);
        ctx.fillRect(x - offset, y, tile, 26);
      }

      ctx.fillStyle = level.grass;
      ctx.fillRect(0, y - 14, canvas.width, 14);

      for (let x = 0; x < canvas.width + 20; x += 14) {
        ctx.fillStyle = level.grassDark;
        ctx.fillRect(x, y - 10, 8, 4);
      }

      if (level.caveOpenings.length) {
        ctx.fillStyle = '#1b2431';
        for (const hole of level.caveOpenings) {
          const px = hole.x - state.camera;
          ctx.fillRect(px, y, hole.w, 120);
          ctx.fillStyle = '#2d3a4f';
          ctx.fillRect(px + 10, y + 18, hole.w - 20, 20);
          ctx.fillStyle = '#1b2431';
        }
      }
    }

    function drawHills(level) {
      ctx.fillStyle = level.hill;
      for (let i = 0; i < 8; i++) {
        const x = i * 180 - (state.camera * 0.24) % 180;
        ctx.beginPath();
        ctx.moveTo(x, 270);
        ctx.quadraticCurveTo(x + 90, 170, x + 180, 270);
        ctx.lineTo(x + 180, 420);
        ctx.lineTo(x, 420);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawFlowers() {
      const xs = levels[state.stage].flowerXs;
      if (!xs.length) return;
      for (const x of xs) {
        const px = x - state.camera;
        ctx.fillStyle = '#7a3f18';
        ctx.fillRect(px, 312, 4, 18);
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(px + 2, 307, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawLava(level) {
      if (!level.lavaY) return;
      ctx.fillStyle = '#ff8d3f';
      ctx.fillRect(0, level.lavaY, canvas.width, canvas.height - level.lavaY);
      ctx.fillStyle = '#ffd27a';
      for (let i = 0; i < 22; i++) {
        const x = i * 52 - (state.camera * 1.1) % 52;
        ctx.fillRect(x, level.lavaY + 8, 18, 10);
      }
    }

    function drawBeeBot(x, y) {
      const px = x - state.camera;
      ctx.save();
      ctx.translate(px, y + Math.sin(state.time * 0.14) * 2);

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.ellipse(0, 0, 18, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#b4bcc8';
      ctx.fillRect(-10, -16, 20, 11);

      ctx.fillStyle = '#000';
      ctx.fillRect(-13, -2, 5, 5);
      ctx.fillRect(8, -2, 5, 5);

      ctx.fillStyle = '#9ad6ff';
      ctx.fillRect(-10, -1, 3, 3);
      ctx.fillRect(7, -1, 3, 3);

      ctx.restore();
    }

    function drawBat(x, y) {
      const px = x - state.camera;
      const py = y + Math.sin(state.time * 0.12) * 5;
      ctx.save();
      ctx.translate(px, py);
      ctx.fillStyle = '#dfeaf8';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-18, 10);
      ctx.lineTo(-12, 18);
      ctx.lineTo(0, 14);
      ctx.lineTo(12, 18);
      ctx.lineTo(18, 10);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#111827';
      ctx.fillRect(-4, 5, 2, 2);
      ctx.fillRect(2, 5, 2, 2);
      ctx.restore();
    }

    function drawRings() {
      for (let i = 0; i < 9; i++) {
        const x = 110 + i * 130;
        const py = (i % 2 === 0) ? 250 : 270;
        const px = x - state.camera;
        ctx.beginPath();
        ctx.arc(px, py, 9, 0, Math.PI * 2);
        ctx.fillStyle = '#ffd84d';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#fff5c2';
        ctx.fill();
      }
    }

    function drawBackground() {
      const level = levels[state.stage];
      const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
      sky.addColorStop(0, level.skyTop);
      sky.addColorStop(1, level.skyBottom);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawHills(level);
      for (const palm of level.palms) {
        drawPalmTree(palm.x - state.camera, palm.y, palm.scale);
      }
      drawFlowers();
      drawGround(level);
      drawLava(level);
      drawRings();
    }

    function drawEnemies() {
      const level = levels[state.stage];
      for (const bee of level.bees) drawBeeBot(bee.x, bee.y);
      for (const bat of level.bats) drawBat(bat.x, bat.y);
    }

    function update() {
      state.time += 1;
      state.camera += 1.2;
      if (state.camera > 1600) state.camera = 0;
    }

    function render() {
      drawBackground();
      drawEnemies();
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'g') {
        state.stage = 0;
        state.camera = 0;
        updateHud();
      }
      if (key === 'm') {
        state.stage = 1;
        state.camera = 0;
        updateHud();
      }
    });

    updateHud();
    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
