<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sonic True Levels</title>
  <style>
    :root { --panel: rgba(15,23,42,.88); --border: rgba(255,255,255,.2); --text: #edf6ff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; color: var(--text); background: linear-gradient(#071824,#0b1b2a 45%,#111827); }
    body { display:flex; justify-content:center; padding:18px 12px 30px; }
    .wrap { width:min(1000px,96vw); padding:18px; background:var(--panel); border:1px solid var(--border); border-radius:16px; box-shadow:0 20px 42px rgba(0,0,0,.4); }
    h1 { margin:0 0 12px; text-align:center; font-size:clamp(26px,4vw,40px); }
    .hud { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-bottom:12px; font-weight:700; }
    .hud span { padding:8px 14px; min-width:120px; text-align:center; background:rgba(15,23,42,.9); border:2px solid rgba(148,163,184,.42); border-radius:9px; }
    canvas { display:block; width:100%; height:auto; border:2px solid rgba(255,255,255,.85); border-radius:7px; background:#0000ff; touch-action:none; }
    .controls { margin-top:10px; text-align:center; color:#dfe7ef; font-size:14px; line-height:1.55; }
    .mobile-controls { display:none; align-items:center; justify-content:space-between; gap:16px; margin:14px auto 0; max-width:540px; touch-action:none; }
    .mobile-group { display:flex; align-items:center; gap:10px; }
    .mobile-btn { min-width:68px; height:58px; border:2px solid rgba(255,255,255,.55); border-radius:15px; color:#fff; background:rgba(30,64,100,.9); font-size:24px; font-weight:800; box-shadow:0 4px 0 rgba(0,0,0,.25); touch-action:none; user-select:none; -webkit-user-select:none; }
    .mobile-btn.jump { min-width:92px; font-size:16px; }
    .mobile-btn:active,.mobile-btn.pressed { background:rgba(56,130,200,.98); transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
    @media (pointer:coarse), (max-width:700px) { .mobile-controls { display:flex; } .wrap { padding:12px; } .hud span { min-width:94px; padding:7px 9px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>SONIC TRUE LEVELS</h1>
    <div class="hud">
      <span>Rings: <b id="rings">0</b></span>
      <span>Stage: <b id="stage">Green Hill Act 1</b></span>
      <span>Lives: <b id="lives">3</b></span>
    </div>
    <canvas id="game" width="960" height="420" aria-label="Sonic platform game"></canvas>
    <div class="mobile-controls" aria-label="Mobile game controls">
      <div class="mobile-group">
        <button class="mobile-btn" data-key="left" aria-label="Move left">◀</button>
        <button class="mobile-btn" data-key="right" aria-label="Move right">▶</button>
      </div>
      <button class="mobile-btn jump" data-key="jump" aria-label="Jump and spin">JUMP</button>
    </div>
    <div class="controls">Move: ← / → or A / D · Jump: Space / ↑ / W (auto-spin in the air)<br>Spin-jump into bee-bots to destroy them. Star posts save checkpoints. Type <b>cheat</b> to skip one act.</div>
  </main>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const ringsLabel = document.getElementById('rings');
  const stageLabel = document.getElementById('stage');
  const livesLabel = document.getElementById('lives');
  const keys = new Set();
  const mobileButtons = [...document.querySelectorAll('.mobile-btn')];
  const GROUND_Y = 342;

  const stages = [
    { name:'Green Hill', act:1, width:4200, skyTop:'#080075', skyBottom:'#1212bd', grass:'#27c840', grassLight:'#70e546', grassDark:'#138a32', dirt:'#a65c2d', dirtDark:'#60301d', dirtLight:'#d18742', hillFar:'#8a4c24', hillNear:'#55bd39', palm:true, cave:false,
      hills:[{x:380,w:260,h:48},{x:850,w:340,h:70},{x:1430,w:300,h:55},{x:2120,w:390,h:78},{x:2970,w:320,h:58}], loops:[{x:1900,r:78}], bees:[{x:760,y:215},{x:1580,y:185},{x:2800,y:210},{x:3650,y:185}], bats:[], posts:[900,2050,3260] },
    { name:'Green Hill', act:2, width:4400, skyTop:'#080075', skyBottom:'#1212bd', grass:'#27c840', grassLight:'#70e546', grassDark:'#138a32', dirt:'#a65c2d', dirtDark:'#60301d', dirtLight:'#d18742', hillFar:'#8a4c24', hillNear:'#55bd39', palm:true, cave:false,
      hills:[{x:300,w:340,h:62},{x:1030,w:390,h:82},{x:1790,w:300,h:52},{x:2460,w:430,h:88},{x:3450,w:360,h:70}], loops:[{x:2220,r:82}], bees:[{x:580,y:190},{x:1430,y:215},{x:3150,y:185},{x:3900,y:210}], bats:[], posts:[1050,2380,3500] },
    { name:'Marble Zone', act:1, width:4200, skyTop:'#10104d', skyBottom:'#5969a0', grass:'#9992a9', grassLight:'#b5abc2', grassDark:'#716b81', dirt:'#765b89', dirtDark:'#40354e', dirtLight:'#a184b1', hillFar:'#42384f', hillNear:'#827a98', palm:false, cave:true,
      hills:[{x:480,w:300,h:54},{x:1360,w:380,h:76},{x:2260,w:340,h:58},{x:3220,w:420,h:80}], loops:[{x:1830,r:76}], bees:[{x:800,y:200},{x:2500,y:185},{x:3550,y:210}], bats:[{x:1180,y:160},{x:2900,y:150}], posts:[1000,2160,3370] },
    { name:'Marble Zone', act:2, width:4500, skyTop:'#10104d', skyBottom:'#5969a0', grass:'#9992a9', grassLight:'#b5abc2', grassDark:'#716b81', dirt:'#765b89', dirtDark:'#40354e', dirtLight:'#a184b1', hillFar:'#42384f', hillNear:'#827a98', palm:false, cave:true,
      hills:[{x:350,w:360,h:68},{x:1180,w:330,h:52},{x:2050,w:420,h:86},{x:2990,w:350,h:64},{x:3740,w:380,h:76}], loops:[{x:2630,r:80}], bees:[{x:640,y:185},{x:1700,y:210},{x:3350,y:180},{x:4110,y:205}], bats:[{x:1000,y:155},{x:2380,y:170},{x:3780,y:145}], posts:[1120,2470,3650] }
  ];

  const game = { stage:0, camera:0, time:0, rings:0, lives:3, player:{x:90,y:GROUND_Y-46,vx:0,vy:0,w:34,h:46,grounded:true,spin:false,invulnerable:0,checkpoint:90,loop:null,loopCooldown:0}, ringObjects:[], projectiles:[], title:true, checkpointFlash:0, cheatBuffer:'', save:{stage:0,checkpoint:90} };
  function level(){ return stages[game.stage]; }
  function groundAt(x){ let y=GROUND_Y; for(const hill of level().hills){ const t=(x-hill.x)/hill.w; if(t>0&&t<1)y=Math.min(y,GROUND_Y-Math.sin(t*Math.PI)*hill.h); } return y; }
  function makeRings(){ const list=[]; for(let x=145;x<level().width-80;x+=54){const ground=groundAt(x);list.push({x,y:ground-30-(list.length%6===3?14:0),collected:false,phase:list.length*.72});} return list; }
  function updateHud(){ ringsLabel.textContent=game.rings; stageLabel.textContent=`${level().name} Act ${level().act}`; livesLabel.textContent=game.lives; }

  function drawCloud(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(225,245,255,.94)';ctx.beginPath();ctx.ellipse(0,0,31,9,0,0,Math.PI*2);ctx.ellipse(25,-6,28,11,0,0,Math.PI*2);ctx.ellipse(53,1,32,9,0,0,Math.PI*2);ctx.fill();ctx.restore();}
  function drawPalm(x,baseY,scale=1){ctx.save();ctx.translate(x,baseY);ctx.scale(scale,scale);ctx.fillStyle='#87451f';ctx.fillRect(-8,-102,16,102);ctx.fillStyle='#aa6330';ctx.fillRect(-5,-101,5,98);const cy=-98,fronds=[[-2.72,88],[-2.12,94],[-1.57,84],[-1.02,94],[-.42,88]];fronds.forEach(([a,len],i)=>{const ux=Math.cos(a),uy=Math.sin(a),px=-uy,py=ux,sh=len*.69,w=12,bx=ux*sh,by=cy+uy*sh,tx=ux*len,ty=cy+uy*len;ctx.fillStyle=i%2?'#0da943':'#18bd43';ctx.beginPath();ctx.moveTo(px*5,cy+py*5);ctx.lineTo(bx+px*w,by+py*w);ctx.lineTo(bx-px*w,by-py*w);ctx.lineTo(-px*5,cy-py*5);ctx.closePath();ctx.fill();ctx.beginPath();ctx.moveTo(bx+px*w,by+py*w);ctx.lineTo(tx,ty);ctx.lineTo(bx-px*w,by-py*w);ctx.closePath();ctx.fill();});ctx.fillStyle='#8b4b22';ctx.fillRect(-5,cy-5,10,10);ctx.restore();}
  function drawTotem(x,baseY,s=1){ctx.save();ctx.translate(x,baseY);ctx.scale(s,s);ctx.fillStyle='#8f552e';ctx.fillRect(-13,-54,26,54);ctx.fillStyle='#d89135';ctx.fillRect(-13,-54,26,7);ctx.fillStyle='#2c923d';ctx.fillRect(-16,-39,32,8);ctx.fillStyle='#f2b83d';for(const [x0,y0] of [[-6,-30],[6,-30],[-6,-15],[6,-15]]){ctx.beginPath();ctx.arc(x0,y0,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#583b29';ctx.beginPath();ctx.arc(x0,y0,1.5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f2b83d';}ctx.fillStyle='#5c351f';ctx.fillRect(-16,-5,32,5);ctx.restore();}
  function drawWater(){ctx.fillStyle='#087fd0';ctx.beginPath();ctx.moveTo(0,302);ctx.quadraticCurveTo(145,282,275,302);ctx.quadraticCurveTo(405,326,530,301);ctx.lineTo(530,338);ctx.lineTo(0,338);ctx.closePath();ctx.fill();ctx.fillStyle='#5bd7f4';ctx.beginPath();ctx.moveTo(0,307);ctx.quadraticCurveTo(145,288,275,307);ctx.quadraticCurveTo(405,330,530,306);ctx.lineTo(530,313);ctx.quadraticCurveTo(405,337,275,314);ctx.quadraticCurveTo(145,296,0,315);ctx.closePath();ctx.fill();ctx.fillStyle='#86e9ff';for(let i=0;i<10;i++){const x=((i*67-game.time*.7)%530+530)%530;ctx.beginPath();ctx.ellipse(x,310+(i%3)*5,15,3,0,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#20a9e3';ctx.fillRect(505,283,25,55);ctx.fillStyle='#8be9ff';ctx.fillRect(510,288,5,46);ctx.fillRect(522,292,3,40);}
  function drawForestAndRidge(){
    // Restore the original GHZ look: distant jagged mountains, dense forest, cloud streaks, and water.
    const offset=(game.camera*.12)%64;
    ctx.fillStyle=level().hillFar;ctx.beginPath();ctx.moveTo(0,267);
    for(let x=-28;x<=canvas.width+32;x+=24){const wx=x+game.camera*.12;const peak=202+Math.sin(wx*.021)*13+Math.sin(wx*.061)*8;ctx.lineTo(x,peak);ctx.lineTo(x+12,peak+19);}
    ctx.lineTo(canvas.width,335);ctx.lineTo(0,335);ctx.closePath();ctx.fill();
    ctx.fillStyle='#176b28';ctx.beginPath();ctx.moveTo(0,292);
    for(let x=-20;x<=canvas.width+24;x+=18){const wx=x+game.camera*.08;const top=263+Math.sin(wx*.025)*9+Math.sin(wx*.071)*5;ctx.lineTo(x,top);ctx.lineTo(x+9,top-12);ctx.lineTo(x+18,top+2);}
    ctx.lineTo(canvas.width,337);ctx.lineTo(0,337);ctx.closePath();ctx.fill();
    for(let i=0;i<13;i++){const x=((i*83-game.camera*.18)%1100+1100)%1100-55;const top=282+(i%4)*9;ctx.fillStyle=i%2?'#13833a':'#23983d';ctx.beginPath();ctx.arc(x,top,19+(i%3)*3,0,Math.PI*2);ctx.arc(x+18,top+3,17,0,Math.PI*2);ctx.arc(x-15,top+5,16,0,Math.PI*2);ctx.fill();}
    void offset;
  }
  function drawBackdrop(){const l=level(),sky=ctx.createLinearGradient(0,0,0,canvas.height);sky.addColorStop(0,l.skyTop);sky.addColorStop(1,l.skyBottom);ctx.fillStyle=sky;ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let i=0;i<17;i++){const x=((i*91+game.time*(.34+(i%3)*.06))%1120)-80;drawCloud(x,34+(i%5)*27,.42+(i%3)*.08);}
    if(l.palm){drawForestAndRidge();drawWater();for(const [wx,s] of [[38,.82],[300,1.02],[566,.9],[828,1.03],[1080,.88],[1360,.95],[1640,1.08],[1930,.9],[2230,1.04],[2490,.9]])drawPalm(wx-game.camera,GROUND_Y,s);for(const [wx,s] of [[190,.9],[470,1],[730,.92],[990,1.02],[1260,.9],[1540,1],[1840,.94],[2140,1.02],[2420,.9]])drawTotem(wx-game.camera,GROUND_Y,s);}
  }
  function traceGround(){ctx.beginPath();ctx.moveTo(0,canvas.height);ctx.lineTo(0,groundAt(game.camera));for(let sx=0;sx<=canvas.width;sx+=4)ctx.lineTo(sx,groundAt(game.camera+sx));ctx.lineTo(canvas.width,canvas.height);ctx.closePath();}
  function drawTerrain(){const l=level();traceGround();ctx.fillStyle=l.dirt;ctx.fill();ctx.save();traceGround();ctx.clip();const tile=20,offset=game.camera%tile;for(let x=-tile;x<canvas.width+tile;x+=tile){for(let y=GROUND_Y-100;y<canvas.height;y+=tile){const odd=(Math.floor((x+offset)/tile)+Math.floor(y/tile))%2;ctx.fillStyle=odd===0?l.dirt:l.dirtDark;ctx.fillRect(x-offset,y,tile,tile);if(odd===0){ctx.fillStyle=l.dirtLight;ctx.fillRect(x-offset+3,y+3,4,4);}}}ctx.restore();ctx.beginPath();for(let x=0;x<=canvas.width;x+=4){const y=groundAt(game.camera+x);if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle=l.grass;ctx.lineWidth=18;ctx.stroke();ctx.beginPath();for(let x=0;x<=canvas.width;x+=4){const y=groundAt(game.camera+x)-7;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.strokeStyle=l.grassLight;ctx.lineWidth=4;ctx.stroke();
    if(l.cave){for(const hole of [{x:370,w:120},{x:980,w:150},{x:1580,w:130},{x:2200,w:150}]){const hx=hole.x-game.camera,y=GROUND_Y;ctx.fillStyle='#201c2b';ctx.fillRect(hx,y,hole.w,78);ctx.fillStyle='#655875';ctx.fillRect(hx-8,y,hole.w+16,9);ctx.fillStyle='#f05b24';ctx.fillRect(hx+5,y+56,hole.w-10,22);}}
  }
  function drawLoops(){for(const loop of level().loops){const x=loop.x-game.camera,r=loop.r,cy=GROUND_Y-r;ctx.save();ctx.translate(x,cy);ctx.beginPath();ctx.arc(0,0,r+12,0,Math.PI*2);ctx.arc(0,0,r-12,0,Math.PI*2,true);ctx.fillStyle='#60301d';ctx.fill('evenodd');for(let i=0;i<16;i++){const a=i*Math.PI/8;ctx.beginPath();ctx.arc(0,0,r,a,a+Math.PI/8);ctx.arc(0,0,r-12,a+Math.PI/8,a,true);ctx.closePath();ctx.fillStyle=i%2?'#a65c2d':'#d18742';ctx.fill();}ctx.strokeStyle='#27c840';ctx.lineWidth=8;ctx.beginPath();ctx.arc(0,0,r+14,Math.PI*.82,Math.PI*1.17);ctx.stroke();ctx.restore();}}
  function drawRing(r){if(r.collected)return;const x=r.x-game.camera;if(x<-20||x>canvas.width+20)return;const squeeze=Math.abs(Math.sin(game.time*.14+r.phase));ctx.lineWidth=4;ctx.strokeStyle='#ffcb28';ctx.beginPath();ctx.ellipse(x,r.y,2+6*squeeze,11,0,0,Math.PI*2);ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#fff3a7';ctx.beginPath();ctx.ellipse(x,r.y,1+3*squeeze,7,0,0,Math.PI*2);ctx.stroke();}
  function drawStarPost(post){const x=post.x-game.camera,y=groundAt(post.x),active=post.active;ctx.fillStyle='#746a70';ctx.fillRect(x-4,y-42,8,42);ctx.fillStyle='#c9c6c1';ctx.fillRect(x-8,y-44,16,5);ctx.fillStyle='#eee8db';ctx.beginPath();ctx.arc(x,y-57,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=active?'#ff3b32':'#1c9cff';ctx.beginPath();ctx.arc(x,y-57,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f6d54a';ctx.beginPath();ctx.moveTo(x,y-76);ctx.lineTo(x+5,y-64);ctx.lineTo(x+17,y-64);ctx.lineTo(x+8,y-56);ctx.lineTo(x+12,y-44);ctx.lineTo(x,y-51);ctx.lineTo(x-12,y-44);ctx.lineTo(x-8,y-56);ctx.lineTo(x-17,y-64);ctx.lineTo(x-5,y-64);ctx.closePath();ctx.fill();if(active&&game.checkpointFlash>0){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y-57,22+Math.sin(game.time*.3)*3,0,Math.PI*2);ctx.stroke();}}
  function drawSonic(){const p=game.player,x=p.x-game.camera,y=p.y;ctx.save();ctx.translate(x+p.w/2,y+p.h/2);if(p.spin)ctx.rotate(game.time*.38);ctx.scale(p.vx<-.2?-1:1,1);ctx.fillStyle='#0750bd';ctx.beginPath();ctx.moveTo(-5,-13);ctx.lineTo(-27,-25);ctx.lineTo(-19,-8);ctx.lineTo(-32,-6);ctx.lineTo(-18,2);ctx.lineTo(-24,12);ctx.lineTo(-8,10);ctx.lineTo(11,5);ctx.lineTo(12,-9);ctx.closePath();ctx.fill();ctx.fillStyle='#1684ff';ctx.beginPath();ctx.ellipse(3,-11,13,14,-.1,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(1,5,9,13,-.15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f4c49a';ctx.beginPath();ctx.ellipse(5,7,6,8,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#1684ff';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-3,3);ctx.lineTo(-11,8);ctx.stroke();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-12,9,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f4c49a';ctx.beginPath();ctx.ellipse(9,-5,8,7,.12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(7,-14,4,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#101827';ctx.fillRect(8,-15,2,5);ctx.fillStyle='#050505';ctx.beginPath();ctx.moveTo(14,-7);ctx.lineTo(22,-4);ctx.lineTo(14,-1);ctx.closePath();ctx.fill();ctx.strokeStyle='#0750bd';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-3,12);ctx.lineTo(-7,18);ctx.moveTo(6,12);ctx.lineTo(8,18);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(-11,16,10,3);ctx.fillRect(5,16,10,3);ctx.fillStyle='#e53b35';ctx.beginPath();ctx.ellipse(-6,21,10,5,-.08,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(10,21,10,5,.08,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-14,19,13,2);ctx.fillRect(2,19,13,2);ctx.restore();}
  function drawBee(bee){const px=bee.x-game.camera,py=bee.y+Math.sin(game.time*.08+bee.x)*5;ctx.save();ctx.translate(px,py);ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.ellipse(-12,-9,8,4,-.4,0,Math.PI*2);ctx.ellipse(12,-9,8,4,.4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f7c900';ctx.beginPath();ctx.ellipse(0,0,13,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#242331';ctx.fillRect(-7,-8,4,16);ctx.fillRect(3,-9,4,17);ctx.fillStyle='#111';ctx.fillRect(6,-3,2,3);ctx.restore();}
  function drawBat(x,y){const px=x-game.camera,py=y+Math.sin(game.time*.09+x)*8;ctx.save();ctx.translate(px,py);ctx.fillStyle='#4c315d';ctx.beginPath();ctx.moveTo(0,-4);ctx.lineTo(-20,-14);ctx.lineTo(-15,-1);ctx.lineTo(-22,9);ctx.lineTo(-8,6);ctx.lineTo(0,13);ctx.lineTo(8,6);ctx.lineTo(22,9);ctx.lineTo(15,-1);ctx.lineTo(20,-14);ctx.closePath();ctx.fill();ctx.fillStyle='#ffed91';ctx.fillRect(-5,-3,2,2);ctx.fillRect(3,-3,2,2);ctx.restore();}
  function drawProjectile(p){const x=p.x-game.camera;ctx.fillStyle='#ff6238';ctx.beginPath();ctx.arc(x,p.y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(x-2,p.y-2,2,0,Math.PI*2);ctx.fill();}
  function resetAct(){game.camera=0;game.player.x=game.player.checkpoint;game.player.y=groundAt(game.player.checkpoint)-game.player.h;game.player.vx=0;game.player.vy=0;game.player.grounded=true;game.player.invulnerable=70;game.player.loop=null;game.player.loopCooldown=0;game.ringObjects=makeRings();game.projectiles=[];for(const bee of level().bees){bee.alive=true;bee.cooldown=100+(bee.x%160);}}
  function showTitle(){game.title=true;game.camera=0;game.player.x=90;game.player.y=groundAt(90)-game.player.h;game.player.vx=0;game.player.vy=0;game.player.grounded=true;game.player.loop=null;game.player.checkpoint=90;game.ringObjects=makeRings();game.projectiles=[];game.checkpointFlash=0;for(const cp of level().checkpoints)cp.active=false;for(const bee of level().bees){bee.alive=true;bee.cooldown=110+(bee.x%170);}updateHud();}
  function advanceAct(){game.stage=(game.stage+1)%stages.length;if(game.stage===0)game.rings=0;showTitle();}
  function drawTitleScreen(){ctx.fillStyle='rgba(0,0,0,.72)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#20202a';ctx.fillRect(262,128,436,164);ctx.fillStyle='#f7e842';ctx.fillRect(275,141,410,138);ctx.fillStyle='#e52827';ctx.fillRect(282,148,125,124);ctx.fillStyle='#243be0';ctx.fillRect(407,148,271,82);ctx.fillStyle='#fff';ctx.font='bold 17px Arial';ctx.textAlign='center';ctx.fillText('SONIC THE HEDGEHOG',542,178);ctx.font='bold 23px Arial';ctx.fillText(`${level().name.toUpperCase()}  ${level().act}`,542,208);ctx.fillStyle='#111';ctx.font='bold 12px Arial';ctx.fillText('PRESS JUMP OR DIRECTION TO START',480,259);}
  function drawScene(){drawBackdrop();drawTerrain();drawLoops();for(const r of game.ringObjects)drawRing(r);for(const cp of level().checkpoints)drawStarPost(cp);for(const bee of level().bees)if(bee.alive)drawBee(bee);for(const bat of level().bats)drawBat(bat.x,bat.y);for(const shot of game.projectiles)drawProjectile(shot);drawSonic();if(game.title)drawTitleScreen();}
  function activateCheckpoint(cp){cp.active=true;game.player.checkpoint=cp.x;game.save={stage:game.stage,checkpoint:cp.x};game.checkpointFlash=80;}
  function update(){
    game.time++;if(game.title)return;const p=game.player,l=level(),left=keys.has('arrowleft')||keys.has('a'),right=keys.has('arrowright')||keys.has('d'),jump=keys.has(' ')||keys.has('arrowup')||keys.has('w');
    if(p.loop){p.loop.progress+=Math.max(.009,Math.abs(p.vx)/215);const t=p.loop.progress,angle=Math.PI/2-t*Math.PI*2;p.x=p.loop.centerX+Math.cos(angle)*p.loop.r-p.w/2;p.y=p.loop.centerY+Math.sin(angle)*p.loop.r-p.h/2;p.vy=0;p.grounded=false;p.spin=true;if(t>=1){p.loop=null;p.loopCooldown=100;p.y=groundAt(p.x+p.w/2)-p.h;p.vy=-2;}}
    else{p.spin=!p.grounded;if(left)p.vx-=.42;if(right)p.vx+=.42;if(!left&&!right)p.vx*=.82;p.vx=Math.max(-5,Math.min(5,p.vx));if(jump&&p.grounded){p.vy=-10.5;p.grounded=false;p.spin=true;}p.vy+=.48;p.x+=p.vx;p.y+=p.vy;const surface=groundAt(p.x+p.w/2);if(p.y+p.h>=surface){p.y=surface-p.h;p.vy=0;p.grounded=true;p.spin=false;}p.x=Math.max(0,Math.min(l.width-p.w,p.x));if(p.loopCooldown>0)p.loopCooldown--;if(p.loopCooldown===0&&p.vx>2.7){const loop=l.loops.find(item=>Math.abs(p.x+p.w/2-item.x)<22);if(loop){p.loop={centerX:loop.x,centerY:GROUND_Y-loop.r,r:loop.r,progress:0};p.spin=true;}}}
    game.camera=Math.max(0,Math.min(l.width-canvas.width,p.x-180));if(p.invulnerable>0)p.invulnerable--;
    for(const r of game.ringObjects)if(!r.collected&&Math.abs((p.x+p.w/2)-r.x)<26&&Math.abs((p.y+p.h/2)-r.y)<34){r.collected=true;game.rings++;updateHud();}
    for(const cp of l.checkpoints)if(!cp.active&&Math.abs((p.x+p.w/2)-cp.x)<20)activateCheckpoint(cp);
    for(const bee of l.bees){if(!bee.alive)continue;const dx=p.x+p.w/2-bee.x,dy=p.y+p.h/2-bee.y;if(Math.abs(dx)<27&&Math.abs(dy)<27){if(p.spin){bee.alive=false;game.rings+=5;updateHud();p.vy=-6;}else if(p.invulnerable===0){game.lives=Math.max(1,game.lives-1);p.invulnerable=90;p.vx=-3;p.vy=-5;updateHud();}}}
    for(const bee of l.bees){if(!bee.alive)continue;bee.cooldown--;if(bee.cooldown<=0&&bee.x-game.camera>-80&&bee.x-game.camera<canvas.width+80){const dx=p.x+p.w/2-bee.x,dy=p.y+p.h/2-bee.y,len=Math.hypot(dx,dy)||1;game.projectiles.push({x:bee.x,y:bee.y,vx:dx/len*3.1,vy:dy/len*3.1});bee.cooldown=155;}}
    for(const s of game.projectiles){s.x+=s.vx;s.y+=s.vy;}game.projectiles=game.projectiles.filter(s=>s.x>-40&&s.x<l.width+40&&s.y>-30&&s.y<canvas.height+30);
    if(p.invulnerable===0){const hit=game.projectiles.findIndex(s=>Math.hypot(p.x+p.w/2-s.x,p.y+p.h/2-s.y)<18);if(hit>=0){game.projectiles.splice(hit,1);game.lives=Math.max(1,game.lives-1);p.x=Math.max(p.checkpoint,p.x-100);p.y=groundAt(p.x)-p.h;p.vx=0;p.vy=0;p.grounded=true;p.invulnerable=90;updateHud();}}
    if(game.checkpointFlash>0)game.checkpointFlash--;if(p.x>=l.width-p.w-1)advanceAct();
  }
  let cheatBuffer='';
  document.addEventListener('keydown',e=>{const key=e.key.toLowerCase();if([' ','arrowup','arrowleft','arrowright'].includes(key))e.preventDefault();if(key.length===1&&/[a-z]/.test(key)){cheatBuffer=(cheatBuffer+key).slice(-5);if(cheatBuffer==='cheat'){cheatBuffer='';advanceAct();return;}}keys.add(key);if(game.title&&([' ','arrowup','arrowright','d'].includes(key))){game.title=false;keys.delete(key);}});
  document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());

  // Touch controls mirror keyboard hold behavior without removing keyboard controls.
  for(const button of mobileButtons){
    const key=button.dataset.key;
    const down=e=>{e.preventDefault();button.classList.add('pressed');if(game.title){game.title=false;return;}if(key==='jump')keys.add(' ');else keys.add(key);};
    const up=e=>{e.preventDefault();button.classList.remove('pressed');if(key==='jump')keys.delete(' ');else keys.delete(key);};
    button.addEventListener('pointerdown',down);button.addEventListener('pointerup',up);button.addEventListener('pointercancel',up);button.addEventListener('pointerleave',up);
  }
  function loop(){update();drawScene();requestAnimationFrame(loop);}
  for(const l of stages)l.checkpoints=l.posts.map(x=>({x,active:false}));game.checkpoints=level().checkpoints;game.ringObjects=makeRings();updateHud();requestAnimationFrame(loop);
</script>
