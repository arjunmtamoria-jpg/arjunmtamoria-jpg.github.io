<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --bg: #020817;
      --bg-2: #0b1220;
      --panel: rgba(15, 23, 42, 0.95);
      --panel-2: #111827;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(96, 165, 250, 0.2);
      --button: #334155;
      --button-hover: #475569;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --success: #22c55e;
      --success-hover: #4ade80;
    }

    body {
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 55%);
      color: var(--text);
      margin: 0;
      font-family: Arial, sans-serif;
    }

    nav {
      background: #020b16;
      border-bottom: 1px solid var(--border);
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.12);
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 20px;
    }

    .back-btn, .reset-btn, .start-btn {
      background: var(--button);
      color: #fff;
      padding: 10px 20px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .back-btn:hover, .reset-btn:hover, .start-btn:hover {
      background: var(--button-hover);
    }

    .reset-btn {
      background: var(--danger);
    }

    .reset-btn:hover {
      background: var(--danger-hover);
    }

    .start-btn {
      background: var(--success);
      font-size: 18px;
      padding: 12px 30px;
    }

    .start-btn:hover {
      background: var(--success-hover);
    }

    .game-info {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 18px 0;
      font-size: 18px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .score-display, .high-score-display {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 10px 18px;
      color: var(--text);
    }

    .high-score-display {
      border-color: rgba(250, 204, 21, 0.7);
      color: #facc15;
    }

    .game-not-started {
      padding: 40px 20px;
      font-size: 18px;
      color: var(--text);
    }

    .controls-info {
      color: var(--muted);
      margin: 10px 0 20px;
    }

    canvas {
      border: 2px solid #fff;
      display: block;
      margin: 20px auto;
      background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
      touch-action: none;
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 600px) {
      .game-info {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="#contact">Contact</a></li>
      <li class="visitor-counter">
        <img src="https://visitor-badge.laobi.icu/badge?page_id=arjunmtamoria-jpg.github.io" alt="Visitor Count">
      </li>
    </ul>
  </nav>

  <div class="container">
    <div class="button-group">
      <a class="back-btn" href="games.html">← Back to Games</a>
      <button class="reset-btn" onclick="resetSnakeGame()">🔄 Reset Game</button>
    </div>

    <h1>🐍 Snake Game</h1>

    <div id="snake-not-started" class="game-not-started">
      <p>Click the button below to start playing!</p>
      <button class="start-btn" onclick="startSnakeGameplay()">▶ Start Game</button>
    </div>

    <div id="snake-gameplay" style="display: none;">
      <p class="controls-info">Use Arrow Keys or WASD to move. On mobile, swipe to control!</p>
      <div class="game-info">
        <div class="score-display">Score: <span id="snakeScore">0</span></div>
        <div class="high-score-display">High Score: <span id="snakeHighScore">0</span></div>
      </div>
      <canvas id="snakeCanvas" width="400" height="400"></canvas>
    </div>
  </div>

  <script>
    const snakeCanvas = document.getElementById('snakeCanvas');
    const snakeCtx = snakeCanvas.getContext('2d');
    let highScores = { snake: parseInt(localStorage.getItem('snakeHighScore')) || 0 };
    document.getElementById('snakeHighScore').textContent = highScores.snake;

    let snakeGame = { snake: [{x: 10, y: 10}], food: {x: 15, y: 15}, direction: {x: 1, y: 0}, nextDirection: {x: 1, y: 0}, score: 0, running: false };
    let snakeTouchStartX = 0, snakeTouchStartY = 0;

    function saveHighScore(game, score) {
      localStorage.setItem(game + 'HighScore', score);
    }

    function snakeTouchStart(e) {
      snakeTouchStartX = e.touches[0].clientX;
      snakeTouchStartY = e.touches[0].clientY;
    }

    function snakeTouchEnd(e) {
      if (!snakeGame.running) return;
      const diffX = e.changedTouches[0].clientX - snakeTouchStartX;
      const diffY = e.changedTouches[0].clientY - snakeTouchStartY;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        if (Math.abs(diffX) > 50 && snakeGame.direction.x === 0) {
          snakeGame.nextDirection = diffX > 0 ? {x: 1, y: 0} : {x: -1, y: 0};
        }
      } else {
        if (Math.abs(diffY) > 50 && snakeGame.direction.y === 0) {
          snakeGame.nextDirection = diffY > 0 ? {x: 0, y: 1} : {x: 0, y: -1};
        }
      }
    }

    function startSnakeGameplay() {
      document.getElementById('snake-not-started').style.display = 'none';
      document.getElementById('snake-gameplay').style.display = 'block';
      snakeGame = { snake: [{x: 10, y: 10}], food: {x: 15, y: 15}, direction: {x: 1, y: 0}, nextDirection: {x: 1, y: 0}, score: 0, running: true };
      document.addEventListener('keydown', snakeKeyHandler);
      snakeCanvas.addEventListener('touchstart', snakeTouchStart);
      snakeCanvas.addEventListener('touchend', snakeTouchEnd);
      snakeGameLoop();
    }

    function resetSnakeGame() {
      if (snakeGame.running) snakeGame.running = false;
      startSnakeGameplay();
    }

    function snakeKeyHandler(e) {
      if (!snakeGame.running) return;
      const key = e.key.toLowerCase();
      if (['arrowup', 'w'].includes(key) && snakeGame.direction.y === 0) snakeGame.nextDirection = {x: 0, y: -1};
      if (['arrowdown', 's'].includes(key) && snakeGame.direction.y === 0) snakeGame.nextDirection = {x: 0, y: 1};
      if (['arrowleft', 'a'].includes(key) && snakeGame.direction.x === 0) snakeGame.nextDirection = {x: -1, y: 0};
      if (['arrowright', 'd'].includes(key) && snakeGame.direction.x === 0) snakeGame.nextDirection = {x: 1, y: 0};
    }

    function snakeGameLoop() {
      if (!snakeGame.running) return;
      snakeGame.direction = snakeGame.nextDirection;
      let head = {x: snakeGame.snake[0].x + snakeGame.direction.x, y: snakeGame.snake[0].y + snakeGame.direction.y};

      if (head.x < 0 || head.x >= 20 || head.y < 0 || head.y >= 20 || snakeGame.snake.some(s => s.x === head.x && s.y === head.y)) {
        snakeGame.running = false;
        alert('Game Over! Score: ' + snakeGame.score);
        return;
      }

      snakeGame.snake.unshift(head);
      if (head.x === snakeGame.food.x && head.y === snakeGame.food.y) {
        snakeGame.score += 10;
        if (snakeGame.score > highScores.snake) {
          highScores.snake = snakeGame.score;
          saveHighScore('snake', snakeGame.score);
          document.getElementById('snakeHighScore').textContent = snakeGame.score;
        }
        snakeGame.food = {x: Math.floor(Math.random() * 20), y: Math.floor(Math.random() * 20)};
      } else {
        snakeGame.snake.pop();
      }

      snakeCtx.fillStyle = '#000';
      snakeCtx.fillRect(0, 0, snakeCanvas.width, snakeCanvas.height);
      snakeCtx.fillStyle = '#00ff00';
      snakeGame.snake.forEach(s => snakeCtx.fillRect(s.x * 20, s.y * 20, 20, 20));
      snakeCtx.fillStyle = '#ff0000';
      snakeCtx.fillRect(snakeGame.food.x * 20, snakeGame.food.y * 20, 20, 20);
      document.getElementById('snakeScore').textContent = snakeGame.score;
      setTimeout(snakeGameLoop, 100);
    }
  </script>
</body>
</html>
