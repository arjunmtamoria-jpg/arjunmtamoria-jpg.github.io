<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Site</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .explore-section { margin-top: 0; }
    .explore-section h2 { color: #333; margin-top: 0; }
    .explore-card {
      display: block;
      max-width: 420px;
      margin: 24px auto 0;
      padding: 24px;
      border: 1px solid rgba(167, 139, 250, 0.35);
      border-radius: 12px;
      background: linear-gradient(135deg, #21143f, #25345f);
      color: #f5f3ff;
      text-align: left;
      text-decoration: none;
      box-shadow: 0 6px 18px rgba(32, 24, 70, 0.22);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .explore-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(32, 24, 70, 0.32); }
    .explore-card h3 { margin: 0 0 8px; color: #fff; }
    .explore-card p { margin: 0; color: #d5d8f2; }
    @media (max-width: 600px) {
      nav ul { flex-wrap: wrap; }
      .visitor-counter { display: none; }
      .container { margin: 24px 16px; padding: 28px 20px; }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="#home" onclick="homeAlert(event)">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li class="visitor-counter">
        <img src="https://visitor-badge.laobi.icu/badge?page_id=arjunmtamoria-jpg.github.io" alt="Visitor Count">
      </li>
    </ul>
  </nav>

  <main>
    <section class="container" id="home">
      <h1>Hello, World! 👋</h1>
      <p>This is my GitHub Pages website.</p>
    </section>

    <section class="container explore-section" id="explore">
      <h2>Explore</h2>
      <p>Find something fun to play.</p>
      <a class="explore-card" href="games.html">
        <h3>🎮 Games</h3>
        <p>Browse the games collection.</p>
      </a>
    </section>
  </main>

  <script>
    function homeAlert(event) {
      event.preventDefault();
      alert("You are already home!");
    }
  </script>
</body>
</html>
