<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Simon Says</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#08111f;color:#eef6ff;font:16px Arial,sans-serif;display:grid;place-items:center;padding:20px}.game{text-align:center;width:min(100%,420px)}h1{margin:8px}p{color:#bdcbe0;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(100px,150px));gap:12px;justify-content:center;margin:24px auto}.pad{height:130px;border:3px solid rgba(255,255,255,.2);border-radius:18px;cursor:pointer;opacity:.8}.pad:active,.pad.lit{opacity:1;filter:brightness(1.6);transform:scale(.97)}.green{background:#16a34a}.red{background:#dc2626}.yellow{background:#eab308}.blue{background:#2563eb}button,.back{display:inline-block;border:0;border-radius:8px;padding:12px 18px;background:#245b8f;color:#fff;font-size:16px;text-decoration:none;cursor:pointer}.status{min-height:24px;color:#7dd3fc;font-weight:bold}
  </style>
</head>
<body>
  <main class="game">
    <h1>🎨 Simon Says</h1>
    <p>Watch the color sequence, then repeat it in the same order.</p>
    <div class="status" id="status" aria-live="polite">Press Start to play.</div>
    <div class="grid" id="pads">
      <button class="pad green" data-color="0" aria-label="Green"></button>
      <button class="pad red" data-color="1" aria-label="Red"></button>
      <button class="pad yellow" data-color="2" aria-label="Yellow"></button>
      <button class="pad blue" data-color="3" aria-label="Blue"></button>
    </div>
    <button id="start">Start</button>
    <p><a class="back" href="games.html">← Back to games</a></p>
  </main>
  <script>
    const pads = [...document.querySelectorAll('.pad')];
    const status = document.getElementById('status');
    let sequence = [], inputIndex = 0, active = false;
    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    async function flash(index) {
      pads[index].classList.add('lit'); await wait(350); pads[index].classList.remove('lit'); await wait(180);
    }
    async function showSequence() {
      active = false; status.textContent = `Level ${sequence.length} — watch!`;
      for (const color of sequence) await flash(color);
      inputIndex = 0; active = true; status.textContent = `Level ${sequence.length} — your turn!`;
    }
    function nextRound() { sequence.push(Math.floor(Math.random() * pads.length)); showSequence(); }
    pads.forEach((pad, index) => pad.addEventListener('click', async () => {
      if (!active) return;
      await flash(index);
      if (index !== sequence[inputIndex]) { active = false; status.textContent = `Game over — you reached level ${sequence.length}. Press Start to try again.`; return; }
      inputIndex++;
      if (inputIndex === sequence.length) { active = false; status.textContent = 'Nice!'; await wait(650); nextRound(); }
    }));
    document.getElementById('start').addEventListener('click', () => { sequence = []; inputIndex = 0; nextRound(); });
  </script>
</body>
</html>
