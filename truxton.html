<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Shooter</title>
  <style>
    :root {
      --bg: #020817;
      --panel: rgba(15, 23, 42, 0.96);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --button: #334155;
      --button-hover: #475569;
      --primary: #38bdf8;
      --secondary: #22c55e;
      --danger: #ef4444;
      --warning: #facc15;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 60%);
      color: var(--text);
    }

    nav {
      background: #020b16;
      border-bottom: 1px solid rgba(96, 165, 250, 0.2);
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    nav ul li {
      margin: 0;
    }

    nav ul li a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 15px 20px;
      transition: background-color 0.3s;
    }

    nav ul li a:hover {
      background-color: #1e293b;
    }

    .visitor-counter {
      margin-left: auto;
      padding-right: 20px;
    }

    .visitor-counter img { height: 20px; }

    .container {
      max-width: 950px;
      margin: 40px auto;
      padding: 24px;
      background: var(--panel);
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.1rem;
    }

    .hud {
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
      margin: 12px auto 18px;
      flex-wrap: wrap;
    }

    .score-box, .lives-box {
      background: #111827;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 8px 14px;
      min-width: 120px;
    }

    .label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      border-radius: 12px;
      border: 2px solid rgba(148, 163, 184, 0.3);
      background: linear-gradient(to bottom, #020817 0%, #0f172a 100%);
    }

    .controls {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      background: var(--button);
      color: #fff;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .button:hover { background: var(--button-hover); }

    .button.success {
      background: var(--secondary);
    }

    .button.success:hover { background: #4ade80; }

    .status {
      margin-top: 12px;
      color: var(--muted);
      min-height: 24px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="#contact">Contact</a></li>
      <li class="visitor-counter">
        <img src="https://visitor-badge.laobi.icu/badge?page_id=arjunmtamoria-jpg.github.io" alt="Visitor Count">
      </li>
    </ul>
  </nav>

  <div class="container">
    <h1>🚀 Space Shooter</h1>

    <div class="hud">
      <div class="score-box">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="lives-box">
        <span class="label">Lives</span>
        <span class="value" id="lives">3</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="760" height="420"></canvas>

    <div class="controls">
      <a class="button" href="games.html">← Back to Games</a>
      <button class="button success" onclick="startGame()">Start / Restart</button>
    </div>

    <div class="status" id="status">Press Start or hold Space to launch.</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const statusEl = document.getElementById('status');

    const keys = {};
    let score = 0;
    let lives = 3;
    let animationId = null;
    let running = false;
    let lastShot = 0;
    let lastEnemySpawn = 0;
    let stars = [];
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 44,
      width: 30,
      height: 24,
      speed: 5
    };

    function resetStars() {
      stars = Array.from({ length: 150 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 1.5 + 0.5
      }));
    }

    function startGame() {
      score = 0;
      lives = 3;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      particles = [];
      lastShot = 0;
      lastEnemySpawn = 0;
      player.x = canvas.width / 2;
      player.y = canvas.height - 44;
      running = true;
      statusEl.textContent = 'Defend the sector!';
      updateHud();
      if (!animationId) {
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
    }

    function shoot() {
      if (!running) return;
      const now = performance.now();
      if (now - lastShot < 180) return;
      bullets.push({
        x: player.x,
        y: player.y - 14,
        w: 4,
        h: 14,
        speed: 8
      });
      lastShot = now;
    }

    function spawnEnemy() {
      const enemyType = Math.random() < 0.7 ? 'drone' : 'fighter';
      const size = enemyType === 'drone' ? 22 : 28;
      const hp = enemyType === 'drone' ? 1 : 2;
      enemies.push({
        x: Math.random() * (canvas.width - 44) + 22,
        y: -30,
        w: size,
        h: size,
        speed: enemyType === 'drone' ? 2 : 2.8,
        hp,
        type: enemyType,
        shotCooldown: Math.random() * 80 + 20
      });
    }

    function spawnParticles(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 30 + Math.random() * 25,
          color
        });
      }
    }

    function update() {
      if (!running) return;

      if (keys.ArrowLeft || keys.a) player.x -= player.speed;
      if (keys.ArrowRight || keys.d) player.x += player.speed;
      if (keys.ArrowUp || keys.w) player.y -= player.speed;
      if (keys.ArrowDown || keys.s) player.y += player.speed;

      if (keys[' ']) shoot();

      player.x = Math.max(16, Math.min(canvas.width - 16, player.x));
      player.y = Math.max(20, Math.min(canvas.height - 30, player.y));

      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = -10;
          star.x = Math.random() * canvas.width;
        }
      });

      bullets.forEach(b => {
        b.y -= b.speed;
      });

      bullets = bullets.filter(b => b.y > -20);

      const now = performance.now();
      if (now - lastEnemySpawn > 850) {
        spawnEnemy();
        lastEnemySpawn = now;
      }

      enemies.forEach(enemy => {
        enemy.y += enemy.speed;
        enemy.x += Math.sin((enemy.y + enemy.h) * 0.05) * 1.4;
        enemy.shotCooldown -= 1;
        if (enemy.shotCooldown <= 0) {
          enemyBullets.push({
            x: enemy.x + enemy.w / 2,
            y: enemy.y + enemy.h,
            w: 4,
            h: 12,
            speed: 5,
            color: '#f97316'
          });
          enemy.shotCooldown = Math.random() * 80 + 45;
        }
      });

      enemyBullets.forEach(b => {
        b.y += b.speed;
      });

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
      });

      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          const hit = !(bullet.x + bullet.w < enemy.x || bullet.x > enemy.x + enemy.w || bullet.y + bullet.h < enemy.y || bullet.y > enemy.y + enemy.h);
          if (hit) {
            bullets.splice(i, 1);
            enemy.hp -= 1;
            spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#38bdf8', 8);
            if (enemy.hp <= 0) {
              enemies.splice(j, 1);
              score += enemy.type === 'fighter' ? 25 : 10;
              spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#facc15', 18);
            }
            break;
          }
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (enemy.y > canvas.height + 30) {
          enemies.splice(i, 1);
          lives -= 1;
          statusEl.textContent = 'Enemy slipped through!';
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];
        const hitPlayer = !(bullet.x + bullet.w < player.x || bullet.x > player.x + player.width || bullet.y + bullet.h < player.y || bullet.y > player.y + player.height);
        if (hitPlayer) {
          enemyBullets.splice(i, 1);
          lives -= 1;
          spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#ef4444', 18);
          statusEl.textContent = 'Direct hit!';
          if (lives <= 0) {
            running = false;
            statusEl.textContent = 'Game over! Press Start / Restart to try again.';
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      updateHud();
    }

    function drawShip(x, y) {
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(x, y - 12);
      ctx.lineTo(x + 12, y + 10);
      ctx.lineTo(x, y + 6);
      ctx.lineTo(x - 12, y + 10);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(x - 2, y + 12, 4, 8);
    }

    function drawEnemy(enemy) {
      if (enemy.type === 'drone') {
        ctx.fillStyle = '#f97316';
        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(enemy.x + 5, enemy.y + 6, enemy.w - 10, 5);
      } else {
        ctx.fillStyle = '#a855f7';
        ctx.beginPath();
        ctx.moveTo(enemy.x + enemy.w / 2, enemy.y);
        ctx.lineTo(enemy.x + enemy.w, enemy.y + enemy.h / 2);
        ctx.lineTo(enemy.x + enemy.w / 2, enemy.y + enemy.h);
        ctx.lineTo(enemy.x, enemy.y + enemy.h / 2);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawBullets() {
      bullets.forEach(b => {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(b.x - 2, b.y, b.w, b.h);
      });

      enemyBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - 2, b.y, b.w, b.h);
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#020817';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      });

      drawBullets();
      enemies.forEach(drawEnemy);
      drawShip(player.x, player.y);
      drawParticles();

      if (!running) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(150, 120, 460, 120);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 30px Arial';
        ctx.fillText('Press Start to Play', 220, 185);
      }
    }

    function gameLoop() {
      update();
      draw();
      animationId = requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys[key] = true;
      if (event.code === 'Space') {
        event.preventDefault();
        if (!running) {
          startGame();
        } else {
          shoot();
        }
      }
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys[key] = false;
    });

    resetStars();
    updateHud();
    draw();
    animationId = requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
