<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Shooter</title>
  <style>
    :root {
      --bg: #020817;
      --panel: rgba(15, 23, 42, 0.96);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --button: #334155;
      --button-hover: #475569;
      --primary: #38bdf8;
      --secondary: #22c55e;
      --danger: #ef4444;
      --warning: #facc15;
      --bomb: #f472b6;
      --power: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 60%);
      color: var(--text);
      overscroll-behavior: none;
    }

    nav {
      background: #020b16;
      border-bottom: 1px solid rgba(96, 165, 250, 0.2);
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }

    nav ul li {
      margin: 0;
    }

    nav ul li a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 15px 20px;
      transition: background-color 0.3s;
    }

    nav ul li a:hover {
      background-color: #1e293b;
    }

    .visitor-counter {
      margin-left: auto;
      padding-right: 20px;
    }

    .visitor-counter img { height: 20px; }

    .container {
      max-width: 950px;
      margin: 40px auto;
      padding: 24px;
      background: var(--panel);
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.12);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.1rem;
    }

    .hud {
      display: flex;
      justify-content: center;
      gap: 20px;
      align-items: center;
      margin: 12px auto 18px;
      flex-wrap: wrap;
    }

    .score-box, .lives-box, .bomb-box, .weapon-box {
      background: #111827;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px;
      padding: 8px 14px;
      min-width: 110px;
    }

    .label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .value {
      font-size: 1.4rem;
      font-weight: bold;
      color: var(--text);
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      border-radius: 12px;
      border: 2px solid rgba(148, 163, 184, 0.3);
      background: linear-gradient(to bottom, #020817 0%, #0f172a 100%);
      touch-action: none;
      user-select: none;
    }

    .controls {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      background: var(--button);
      color: #fff;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      min-height: 44px;
    }

    .button:hover { background: var(--button-hover); }

    .button.success {
      background: var(--secondary);
    }

    .button.success:hover { background: #4ade80; }

    .button.bomb {
      background: var(--danger);
    }

    .button.bomb:hover { background: #fb7185; }

    .mobile-controls {
      display: none;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .mobile-controls button {
      background: rgba(56, 189, 248, 0.18);
      color: #e2e8f0;
      border: 1px solid rgba(96, 165, 250, 0.35);
      border-radius: 10px;
      min-width: 86px;
      min-height: 46px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      color: var(--muted);
      min-height: 24px;
      font-weight: 600;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .container { padding: 16px; }
      .controls { flex-direction: column; align-items: stretch; }
      .button { width: 100%; max-width: 220px; margin: 0 auto; }
      .mobile-controls { display: flex; }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="games.html">Games</a></li>
      <li><a href="#contact">Contact</a></li>
      <li class="visitor-counter">
        <img src="https://visitor-badge.laobi.icu/badge?page_id=arjunmtamoria-jpg.github.io" alt="Visitor Count">
      </li>
    </ul>
  </nav>

  <div class="container">
    <h1>🚀 Space Shooter</h1>

    <div class="hud">
      <div class="score-box">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="lives-box">
        <span class="label">Lives</span>
        <span class="value" id="lives">3</span>
      </div>
      <div class="bomb-box">
        <span class="label">Bombs</span>
        <span class="value" id="bombs">3</span>
      </div>
      <div class="weapon-box">
        <span class="label">Weapon</span>
        <span class="value" id="weapon">Lv1</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="760" height="420"></canvas>

    <div class="mobile-controls">
      <button data-move="left">◀</button>
      <button data-move="up">▲</button>
      <button data-move="right">▶</button>
      <button data-move="down">▼</button>
      <button data-shoot="true">Fire</button>
      <button data-bomb="true">Bomb</button>
    </div>

    <div class="controls">
      <a class="button" href="games.html">← Back to Games</a>
      <button class="button success" onclick="startGame()">Start / Restart</button>
      <button class="button bomb" onclick="dropBomb()">Drop Bomb</button>
    </div>

    <div class="status" id="status">Move: Arrow keys/WASD or drag on the screen • Auto fire on • Bomb: B or Bomb button</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const bombsEl = document.getElementById('bombs');
    const weaponEl = document.getElementById('weapon');
    const statusEl = document.getElementById('status');

    const keys = {};
    let score = 0;
    let lives = 3;
    let animationId = null;
    let running = false;
    let lastShot = 0;
    let lastEnemySpawn = 0;
    let lastPowerupSpawn = 0;
    let lastPlanetSpawn = 0;
    let stars = [];
    let bullets = [];
    let enemyBullets = [];
    let enemies = [];
    let particles = [];
    let powerups = [];
    let planets = [];
    let bombFlash = 0;

    const player = {
      x: canvas.width / 2,
      y: canvas.height - 44,
      width: 30,
      height: 24,
      speed: 5,
      bombs: 3,
      bombLimit: 3,
      rapidFire: 0,
      spread: 1,
      shield: 0,
      touchTarget: null
    };

    const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

    function resetStars() {
      stars = Array.from({ length: 150 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        speed: Math.random() * 1.5 + 0.5
      }));
    }

    function setControlState(control, isPressed) {
      if (control === 'left') keys.ArrowLeft = isPressed;
      if (control === 'right') keys.ArrowRight = isPressed;
      if (control === 'up') keys.ArrowUp = isPressed;
      if (control === 'down') keys.ArrowDown = isPressed;
      if (control === 'shoot') {
        keys[' '] = isPressed;
        keys.Space = isPressed;
      }
      if (control === 'bomb' && isPressed) dropBomb();
    }

    function bindMobileControls() {
      document.querySelectorAll('[data-move]').forEach(button => {
        const direction = button.getAttribute('data-move');
        const press = (event) => {
          event.preventDefault();
          setControlState(direction, true);
        };
        const release = (event) => {
          event.preventDefault();
          setControlState(direction, false);
        };
        button.addEventListener('touchstart', press, { passive: false });
        button.addEventListener('touchend', release, { passive: false });
        button.addEventListener('touchcancel', release, { passive: false });
        button.addEventListener('mousedown', press);
        button.addEventListener('mouseup', release);
        button.addEventListener('mouseleave', release);
      });

      const fireButton = document.querySelector('[data-shoot]');
      if (fireButton) {
        fireButton.addEventListener('touchstart', (event) => {
          event.preventDefault();
          setControlState('shoot', true);
        }, { passive: false });
        fireButton.addEventListener('touchend', (event) => {
          event.preventDefault();
          setControlState('shoot', false);
        }, { passive: false });
        fireButton.addEventListener('mousedown', () => setControlState('shoot', true));
        fireButton.addEventListener('mouseup', () => setControlState('shoot', false));
      }

      const bombButton = document.querySelector('[data-bomb]');
      if (bombButton) {
        bombButton.addEventListener('touchstart', (event) => {
          event.preventDefault();
          dropBomb();
        }, { passive: false });
        bombButton.addEventListener('mousedown', () => dropBomb());
      }
    }

    function bindTouchCanvas() {
      canvas.addEventListener('pointerdown', (event) => {
        if (!running) {
          startGame();
          return;
        }
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        player.touchTarget = {
          x: clamp(x - player.width / 2, 0, canvas.width - player.width),
          y: clamp(y - player.height / 2, 20, canvas.height - player.height)
        };
      });

      canvas.addEventListener('pointermove', (event) => {
        if (!player.touchTarget) return;
        const rect = canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        player.touchTarget = {
          x: clamp(x - player.width / 2, 0, canvas.width - player.width),
          y: clamp(y - player.height / 2, 20, canvas.height - player.height)
        };
      });

      canvas.addEventListener('pointerup', () => {
        player.touchTarget = null;
      });

      canvas.addEventListener('pointerleave', () => {
        player.touchTarget = null;
      });
    }

    function startGame() {
      score = 0;
      lives = 3;
      bullets = [];
      enemyBullets = [];
      enemies = [];
      particles = [];
      powerups = [];
      planets = [];
      bombFlash = 0;
      lastShot = 0;
      lastEnemySpawn = 0;
      lastPowerupSpawn = 0;
      lastPlanetSpawn = 0;
      player.x = canvas.width / 2;
      player.y = canvas.height - 44;
      player.bombs = 3;
      player.bombLimit = 3;
      player.rapidFire = 0;
      player.spread = 1;
      player.shield = 0;
      player.touchTarget = null;
      running = true;
      statusEl.textContent = 'Defend the sector!';
      updateHud();
      if (!animationId) {
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      bombsEl.textContent = player.bombs;
      weaponEl.textContent = 'Lv' + player.spread + (player.rapidFire > 0 ? ' + Rapid' : '');
    }

    function shoot() {
      if (!running) return;
      const now = performance.now();
      const fireRate = player.rapidFire > 0 ? 85 : 180;
      if (now - lastShot < fireRate) return;

      const baseX = player.x + player.width / 2;
      const offsets = player.spread > 1 ? [-8, 0, 8] : [0];

      offsets.forEach(offset => {
        bullets.push({
          x: baseX + offset,
          y: player.y - 14,
          w: 4,
          h: 14,
          speed: 8,
          color: '#38bdf8'
        });
      });

      lastShot = now;
    }

    function spawnEnemy() {
      const roll = Math.random();
      let enemyType = 'drone';
      if (roll > 0.82 && score > 120) enemyType = 'big';
      else if (roll > 0.6) enemyType = 'fighter';

      if (enemyType === 'big') {
        enemies.push({
          x: Math.random() * (canvas.width - 80) + 20,
          y: -40,
          w: 42,
          h: 42,
          speed: 1.6,
          hp: 5,
          type: 'big',
          shotCooldown: 60
        });
        return;
      }

      const size = enemyType === 'drone' ? 22 : 28;
      const hp = enemyType === 'drone' ? 1 : 2;
      enemies.push({
        x: Math.random() * (canvas.width - 44) + 22,
        y: -30,
        w: size,
        h: size,
        speed: enemyType === 'drone' ? 2 : 2.8,
        hp,
        type: enemyType,
        shotCooldown: Math.random() * 80 + 20
      });
    }

    function spawnPowerup() {
      const types = ['rapid', 'bomb', 'shield', 'spread'];
      const type = types[Math.floor(Math.random() * types.length)];
      powerups.push({
        x: Math.random() * (canvas.width - 30) + 15,
        y: -20,
        radius: 12,
        speed: 1.8,
        type
      });
    }

    function spawnPlanet() {
      planets.push({
        x: Math.random() * canvas.width,
        y: -120,
        radius: 28 + Math.random() * 56,
        speed: 0.7 + Math.random() * 1.2,
        drift: (Math.random() - 0.5) * 0.7
      });
    }

    function spawnParticles(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 4,
          vy: (Math.random() - 0.5) * 4,
          life: 30 + Math.random() * 25,
          color
        });
      }
    }

    function activatePowerup(type) {
      if (type === 'rapid') {
        player.rapidFire = 500;
        statusEl.textContent = 'Rapid fire online!';
      }
      if (type === 'bomb') {
        player.bombs = Math.min(player.bombLimit, player.bombs + 1);
        statusEl.textContent = 'Bomb collected!';
      }
      if (type === 'shield') {
        player.shield = 500;
        statusEl.textContent = 'Shield activated!';
      }
      if (type === 'spread') {
        player.spread = Math.min(3, player.spread + 1);
        statusEl.textContent = 'Twin spread upgrade!';
      }
      updateHud();
    }

    function dropBomb() {
      if (!running || player.bombs <= 0) return;
      player.bombs -= 1;
      bombFlash = 18;
      statusEl.textContent = 'Bomb deployed!';

      const blastRadius = 170;
      const centerX = player.x + player.width / 2;
      const centerY = player.y + player.height / 2;

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        const enemyCenterX = enemy.x + enemy.w / 2;
        const enemyCenterY = enemy.y + enemy.h / 2;
        const distance = Math.hypot(enemyCenterX - centerX, enemyCenterY - centerY);
        if (distance < blastRadius) {
          score += enemy.type === 'big' ? 65 : enemy.type === 'fighter' ? 35 : 15;
          spawnParticles(enemyCenterX, enemyCenterY, '#f472b6', 24);
          enemies.splice(i, 1);
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];
        const bulletCenterX = bullet.x + bullet.w / 2;
        const bulletCenterY = bullet.y + bullet.h / 2;
        const distance = Math.hypot(bulletCenterX - centerX, bulletCenterY - centerY);
        if (distance < blastRadius) {
          enemyBullets.splice(i, 1);
          spawnParticles(bulletCenterX, bulletCenterY, '#f472b6', 10);
        }
      }

      updateHud();
    }

    function update() {
      if (!running) return;

      if (player.touchTarget) {
        player.x = clamp(player.touchTarget.x, 0, canvas.width - player.width);
        player.y = clamp(player.touchTarget.y, 20, canvas.height - player.height);
      }

      if (keys.ArrowLeft || keys.a) player.x -= player.speed;
      if (keys.ArrowRight || keys.d) player.x += player.speed;
      if (keys.ArrowUp || keys.w) player.y -= player.speed;
      if (keys.ArrowDown || keys.s) player.y += player.speed;

      if (keys[' '] || keys.Space) shoot();
      shoot();

      player.x = clamp(player.x, 0, canvas.width - player.width);
      player.y = clamp(player.y, 20, canvas.height - player.height);

      if (player.rapidFire > 0) player.rapidFire -= 1;
      if (player.shield > 0) player.shield -= 1;

      stars.forEach(star => {
        star.y += star.speed;
        if (star.y > canvas.height) {
          star.y = -10;
          star.x = Math.random() * canvas.width;
        }
      });

      bullets.forEach(b => {
        b.y -= b.speed;
      });

      bullets = bullets.filter(b => b.y > -20);

      const now = performance.now();
      if (now - lastEnemySpawn > Math.max(320, 900 - score * 0.6)) {
        spawnEnemy();
        lastEnemySpawn = now;
      }

      if (now - lastPowerupSpawn > 9000) {
        spawnPowerup();
        lastPowerupSpawn = now;
      }

      if (now - lastPlanetSpawn > 4500) {
        spawnPlanet();
        lastPlanetSpawn = now;
      }

      planets.forEach(planet => {
        planet.y += planet.speed;
        planet.x += planet.drift;
      });
      planets = planets.filter(planet => planet.y < canvas.height + 100);

      powerups.forEach(powerup => {
        powerup.y += powerup.speed;
      });
      powerups = powerups.filter(powerup => powerup.y < canvas.height + 50);

      enemies.forEach(enemy => {
        enemy.y += enemy.speed;
        if (enemy.type !== 'big') {
          enemy.x += Math.sin((enemy.y + enemy.h) * 0.05) * 1.4;
        }
        enemy.shotCooldown -= 1;
        if (enemy.shotCooldown <= 0) {
          const fireCount = enemy.type === 'big' ? 3 : 1;
          for (let i = 0; i < fireCount; i++) {
            enemyBullets.push({
              x: enemy.x + enemy.w / 2 + (i - (fireCount - 1) / 2) * 8,
              y: enemy.y + enemy.h,
              w: 5,
              h: 12,
              speed: enemy.type === 'big' ? 4.5 : 5,
              color: enemy.type === 'big' ? '#f97316' : '#facc15'
            });
          }
          enemy.shotCooldown = enemy.type === 'big' ? 70 : 60;
        }
      });

      enemyBullets.forEach(b => {
        b.y += b.speed;
      });

      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;
      });

      if (bombFlash > 0) bombFlash -= 1;

      for (let i = powerups.length - 1; i >= 0; i--) {
        const powerup = powerups[i];
        const hit = !(player.x + player.width < powerup.x - powerup.radius ||
          player.x > powerup.x + powerup.radius ||
          player.y + player.height < powerup.y - powerup.radius ||
          player.y > powerup.y + powerup.radius);

        if (hit) {
          activatePowerup(powerup.type);
          powerups.splice(i, 1);
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          const hit = !(bullet.x + bullet.w < enemy.x || bullet.x > enemy.x + enemy.w || bullet.y + bullet.h < enemy.y || bullet.y > enemy.y + enemy.h);
          if (hit) {
            bullets.splice(i, 1);
            enemy.hp -= 1;
            spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#38bdf8', 8);
            if (enemy.hp <= 0) {
              enemies.splice(j, 1);
              score += enemy.type === 'big' ? 100 : enemy.type === 'fighter' ? 25 : 10;
              spawnParticles(enemy.x + enemy.w / 2, enemy.y + enemy.h / 2, '#facc15', 18);
              if (Math.random() < 0.2) spawnPowerup();
            }
            break;
          }
        }
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        if (enemy.y > canvas.height + 30) {
          enemies.splice(i, 1);
          lives -= 1;
          statusEl.textContent = 'Enemy slipped through!';
        }
      }

      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const bullet = enemyBullets[i];
        const hitPlayer = !(bullet.x + bullet.w < player.x || bullet.x > player.x + player.width || bullet.y + bullet.h < player.y || bullet.y > player.y + player.height);
        if (hitPlayer) {
          enemyBullets.splice(i, 1);
          if (player.shield > 0) {
            spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#a78bfa', 18);
            statusEl.textContent = 'Shield absorbed the hit!';
          } else {
            lives -= 1;
            spawnParticles(player.x + player.width / 2, player.y + player.height / 2, '#ef4444', 18);
            statusEl.textContent = 'Direct hit!';
          }
          if (lives <= 0) {
            running = false;
            statusEl.textContent = 'Game over! Press Start / Restart to try again.';
          }
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        if (particles[i].life <= 0) particles.splice(i, 1);
      }

      if (score > 0 && score % 200 === 0 && player.bombs < player.bombLimit) {
        player.bombs = Math.min(player.bombLimit, player.bombs + 1);
        statusEl.textContent = 'Bomb capacity increased!';
      }

      if (score > 0 && score % 300 === 0 && player.spread < 3) {
        player.spread += 1;
        statusEl.textContent = 'Weapon upgraded!';
      }

      updateHud();
    }

    function drawShip(x, y) {
      ctx.fillStyle = player.shield > 0 ? '#a78bfa' : '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(x, y - 12);
      ctx.lineTo(x + 12, y + 10);
      ctx.lineTo(x, y + 6);
      ctx.lineTo(x - 12, y + 10);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(x - 2, y + 12, 4, 8);
    }

    function drawEnemy(enemy) {
      if (enemy.type === 'big') {
        ctx.fillStyle = '#f97316';
        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(enemy.x + 8, enemy.y + 10, enemy.w - 16, 6);
        ctx.fillRect(enemy.x + 12, enemy.y + enemy.h - 12, enemy.w - 24, 6);
        return;
      }

      if (enemy.type === 'drone') {
        ctx.fillStyle = '#f97316';
        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
        ctx.fillStyle = '#facc15';
        ctx.fillRect(enemy.x + 5, enemy.y + 6, enemy.w - 10, 5);
      } else {
        ctx.fillStyle = '#a855f7';
        ctx.beginPath();
        ctx.moveTo(enemy.x + enemy.w / 2, enemy.y);
        ctx.lineTo(enemy.x + enemy.w, enemy.y + enemy.h / 2);
        ctx.lineTo(enemy.x + enemy.w / 2, enemy.y + enemy.h);
        ctx.lineTo(enemy.x, enemy.y + enemy.h / 2);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawBullets() {
      bullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - 2, b.y, b.w, b.h);
      });

      enemyBullets.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - 2, b.y, b.w, b.h);
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
      });
    }

    function drawPowerups() {
      powerups.forEach(powerup => {
        ctx.fillStyle = powerup.type === 'rapid' ? '#fbbf24' :
          powerup.type === 'bomb' ? '#f472b6' :
          powerup.type === 'shield' ? '#a78bfa' : '#4ade80';
        ctx.beginPath();
        ctx.arc(powerup.x, powerup.y, powerup.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 12px Arial';
        ctx.textAlign = 'center';
        const letter = powerup.type === 'rapid' ? 'R' : powerup.type === 'bomb' ? 'B' : powerup.type === 'shield' ? 'S' : 'W';
        ctx.fillText(letter, powerup.x, powerup.y + 4);
      });
    }

    function drawPlanets() {
      planets.forEach(planet => {
        ctx.beginPath();
        ctx.fillStyle = 'rgba(148, 163, 184, 0.75)';
        ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.beginPath();
        ctx.arc(planet.x - planet.radius * 0.25, planet.y - planet.radius * 0.25, planet.radius * 0.35, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawBombFlash() {
      if (bombFlash <= 0) return;
      ctx.fillStyle = 'rgba(244, 114, 182, 0.25)';
      ctx.beginPath();
      ctx.arc(player.x + player.width / 2, player.y + player.height / 2, 170, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#020817';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      stars.forEach(star => {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
      });

      drawPlanets();
      drawBullets();
      enemies.forEach(drawEnemy);
      drawPowerups();
      drawShip(player.x, player.y);
      drawBombFlash();
      drawParticles();

      if (!running) {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.fillRect(150, 120, 460, 120);
        ctx.fillStyle = '#e2e8f0';
        ctx.font = 'bold 30px Arial';
        ctx.fillText('Press Start to Play', 220, 185);
      }
    }

    function gameLoop() {
      update();
      draw();
      animationId = requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys[key] = true;
      if (event.key === 'b' || event.key === 'B') {
        dropBomb();
      }
      if (event.code === 'Space') {
        event.preventDefault();
        if (!running) {
          startGame();
        }
      }
    });

    document.addEventListener('keyup', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys[key] = false;
    });

    bindMobileControls();
    bindTouchCanvas();
    resetStars();
    updateHud();
    draw();
    animationId = requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
