<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Block Builder</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#172031;color:#eff6ff;font:16px Arial,sans-serif;display:flex;justify-content:center;padding:16px}.game{text-align:center;width:min(100%,850px)}h1{margin:6px}.hint{line-height:1.5;color:#c5d2e3}.world{display:block;width:min(100%,768px);height:auto;margin:12px auto;background:#88d4f5;border:3px solid #536b8a;image-rendering:pixelated;touch-action:none}.toolbar,.pad{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px auto}.toolbar button,.pad button{min-width:52px;min-height:46px;padding:9px 13px;border:1px solid #6c83a5;border-radius:8px;background:#283b58;color:white;font-size:16px;font-weight:bold;touch-action:none}.toolbar button.selected{outline:3px solid #facc15}.pad button:active,.toolbar button:active{background:#42658d}#status{min-height:24px;color:#ffe58a}a{color:#8edcff}</style></head>
<body><main class="game"><h1>⛏️ Block Builder</h1><p class="hint">A small Minecraft-style creative sandbox. Move with WASD or arrow keys; Space jumps. Face a block and press E to mine or Q to place. Select materials with 1–4. Mobile: use the buttons and tap the world to mine/place.</p><canvas id="world" class="world" width="768" height="448" aria-label="Block building world"></canvas><div class="toolbar" id="materials"><button data-material="grass">1 Grass</button><button data-material="dirt">2 Dirt</button><button data-material="stone">3 Stone</button><button data-material="wood">4 Wood</button></div><div class="pad"><button data-control="left">◀</button><button data-control="jump">JUMP</button><button data-control="right">▶</button><button data-action="mine">⛏ Mine</button><button data-action="place">＋ Place</button></div><p id="status" aria-live="polite">Selected: Grass</p><p><a href="games.html">Back to games</a></p></main>
<script>
const c=document.getElementById('world'),ctx=c.getContext('2d'),S=32,COLS=24,ROWS=14,colors={grass:'#58b947',dirt:'#95602f',stone:'#87909d',wood:'#a66a35',leaves:'#328344'};let blocks,player,keys=new Set(),selected='grass',facing=1,raf,last=0;
function newWorld(){blocks=Array.from({length:ROWS},()=>Array(COLS).fill(null));for(let x=0;x<COLS;x++){const top=8+Math.round(Math.sin(x*.45)*1.2);for(let y=top;y<ROWS;y++)blocks[y][x]=y===top?'grass':y<top+3?'dirt':'stone'}for(const x of [4,10,17,21]){const top=blocks.findIndex(r=>r[x]);if(top>2){blocks[top-1][x]='wood';blocks[top-2][x]='wood';for(let dx=-1;dx<=1;dx++)for(let dy=-3;dy<=-2;dy++)if(x+dx>=0&&x+dx<COLS&&top+dy>=0)blocks[top+dy][x+dx]='leaves'}}player={x:2.5,y:6,vx:0,vy:0,w:.65,h:1.6,onGround:false};}
function solid(x,y){return x<0||x>=COLS||y>=ROWS||(y>=0&&blocks[y][x]!==null)}function select(m){selected=m;document.querySelectorAll('[data-material]').forEach(b=>b.classList.toggle('selected',b.dataset.material===m));document.getElementById('status').textContent='Selected: '+m;}
function mine(){const tx=Math.floor(player.x+facing*.9),ty=Math.floor(player.y+.65);if(tx>=0&&tx<COLS&&ty>=0&&ty<ROWS&&blocks[ty][tx]){blocks[ty][tx]=null;document.getElementById('status').textContent='Mined a block. Selected: '+selected}}
function place(){const tx=Math.floor(player.x+facing*.9),ty=Math.floor(player.y+.65);if(tx>=0&&tx<COLS&&ty>=0&&ty<ROWS&&!blocks[ty][tx]){blocks[ty][tx]=selected;document.getElementById('status').textContent='Placed '+selected+'. Selected: '+selected}}
function movePlayer(dt){const dir=(keys.has('arrowright')||keys.has('d')||keys.has('right')?1:0)-(keys.has('arrowleft')||keys.has('a')||keys.has('left')?1:0);if(dir)facing=dir;player.vx=dir*5;let nx=player.x+player.vx*dt;if(!solid(Math.floor(nx-player.w/2),Math.floor(player.y+player.h-.1))&&!solid(Math.floor(nx+player.w/2),Math.floor(player.y+player.h-.1))&&!solid(Math.floor(nx-player.w/2),Math.floor(player.y+.2))&&!solid(Math.floor(nx+player.w/2),Math.floor(player.y+.2)))player.x=Math.max(.5,Math.min(COLS-.5,nx));player.vy=Math.min(10,player.vy+22*dt);let ny=player.y+player.vy*dt;if(player.vy>=0&&(solid(Math.floor(player.x-player.w/2),Math.floor(ny+player.h))||solid(Math.floor(player.x+player.w/2),Math.floor(ny+player.h)))){ny=Math.floor(ny+player.h)-player.h;player.vy=0;player.onGround=true}else if(player.vy<0&&(solid(Math.floor(player.x-player.w/2),Math.floor(ny))||solid(Math.floor(player.x+player.w/2),Math.floor(ny)))){ny=Math.floor(ny)+1;player.vy=0}else player.onGround=false;player.y=ny;}
function draw(){ctx.fillStyle='#8bd5f4';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#d5f3ff';ctx.fillRect(0,0,c.width,100);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const b=blocks[y][x];if(!b)continue;ctx.fillStyle=colors[b];ctx.fillRect(x*S,y*S,S,S);ctx.strokeStyle='rgba(0,0,0,.18)';ctx.strokeRect(x*S+.5,y*S+.5,S-1,S-1);if(b==='grass'){ctx.fillStyle='#77d35c';ctx.fillRect(x*S,y*S,S,5)}}ctx.fillStyle='#345ee8';ctx.fillRect((player.x-player.w/2)*S,player.y*S,player.w*S,player.h*S);ctx.fillStyle='#fff';ctx.fillRect((player.x-player.w/2+.1)*S,(player.y+.25)*S,5,5);ctx.fillRect((player.x+player.w/2-.25)*S,(player.y+.25)*S,5,5);ctx.fillStyle=colors[selected];ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.fillRect(12,12,25,25);ctx.strokeRect(12,12,25,25);ctx.lineWidth=1;}
function frame(t){if(!last)last=t;const dt=Math.min((t-last)/1000,.04);last=t;movePlayer(dt);draw();raf=requestAnimationFrame(frame)}
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','arrowup','arrowdown',' '].includes(k))e.preventDefault();keys.add(k);if(k===' '||k==='w'||k==='arrowup'){if(player.onGround)player.vy=-8}if(k==='e')mine();if(k==='q')place();if(['1','2','3','4'].includes(k))select(['grass','dirt','stone','wood'][Number(k)-1])});document.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-material]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.material)));document.querySelectorAll('[data-control]').forEach(b=>{const key=b.dataset.control;const down=e=>{e.preventDefault();keys.add(key);if(key==='jump'&&player.onGround)player.vy=-8};const up=e=>{e.preventDefault();keys.delete(key)};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)});document.querySelector('[data-action="mine"]').addEventListener('pointerdown',e=>{e.preventDefault();mine()});document.querySelector('[data-action="place"]').addEventListener('pointerdown',e=>{e.preventDefault();place()});c.addEventListener('pointerdown',e=>{const r=c.getBoundingClientRect(),tx=Math.floor((e.clientX-r.left)/r.width*COLS),ty=Math.floor((e.clientY-r.top)/r.height*ROWS);if(blocks[ty]?.[tx])blocks[ty][tx]=null;else if(blocks[ty])blocks[ty][tx]=selected;});newWorld();select('grass');raf=requestAnimationFrame(frame);
</script></body></html>
