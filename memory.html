<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Memory Match</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#10102a;color:#f5f6ff;font:16px Arial,sans-serif;display:flex;justify-content:center;padding:18px}.game{width:min(100%,560px);text-align:center}h1{margin:8px}.info{color:#c6c8df}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px auto;max-width:480px}.card{aspect-ratio:1;border:1px solid #52608e;border-radius:12px;background:linear-gradient(145deg,#353e77,#1c2451);color:white;font-size:clamp(24px,8vw,42px);cursor:pointer;box-shadow:0 5px 12px #0005;touch-action:manipulation}.card:focus-visible{outline:3px solid #8edcff}.card.open,.card.matched{background:#f2c95a;color:#1b2141}.card.matched{opacity:.72}.actions{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap}button#restart{padding:10px 18px;border:0;border-radius:8px;background:#4563ad;color:white;font-size:16px;font-weight:bold}a{color:#8edcff}</style></head>
<body><main class="game"><h1>🃏 Memory Match</h1><p class="info">Find all matching pairs. Use arrow keys to choose a card and Enter or Space to flip; tap cards on mobile.</p><p>Moves: <b id="moves">0</b> · Pairs: <b id="pairs">0</b>/8</p><div id="grid" class="grid" aria-label="Memory cards"></div><div class="actions"><button id="restart">New game</button><span id="status" aria-live="polite"></span></div><p><a href="games.html">Back to games</a></p></main><script>
const icons=['🍒','⭐','🐸','🚀','🍋','🎈','🐙','💎'];let first=null,lock=false,moves=0,pairs=0;const grid=document.getElementById('grid');function start(){const deck=[...icons,...icons].sort(()=>Math.random()-.5);first=null;lock=false;moves=0;pairs=0;document.getElementById('moves').textContent='0';document.getElementById('pairs').textContent='0';document.getElementById('status').textContent='';grid.innerHTML='';deck.forEach((value,i)=>{const b=document.createElement('button');b.className='card';b.type='button';b.textContent='?';b.setAttribute('aria-label','Hidden card '+(i+1));b.dataset.value=value;b.addEventListener('click',()=>flip(b));grid.appendChild(b)});grid.firstElementChild.focus()}
function flip(card){if(lock||card.classList.contains('open')||card.classList.contains('matched'))return;card.classList.add('open');card.textContent=card.dataset.value;card.setAttribute('aria-label',card.dataset.value);if(!first){first=card;return}moves++;document.getElementById('moves').textContent=moves;if(first.dataset.value===card.dataset.value){first.classList.add('matched');card.classList.add('matched');first=null;pairs++;document.getElementById('pairs').textContent=pairs;if(pairs===icons.length)document.getElementById('status').textContent='You found every pair!'}else{lock=true;const previous=first;first=null;setTimeout(()=>{for(const c of [previous,card]){c.classList.remove('open');c.textContent='?';c.setAttribute('aria-label','Hidden card')}lock=false},750)}}
document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='r'){start();return}const active=document.activeElement;if(!grid.contains(active))return;const index=[...grid.children].indexOf(active),next={ArrowLeft:index%4?index-1:index,ArrowRight:index%4<3?index+1:index,ArrowUp:index>=4?index-4:index,ArrowDown:index<12?index+4:index}[e.key];if(next!==undefined){e.preventDefault();grid.children[next].focus()}if(e.key==='Enter'||e.key===' '){e.preventDefault();active.click()}});document.getElementById('restart').addEventListener('click',start);start();
</script></body></html>
