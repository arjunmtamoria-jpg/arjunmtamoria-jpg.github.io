<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonic Run</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --bg: #020817;
      --panel: rgba(15, 23, 42, 0.95);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --button: #334155;
      --button-hover: #475569;
      --danger: #ef4444;
      --danger-hover: #f87171;
      --success: #22c55e;
      --success-hover: #4ade80;
      --ring: #facc15;
      --ring-dark: #ca8a04;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: radial-gradient(circle at top, #0f172a 0%, var(--bg) 55%);
      font-family: Arial, sans-serif;
    }

    nav {
      background: #020b16;
      border-bottom: 1px solid rgba(96, 165, 250, 0.2);
    }

    nav ul {
      margin: 0;
      padding: 0 16px;
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      min-height: 56px;
    }

    nav a {
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 700;
    }

    .container {
      max-width: 980px;
      margin: 40px auto;
      background: var(--panel);
      border: 1px solid rgba(96, 165, 250, 0.2);
      border-radius: 14px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(14, 165, 233, 0.12);
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 12px 0 20px;
    }

    .back-btn, .reset-btn, .start-btn {
      background: var(--button);
      color: #fff;
      padding: 10px 20px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .back-btn:hover, .reset-btn:hover, .start-btn:hover { background: var(--button-hover); }
    .reset-btn { background: var(--danger); }
    .reset-btn:hover { background: var(--danger-hover); }
    .start-btn {
      background: var(--success);
      font-size: 18px;
      padding: 12px 30px;
    }

    .start-btn:hover { background: var(--success-hover); }

    .game-info {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 18px 0;
      font-size: 18px;
      font-weight: bold;
      flex-wrap: wrap;
    }

    .score-display, .high-score-display, .level-display, .lives-display {
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 10px 18px;
      color: var(--text);
    }

    .high-score-display { border-color: rgba(250, 204, 21, 0.7); color: #facc15; }
    .level-display { border-color: rgba(56, 189, 248, 0.7); color: #7dd3fc; }
    .lives-display { border-color: rgba(248, 113, 113, 0.75); color: #fca5a5; }

    .game-not-started {
      padding: 40px 20px;
      font-size: 18px;
      color: var(--text);
    }

    .controls-info {
      color: var(--muted);
      margin: 10px 0 20px;
    }

    canvas {
      border: 2px solid #fff;
      display: block;
      margin: 20px auto;
      background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
      touch-action: none;
      max-width: 100%;
      height: auto;
    }

    .mobile-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .mobile-controls button {
      background: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .game-info { flex-direction: column; gap: 12px; }
    }
  </style>
</head>

    let platformerKeys = { left: false, right: false };

    function buildLevel(levelData) {
      return {
        name: levelData.name,
        act: levelData.act,
        width: levelData.width,
        sign: { x: levelData.signX, y: 290, angle: 0, wobble: 0 },
        goal: { ...levelData.goal },
        checkpoints: levelData.checkpoints.map(cp => ({ ...cp })),
        player: {
          x: levelData.startX,
          y: 300,
          width: 30,
          height: 40,
          velocityY: 0,
          velocityX: 0,
          jumping: false,
          spinAngle: 0,
          direction: 1
        },
        platforms: levelData.platforms.map(p => ({ ...p })),
        loops: levelData.loops ? levelData.loops.map(loop => ({ ...loop })) : [],
        rings: levelData.rings.map(r => ({ ...r })),
        enemies: levelData.enemies.map(e => ({ ...e })),
        tvBoxes: levelData.tvBoxes ? levelData.tvBoxes.map(tv => ({ ...tv })) : [],
        boss: levelData.boss ? { ...levelData.boss } : null,
        score: 0,
        lives: 3,
        running: true,
        gravity: 0.6,
        droppedRings: [],
        invulnerable: 0,
        respawnX: levelData.startX,
        respawnY: 300,
        clearing: false,
        clearTimer: 0,
        introTimer: 1800
      };
    }

    let platformerGame = buildLevel(LEVELS[0]);

    function saveHighScore(game, score) {
      localStorage.setItem(game + 'HighScore', score);
    }

    function updateHUD() {
      const stageName = LEVELS[levelIndex] ? `${LEVELS[levelIndex].name} - ${LEVELS[levelIndex].act}` : 'Stage';
      document.getElementById('platformerLevel').textContent = stageName;
      document.getElementById('platformerScore').textContent = platformerGame.score;
      document.getElementById('platformerLives').textContent = platformerGame.lives;
      document.getElementById('platformerHighScore').textContent = highScores.platformer;
    }

    function startPlatformerGameplay() {
      document.getElementById('platformer-not-started').style.display = 'none';
      document.getElementById('platformer-gameplay').style.display = 'block';
      levelIndex = 0;
      cameraX = 0;
      platformerGame = buildLevel(LEVELS[levelIndex]);
      updateHUD();
      platformerKeys = { left: false, right: false };
      document.addEventListener('keydown', platformerKeyHandler);
      document.addEventListener('keyup', platformerKeyUpHandler);
      platformerGameLoop();
    }

    function resetPlatformerGame() {
      if (platformerGame.running) platformerGame.running = false;
      startPlatformerGameplay();
    }

    function platformerKeyHandler(e) {
      const key = e.key.toLowerCase();
      if (e.key === 'ArrowLeft' || key === 'a') platformerKeys.left = true;
      if (e.key === 'ArrowRight' || key === 'd') platformerKeys.right = true;
      if (e.code === 'Space') { e.preventDefault(); jumpPlatformer(); }
    }

    function platformerKeyUpHandler(e) {
      const key = e.key.toLowerCase();
      if (e.key === 'ArrowLeft' || key === 'a') platformerKeys.left = false;
      if (e.key === 'ArrowRight' || key === 'd') platformerKeys.right = false;
    }

    function jumpPlatformer() {
      const p = platformerGame.player;
      if (!platformerGame.running || !p || p.jumping) return;
      p.velocityY = -12;
      p.jumping = true;
    }

    function nextLevel() {
      if (levelIndex < LEVELS.length - 1) {
        levelIndex += 1;
        cameraX = 0;
        platformerGame = buildLevel(LEVELS[levelIndex]);
        updateHUD();
        platformerGameLoop();
      } else {
        platformerGame.running = false;
        alert('You beat all stages and defeated Eggman! Final rings: ' + platformerGame.score);
      }
    }

    function drawRing(x, y, radius) {
      platformerCtx.beginPath();
      platformerCtx.arc(x, y, radius, 0, Math.PI * 2);
      platformerCtx.fillStyle = '#facc15';
      platformerCtx.fill();
      platformerCtx.strokeStyle = '#ca8a04';
      platformerCtx.lineWidth = 2;
      platformerCtx.stroke();

      platformerCtx.beginPath();
      platformerCtx.arc(x, y, radius * 0.55, 0, Math.PI * 2);
      platformerCtx.fillStyle = '#fff7d6';
      platformerCtx.fill();
      platformerCtx.closePath();
    }

    function drawSonicTitleSprite(x, y, scale = 2) {
      const px = x;
      const py = y;
      const s = scale;

      platformerCtx.save();
      platformerCtx.translate(px, py);

      platformerCtx.fillStyle = '#f8fafc';
      platformerCtx.fillRect(0, -18 * s, 16 * s, 14 * s);
      platformerCtx.fillStyle = '#1d4ed8';
      platformerCtx.fillRect(-6 * s, -4 * s, 28 * s, 20 * s);

      platformerCtx.fillStyle = '#f8fafc';
      platformerCtx.fillRect(2 * s, -12 * s, 12 * s, 10 * s);
      platformerCtx.fillStyle = '#0f172a';
      platformerCtx.fillRect(2 * s, -15 * s, 4 * s, 4 * s);
      platformerCtx.fillRect(10 * s, -15 * s, 4 * s, 4 * s);

      platformerCtx.fillStyle = '#facc15';
      platformerCtx.fillRect(-8 * s, 12 * s, 32 * s, 5 * s);

      platformerCtx.fillStyle = '#ef4444';
      platformerCtx.fillRect(-10 * s, 16 * s, 10 * s, 7 * s);
      platformerCtx.fillRect(16 * s, 16 * s, 10 * s, 7 * s);

      platformerCtx.fillStyle = '#f8fafc';
      platformerCtx.fillRect(-15 * s, 0, 6 * s, 7 * s);
      platformerCtx.fillRect(19 * s, 0, 6 * s, 7 * s);

      platformerCtx.fillStyle = '#facc15';
      for (let i = 0; i < 4; i++) {
        const spikeX = -8 * s + i * 8 * s;
        platformerCtx.beginPath();
        platformerCtx.moveTo(spikeX, -8 * s);
        platformerCtx.lineTo(spikeX + 4 * s, -22 * s);
        platformerCtx.lineTo(spikeX + 8 * s, -8 * s);
        platformerCtx.fill();
      }

      platformerCtx.restore();
    }

    function drawPlayerSprite(playerX, playerY) {
      const p = platformerGame.player;
      const spinSpeed = p.jumping ? 0.45 : Math.abs(p.velocityX) > 0.5 ? 0.28 : 0.12;
      p.spinAngle += spinSpeed;

      const invuln = platformerGame.invulnerable > 0 && Math.floor(platformerGame.invulnerable / 8) % 2 === 0;

      platformerCtx.save();
      platformerCtx.translate(playerX + 15, playerY + 20);
      if (p.velocityX < 0) platformerCtx.scale(-1, 1);
      platformerCtx.rotate(p.spinAngle * 0.15);

      platformerCtx.fillStyle = invuln ? '#f8fafc' : '#f8fafc';
      platformerCtx.fillRect(-8, -18, 16, 14);

      platformerCtx.fillStyle = invuln ? '#bfdbfe' : '#2563eb';
      platformerCtx.fillRect(-12, -4, 24, 20);

      platformerCtx.fillStyle = '#f8fafc';
      platformerCtx.fillRect(-3, -12, 8, 8);
      platformerCtx.fillStyle = '#0f172a';
      platformerCtx.fillRect(-6, -14, 3, 3);
      platformerCtx.fillRect(3, -14, 3, 3);

      platformerCtx.fillStyle = '#facc15';
      platformerCtx.fillRect(-10, 8, 20, 4);

      platformerCtx.fillStyle = '#ef4444';
      platformerCtx.fillRect(-11, 14, 10, 7);
      platformerCtx.fillRect(1, 14, 10, 7);

      platformerCtx.fillStyle = '#f8fafc';
      platformerCtx.fillRect(-15, 0, 6, 7);
      platformerCtx.fillRect(9, 0, 6, 7);

      platformerCtx.fillStyle = '#facc15';
      for (let i = 0; i < 4; i++) {
        const qX = -8 + i * 6;
        platformerCtx.beginPath();
        platformerCtx.moveTo(qX, -8);
        platformerCtx.lineTo(qX + 3, -18);
        platformerCtx.lineTo(qX + 6, -8);
        platformerCtx.fill();
      }

      platformerCtx.restore();
    }

    function drawEnemySprite(enemyX, enemyY) {
      platformerCtx.fillStyle = '#ef4444';
      platformerCtx.fillRect(enemyX + 3, enemyY + 5, 24, 20);
      platformerCtx.fillStyle = '#f8fafc';
      platformerCtx.fillRect(enemyX + 8, enemyY + 10, 4, 4);
      platformerCtx.fillRect(enemyX + 18, enemyY + 10, 4, 4);
      platformerCtx.fillStyle = '#0f172a';
      platformerCtx.fillRect(enemyX + 6, enemyY + 25, 18, 5);
    }

    function drawStarPost(checkpoint, screenX) {
      const isActive = checkpoint.active;
      platformerCtx.fillStyle = '#7c2d12';
      platformerCtx.fillRect(screenX - 4, 330, 8, 90);
      platformerCtx.fillStyle = isActive ? '#facc15' : '#e2e8f0';
      platformerCtx.beginPath();
      for (let i = 0; i < 5; i++) {
        const outer = 16;
        const inner = 7;
        const angle = (Math.PI / 180) * (90 + i * 72);
        const x1 = screenX + Math.cos(angle) * outer;
        const y1 = 315 + Math.sin(angle) * outer;
        const angle2 = (Math.PI / 180) * (90 + (i * 72) + 36);
        const x2 = screenX + Math.cos(angle2) * inner;
        const y2 = 315 + Math.sin(angle2) * inner;
        if (i === 0) platformerCtx.moveTo(x2, y2);
        platformerCtx.lineTo(x1, y1);
        platformerCtx.lineTo(x2, y2);
      }
      platformerCtx.closePath();
      platformerCtx.fill();
    }

    function drawLevelIntro() {
      const level = LEVELS[levelIndex];
      if (!level) return;

      const panelAlpha = Math.max(0, 0.85 - (platformerGame.introTimer / 1800));
      platformerCtx.fillStyle = `rgba(2, 6, 23, ${panelAlpha})`;
      platformerCtx.fillRect(0, 0, platformerCanvas.width, platformerCanvas.height);

      drawSonicTitleSprite(225, 200, 2.4);

      platformerCtx.fillStyle = '#facc15';
      platformerCtx.font = 'bold 32px Arial';
      platformerCtx.fillText('SONIC RUN', 215, 120);

      platformerCtx.fillStyle = '#e2e8f0';
      platformerCtx.font = 'bold 18px Arial';
      platformerCtx.fillText('LEVEL ' + (levelIndex + 1), 325, 150);

      platformerCtx.fillStyle = '#7dd3fc';
      platformerCtx.font = 'bold 34px Arial';
      platformerCtx.fillText(level.name.toUpperCase(), 210, 235);

      platformerCtx.fillStyle = '#f8fafc';
      platformerCtx.font = 'bold 20px Arial';
      platformerCtx.fillText(level.act.toUpperCase(), 315, 270);

      platformerCtx.fillStyle = '#facc15';
      platformerCtx.fillRect(120, 290, 560, 12);
      platformerCtx.fillStyle = '#0f172a';
      platformerCtx.fillRect(120, 290, 560 * (1 - platformerGame.introTimer / 1800), 12);
    }

    function dropRingsFromHit(x, y, count) {
      for (let i = 0; i < count; i += 1) {
        const angle = (i / Math.max(1, count)) * Math.PI * 2;
        platformerGame.droppedRings.push({
          x: x + 15 + Math.cos(angle) * 18,
          y: y + 10 + Math.sin(angle) * 18,
          radius: 8,
          velocityX: Math.cos(angle) * 2.2,
          velocityY: -4.8 - (i * 0.2),
          gravity: 0.18
        });
      }
    }

    function takeHit() {
      if (!platformerGame.running || platformerGame.invulnerable > 0) return;

      const p = platformerGame.player;
      platformerGame.invulnerable = 90;

      if (platformerGame.score > 0) {
        const lostRings = Math.min(platformerGame.score, 10);
        platformerGame.score = Math.max(0, platformerGame.score - lostRings);
        dropRingsFromHit(p.x, p.y, lostRings / 2);
        updateHUD();
        return;
      }

      platformerGame.lives -= 1;
      updateHUD();

      if (platformerGame.lives <= 0) {
        platformerGame.running = false;
        alert('Game Over! Final rings: ' + platformerGame.score);
        return;
      }

      p.x = platformerGame.respawnX;
      p.y = platformerGame.respawnY;
      p.velocityX = 0;
      p.velocityY = 0;
      p.jumping = false;
    }

    function drawBoss(boss, bossX) {
      if (!boss) return;
      const bodyColor = boss.color || '#1f2937';
      const accent = boss.accent || '#facc15';
      const w = boss.width;
      const h = boss.height;

      platformerCtx.fillStyle = bodyColor;
      platformerCtx.fillRect(bossX, boss.y, w, h);

      platformerCtx.fillStyle = '#0f172a';
      platformerCtx.fillRect(bossX + 15, boss.y + 18, 16, 14);
      platformerCtx.fillRect(bossX + w - 31, boss.y + 18, 16, 14);

      platformerCtx.fillStyle = accent;
      platformerCtx.fillRect(bossX + 10, boss.y + 42, w - 20, 12);
      platformerCtx.fillRect(bossX + 18, boss.y + 60, w - 36, 10);

      platformerCtx.fillStyle = '#f8fafc';
      platformerCtx.font = 'bold 12px Arial';
      platformerCtx.fillText(boss.name, bossX, boss.y - 8);
      platformerCtx.fillStyle = '#facc15';
      platformerCtx.fillText('HP: ' + boss.health, bossX, boss.y - 20);
    }

    function drawSign(s) {
      const signX = s.x - cameraX;
      platformerCtx.save();
      platformerCtx.translate(signX, 300);
      platformerCtx.rotate(s.angle);
      platformerCtx.fillStyle = '#7c2d12';
      platformerCtx.fillRect(-8, 0, 16, 80);
      platformerCtx.fillStyle = '#f8fafc';
      platformerCtx.fillRect(-28, 12, 56, 26);
      platformerCtx.fillStyle = '#0ea5e9';
      platformerCtx.beginPath();
      platformerCtx.moveTo(-18, 18);
      platformerCtx.lineTo(18, 18);
      platformerCtx.lineTo(0, -10);
      platformerCtx.closePath();
      platformerCtx.fill();
      platformerCtx.restore();
    }

    function platformerGameLoop() {
      if (!platformerGame.running) return;

      const p = platformerGame.player;
      if (platformerGame.invulnerable > 0) platformerGame.invulnerable -= 1;

      if (platformerGame.introTimer > 0) {
        platformerGame.introTimer -= 30;
        drawBackground();
        drawLevelIntro();
        setTimeout(platformerGameLoop, 30);
        return;
      }

      if (platformerGame.clearing) {
        platformerGame.clearTimer -= 30;
        platformerGame.sign.angle += 0.12;
        if (platformerGame.clearTimer <= 0) {
          nextLevel();
          return;
        }
      }

      if (!platformerGame.clearing) {
        platformerGame.checkpoints.forEach(cp => {
          const reached = p.x + p.width > cp.x && p.x < cp.x + 20 && p.y + p.height > 200 && p.y < 400;
          if (reached && !cp.active) {
            cp.active = true;
            platformerGame.respawnX = cp.x;
            platformerGame.respawnY = 300;
          }
        });

        if (platformerKeys.left) p.velocityX = -5;
        else if (platformerKeys.right) p.velocityX = 5;
        else p.velocityX *= 0.8;

        p.velocityY += platformerGame.gravity;
        p.x += p.velocityX;
        p.y += p.velocityY;

        if (p.x < 0) p.x = 0;
        if (p.x + p.width > platformerGame.width) p.x = platformerGame.width - p.width;

        let onGround = false;
        platformerGame.platforms.forEach(plat => {
          if (p.velocityY >= 0 && p.y + p.height >= plat.y && p.y + p.height <= plat.y + 30 && p.x + p.width > plat.x && p.x < plat.x + plat.width) {
            p.velocityY = 0;
            p.y = plat.y - p.height;
            onGround = true;
            p.jumping = false;
          }
        });

        if (!onGround && p.velocityY > 0) p.jumping = true;
      }

      cameraX = Math.max(0, Math.min(platformerGame.width - platformerCanvas.width, p.x - 250));
      platformerGame.sign.angle += platformerGame.clearing ? 0.18 : Math.sin(p.x / 60) * 0.03;
      platformerGame.sign.wobble += 0.08;

      if (!platformerGame.clearing) {
        platformerGame.rings = platformerGame.rings.filter(ring => {
          if (p.x < ring.x + 20 && p.x + p.width > ring.x && p.y < ring.y + 20 && p.y + p.height > ring.y) {
            platformerGame.score += 10;
            if (platformerGame.score > highScores.platformer) {
              highScores.platformer = platformerGame.score;
              saveHighScore('platformer', platformerGame.score);
            }
            updateHUD();
            return false;
          }
          return true;
        });

        platformerGame.droppedRings = platformerGame.droppedRings.filter(ring => {
          ring.x += ring.velocityX;
          ring.y += ring.velocityY;
          ring.velocityY += ring.gravity;

          if (ring.y + ring.radius > 400) {
            ring.y = 400 - ring.radius;
            ring.velocityY *= -0.25;
            ring.velocityX *= 0.8;
          }

          if (p.x < ring.x + ring.radius && p.x + p.width > ring.x - ring.radius && p.y < ring.y + ring.radius && p.y + p.height > ring.y - ring.radius) {
            platformerGame.score += 10;
            if (platformerGame.score > highScores.platformer) {
              highScores.platformer = platformerGame.score;
              saveHighScore('platformer', platformerGame.score);
            }
            updateHUD();
            return false;
          }

          return ring.y < platformerCanvas.height + 40;
        });

        if (platformerGame.boss) {
          const boss = platformerGame.boss;
          boss.x += boss.dir * boss.speed;
          if (boss.x < 1800 || boss.x > platformerGame.width - 200) boss.dir *= -1;

          if (p.x < boss.x + boss.width && p.x + p.width > boss.x && p.y < boss.y + boss.height && p.y + p.height > boss.y) {
            if (p.velocityY > 0 && p.y + p.height - boss.y < 20) {
              boss.health -= 1;
              p.velocityY = -9;
              if (boss.health <= 0) {
                platformerGame.score += 100;
                platformerGame.running = false;
                alert('Boss defeated! ' + boss.name + ' down. Final rings: ' + platformerGame.score);
                return;
              }
            } else {
              takeHit();
            }
          }
        }

        for (const enemy of platformerGame.enemies) {
          enemy.x += enemy.dir * 2;
          if (enemy.x < 200 || enemy.x > platformerGame.width - 200) enemy.dir *= -1;
          if (p.x < enemy.x + enemy.width && p.x + p.width > enemy.x && p.y < enemy.y + enemy.height && p.y + p.height > enemy.y) {
            takeHit();
            break;
          }
        }

        for (const tv of platformerGame.tvBoxes) {
          if (p.x < tv.x + tv.width && p.x + p.width > tv.x && p.y < tv.y + tv.height && p.y + p.height > tv.y) {
            takeHit();
            break;
          }
        }

        if (p.y > platformerCanvas.height + 100) {
          platformerGame.running = false;
          alert('Game Over! Rings: ' + platformerGame.score);
          return;
        }
      }

      const goal = platformerGame.goal;
      if (!platformerGame.clearing && p.x + p.width > goal.x && p.y + p.height > goal.y && p.y < goal.y + goal.height) {
        platformerGame.clearing = true;
        platformerGame.clearTimer = 550;
        p.velocityX = 0;
        p.velocityY = 0;
      }

      drawBackground();

      platformerCtx.fillStyle = '#8B4513';
      platformerGame.platforms.forEach(plat => {
        const drawX = plat.x - cameraX;
        platformerCtx.fillRect(drawX, plat.y, plat.width, plat.height);
      });

      platformerGame.loops.forEach(loop => {
        const drawX = loop.x - cameraX;
        platformerCtx.strokeStyle = '#f8fafc';
        platformerCtx.lineWidth = 10;
        platformerCtx.beginPath();
        platformerCtx.arc(drawX, loop.y, loop.radius, 0, Math.PI * 2);
        platformerCtx.stroke();
        platformerCtx.strokeStyle = '#0f172a';
        platformerCtx.lineWidth = 4;
        platformerCtx.beginPath();
        platformerCtx.arc(drawX, loop.y, loop.radius - 15, 0, Math.PI * 2);
        platformerCtx.stroke();
      });

      platformerGame.checkpoints.forEach(cp => {
        const drawX = cp.x - cameraX;
        drawStarPost(cp, drawX + 10);
      });

      platformerCtx.fillStyle = '#facc15';
      platformerGame.rings.forEach(ring => {
        const drawX = ring.x - cameraX;
        drawRing(drawX + 10, ring.y + 10, 10);
      });

      platformerGame.droppedRings.forEach(ring => {
        const drawX = ring.x - cameraX;
        drawRing(drawX, ring.y, ring.radius);
      });

      platformerGame.enemies.forEach(enemy => {
        const drawX = enemy.x - cameraX;
        drawEnemySprite(drawX, enemy.y);
      });

      platformerGame.tvBoxes.forEach(tv => {
        const drawX = tv.x - cameraX;
        platformerCtx.fillStyle = '#1f2937';
        platformerCtx.fillRect(drawX, tv.y, tv.width, tv.height);
        platformerCtx.fillStyle = '#7dd3fc';
        platformerCtx.fillRect(drawX + 4, tv.y + 4, tv.width - 8, tv.height - 8);
        platformerCtx.strokeStyle = '#f8fafc';
        platformerCtx.beginPath();
        platformerCtx.moveTo(drawX + tv.width / 2, tv.y - 6);
        platformerCtx.lineTo(drawX + tv.width / 2, tv.y - 18);
        platformerCtx.stroke();
      });

      if (platformerGame.boss) {
        const boss = platformerGame.boss;
        const bossX = boss.x - cameraX;
        drawBoss(boss, bossX);
      }

      drawSign(platformerGame.sign);

      if (platformerGame.clearing) {
        platformerCtx.fillStyle = '#facc15';
        platformerCtx.font = 'bold 18px Arial';
        platformerCtx.fillText('STAGE CLEAR!', 290, 70);
      }

      platformerCtx.fillStyle = '#22c55e';
      const goalX = goal.x - cameraX;
      platformerCtx.fillRect(goalX, goal.y, goal.width, goal.height);

      const drawPlayerX = p.x - cameraX;
      drawPlayerSprite(drawPlayerX, p.y);

      updateHUD();
      setTimeout(platformerGameLoop, 30);
    }

    function drawBackground() {
      const theme = LEVELS[levelIndex].theme;
      platformerCtx.clearRect(0, 0, platformerCanvas.width, platformerCanvas.height);
      platformerCtx.fillStyle = theme.sky;
      platformerCtx.fillRect(0, 0, platformerCanvas.width, platformerCanvas.height);

      platformerCtx.fillStyle = '#ffffff';
      for (let i = 0; i < 7; i++) {
        const x = ((i * 180) - (cameraX * 0.3)) % (platformerCanvas.width + 200);
        platformerCtx.beginPath();
        platformerCtx.arc(x, 80, 28, 0, Math.PI * 2);
        platformerCtx.fill();
      }

      platformerCtx.fillStyle = theme.hill;
      platformerCtx.beginPath();
      platformerCtx.moveTo(0, 330);
      platformerCtx.quadraticCurveTo(150, 180, 300, 330);
      platformerCtx.quadraticCurveTo(500, 160, 700, 330);
      platformerCtx.quadraticCurveTo(820, 150, 980, 330);
      platformerCtx.quadraticCurveTo(1180, 170, 1380, 330);
      platformerCtx.quadraticCurveTo(1600, 180, 1820, 330);
      platformerCtx.lineTo(800, 400);
      platformerCtx.lineTo(0, 400);
      platformerCtx.closePath();
      platformerCtx.fill();

      platformerCtx.fillStyle = theme.hill2;
      platformerCtx.beginPath();
      platformerCtx.moveTo(0, 360);
      platformerCtx.quadraticCurveTo(260, 220, 440, 360);
      platformerCtx.quadraticCurveTo(660, 230, 900, 360);
      platformerCtx.quadraticCurveTo(1160, 220, 1400, 360);
      platformerCtx.quadraticCurveTo(1550, 230, 1800, 360);
      platformerCtx.lineTo(800, 400);
      platformerCtx.lineTo(0, 400);
      platformerCtx.closePath();
      platformerCtx.fill();

      platformerCtx.fillStyle = theme.ground;
      platformerCtx.fillRect(0, 380, platformerCanvas.width, 30);
    }
  </script>
</body>
